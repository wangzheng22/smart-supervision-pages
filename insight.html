<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>概览视图</title>
  <script>if (new URLSearchParams(location.search).get("bare") === "1") document.documentElement.classList.add("is-bare");</script>
  <link rel="stylesheet" href="shell.css?v=4" />
  <script src="shell.js?v=5" defer></script>
  <style>
    :root {
      --ink: #16324f;
      --muted: #6d7f95;
      --line: #e4ebf5;
      --blue: #2f78f6;
      --blue-deep: #0e3d78;
      --risk: #ef3b3b;
      --panel: 300px;
      --shadow: 0 10px 30px rgba(22, 62, 112, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #e6e8ec;
    }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid rgba(47, 120, 246, 0.35);
      outline-offset: 1px;
    }

    .topbar {
      flex: none;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: #fff;
      border-bottom: 1px solid #e6eaf0;
    }
    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-left { flex: 1; min-width: 0; }
    .top-right { flex: none; gap: 8px; }
    .brand {
      flex: none;
      display: flex;
      align-items: center;
      line-height: 0;
    }
    html.is-bare .top-left .brand { display: none; }
    .logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: block;
    }
    .switch button {
      height: 32px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
      color: #3d4e64;
      font-size: 13px;
    }
    .subject {
      min-width: 0;
      font-size: 16px;
      font-weight: 650;
      color: #24364c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search {
      width: 280px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
    }
    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      font-size: 13px;
      color: var(--ink);
      background: transparent;
    }
    .search svg { flex: none; color: #8b97a6; }
    .pack, .god {
      height: 32px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 13px;
      flex: none;
    }
    .pack { border: 0; background: var(--blue); color: #fff; }
    .pack:hover { background: #1f6feb; }
    .god { border: 1px solid #b9d0fb; background: #eef4ff; color: #1f6feb; }
    .pack-dialog {
      width: min(640px, calc(100vw - 32px));
      max-height: min(86vh, 820px);
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: 10px;
      color: var(--ink);
      box-shadow: 0 18px 48px rgba(22, 62, 112, 0.18);
    }
    .pack-dialog::backdrop { background: rgba(16, 32, 54, 0.45); }
    .pack-dialog form { display: flex; flex-direction: column; max-height: min(86vh, 820px); }
    .pack-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
    }
    .pack-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .pack-x {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #6d7f95;
      font-size: 18px;
      line-height: 1;
    }
    .pack-x:hover { background: #f3f6fa; color: var(--ink); }
    .pack-body { overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 8px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field .lab { font-size: 13px; color: #3d4e64; }
    .field input[type="text"],
    .field textarea,
    .field select,
    .field input[type="file"] {
      width: 100%;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
    }
    .field input[type="text"],
    .field select { height: 34px; padding: 0 10px; }
    .field textarea { min-height: 112px; padding: 8px 10px; resize: vertical; line-height: 1.65; }
    .field input[readonly] { background: #f6f8fb; color: #3d4e64; }
    .field .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .field .check { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; color: #3d4e64; }
    .field .hint { margin: 0; font-size: 12px; color: #8b97a6; line-height: 1.5; }
    .field .err { margin: 0; font-size: 12px; color: var(--risk); }
    .file-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .file-list:empty { display: none; }
    .file-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid #e4ebf5;
      border-radius: 6px;
      background: #f6f8fb;
      font-size: 13px;
      color: #24364c;
    }
    .file-list li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-list button {
      flex: none;
      height: 24px;
      padding: 0 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #c43745;
      font-size: 12px;
    }
    .file-list button:hover { background: rgba(239, 59, 59, 0.08); }
    .pack-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
    .pack-saved { margin: 0; color: #6b7c90; font-size: 12px; white-space: nowrap; }
    .pack-actions { display: flex; gap: 8px; }
    .pack-foot button { height: 32px; padding: 0 16px; border-radius: 6px; font-size: 13px; }
    .pack-foot .ghost { border: 1px solid #d7dee8; background: #fff; color: #3d4e64; }
    .pack-foot .ok { border: 0; background: var(--blue); color: #fff; }
    .pack-foot .ok:hover { background: #1f6feb; }
    .switch { display: flex; }
    .switch button {
      width: 36px;
      border-radius: 0;
      color: #5e7088;
    }
    .switch button:first-child { border-radius: 6px 0 0 6px; }
    .switch button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
    .switch button.is-on {
      background: #eef4ff;
      color: var(--blue);
      border-color: #b9d0fb;
      position: relative;
      z-index: 1;
    }

    .workspace {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(1200px 760px at 10% -8%, #ffffff 0%, rgba(255, 255, 255, 0) 58%),
        radial-gradient(1000px 700px at 92% 4%, #e9e1ff 0%, rgba(233, 225, 255, 0) 60%),
        radial-gradient(1100px 900px at 74% 108%, #d9e6ff 0%, rgba(217, 230, 255, 0) 62%),
        linear-gradient(158deg, #f7f9fd 0%, #eaeffb 46%, #e5ecfa 100%);
      perspective: 1700px;
      perspective-origin: 50% 42%;
    }

    .plane {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1120px;
      height: 700px;
      transform: translate(calc(-50% + var(--shift-x, 0px)), calc(-50% + var(--shift-y, 0px))) scale(var(--scale, 1));
      transform-origin: center center;
    }
    .plane.is-hidden { display: none; }
    .viz-frame {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }
    .viz-frame[hidden] { display: none; }
    .graph-tools {
      position: absolute;
      top: 14px;
      left: 60px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: min(720px, calc(100% - 80px));
    }
    .workspace:has(.dock.left.open) .graph-tools { left: 360px; }
    #wires {
      position: absolute;
      inset: 0;
      width: 1120px;
      height: 700px;
      overflow: visible;
      pointer-events: none;
      z-index: 3;
    }
    .wire { fill: none; stroke: #b7c0cb; stroke-width: 1.5; stroke-linecap: round; }
    .wire.is-hot { stroke: #e10600; stroke-width: 4.5; }
    .wire.is-dim { opacity: 0.15; }

    .node {
      position: absolute;
      z-index: 2;
      color: #2c3b4e;
      padding: 16px 18px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      background: transparent;
      border: 0;
      box-shadow: none;
      overflow: visible;
    }
    .node::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: #fff;
      border: 1px solid #cfd6de;
      transform: skewY(-26deg);
      transform-origin: center center;
      box-shadow: 0 10px 22px rgba(40, 58, 82, 0.08);
    }
    .node.is-dim { opacity: 0.2; }
    .node.is-on::before { box-shadow: 0 0 0 2px var(--blue), 0 10px 22px rgba(40, 58, 82, 0.08); }
    .node .tag {
      position: absolute;
      top: 50%;
      right: 20px;
      width: 1.15em;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 650;
      line-height: 1;
      letter-spacing: 0.18em;
      transform: translateY(-50%);
    }
    .node.kind-owner,
    .node.kind-agency { justify-content: center; padding-right: 52px; }
    .node.has-grid { padding: 0; }
    .node.has-grid .grid { position: absolute; }
    .win-mark {
      position: absolute;
      z-index: 3;
      display: block;
      width: 18px;
      height: auto;
      pointer-events: none;
    }
    .swatch {
      width: 16px;
      height: 42px;
      background: #d7f3cf;
      flex: none;
      transform: skewY(-26deg);
      transform-origin: center center;
    }
    .node.kind-project {
      color: #fff;
      justify-content: center;
      align-items: center;
      padding: 0;
    }
    .node.kind-project::before { background: #2f78f6; border-color: #2a6adf; }
    .node.kind-project .tag { letter-spacing: 0.42em; font-size: 18px; right: 16px; }
    .node.kind-project .arrow { width: 26px; height: 34px; flex: none; }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 18px);
      column-gap: 7px;
      row-gap: 12px;
    }
    .node.kind-expert .grid { grid-template-columns: repeat(4, 18px); }
    .node.kind-builder .grid,
    .node.kind-supervisor .grid { grid-template-columns: repeat(3, 16px); gap: 6px; }
    .cell {
      width: 18px;
      height: 18px;
      background: #d3efc8;
      border: 0;
      padding: 0;
      transform: translateY(var(--shift, 0px)) skewY(-26deg);
      transform-origin: center center;
    }
    .node.kind-builder .cell,
    .node.kind-supervisor .cell { width: 16px; height: 16px; }
    .cell.is-risk { background: #ef3d3d; }
    .cell.is-on { box-shadow: 0 0 0 2px #16324f; }

    .sheet {
      display: none;
      position: absolute;
      inset: 16px 16px 16px 52px;
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: auto;
    }
    .sheet.is-on { display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #eef2f6; }
    th { position: sticky; top: 0; background: #f7f9fc; color: #6d7f95; font-weight: 600; }
    td .hot { color: var(--risk); font-weight: 600; }
    .sheet .empty { padding: 28px; color: var(--muted); text-align: center; }

    .dock {
      position: absolute;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      z-index: 5;
      transition: transform 0.28s ease;
    }
    .dock.left { left: 0; transform: translateX(calc(-100% + 44px)); }
    .dock.left.open { transform: translateX(8px); }
    .tab-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .tab {
      width: 36px;
      padding: 14px 0;
      border: 1px solid #e1e6ee;
      border-radius: 6px;
      background: #fff;
      color: #5c6b7e;
      font-size: 13px;
      letter-spacing: 0.18em;
      writing-mode: vertical-rl;
    }
    .tab.is-on { color: var(--blue); border-color: #b9d0fb; }
    .panel {
      width: var(--panel);
      height: calc(100% - 24px);
      margin-top: 12px;
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: auto;
      padding: 16px 16px 20px;
    }
    .panel-name {
      margin: 0 0 14px;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 650;
    }
    .panel .tabs {
      display: flex;
      gap: 0;
      margin: 0 0 16px;
      padding: 0 4px;
      background: #f3f5f8;
      border-radius: 6px;
    }
    .panel .tabs button {
      flex: 1;
      height: 34px;
      padding: 0;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #6d7f95;
      font-size: 14px;
    }
    .panel .tabs button.is-on {
      color: var(--blue);
      border-bottom-color: var(--blue);
      font-weight: 650;
    }
    .panel .warn-dot { display: none; }
    .panel .tabs button.has-warn .warn-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-left: 4px;
      border-radius: 50%;
      background: var(--risk);
      vertical-align: 1px;
    }
    .panel .attr {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 14px 12px;
      margin: 0;
      font-size: 13px;
    }
    .panel .attr dt { color: #8b97a6; }
    .panel .attr dd { margin: 0; color: #24364c; text-align: right; word-break: break-all; }
    .panel .vline {
      margin: 2px 0 0;
      padding: 0;
      list-style: none;
    }
    .panel .vline li {
      display: grid;
      grid-template-columns: 18px auto minmax(0, 1fr);
      column-gap: 10px;
      align-items: start;
      min-height: 52px;
    }
    .panel .vline time {
      padding-top: 1px;
      font-size: 12px;
      line-height: 18px;
      color: #8b97a6;
      white-space: nowrap;
    }
    .panel .vline .rail {
      position: relative;
      display: flex;
      justify-content: center;
    }
    .panel .vline .rail::before {
      content: "";
      position: absolute;
      top: 14px;
      bottom: -4px;
      width: 2px;
      background: #d7e0ea;
    }
    .panel .vline li:last-child .rail::before { display: none; }
    .panel .vline .rail i {
      position: relative;
      z-index: 1;
      width: 10px;
      height: 10px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 3px #e8f1ff;
    }
    .panel .vline b {
      display: block;
      text-align: right;
      font-size: 14px;
      font-weight: 650;
      line-height: 18px;
      color: #24364c;
    }
    .kicker { margin: 0; font-size: 12px; color: #8b97a6; }
    .panel h2 { margin: 6px 0 12px; font-size: 18px; line-height: 1.4; }
    .warn-list { display: flex; flex-direction: column; gap: 10px; }
    .warn-card {
      display: block;
      width: 100%;
      padding: 12px 12px 12px 14px;
      border: 1px solid #f0b4bc;
      border-radius: 10px;
      background: linear-gradient(180deg, #fff8f9 0%, #ffecef 100%);
      box-shadow: 0 8px 18px rgba(226, 61, 85, 0.06);
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    .warn-card.high {
      border-color: #f3c4cb;
      background: linear-gradient(180deg, #fff8f9 0%, #ffecef 100%);
      box-shadow: 0 8px 18px rgba(226, 61, 85, 0.06);
    }
    .warn-card.mid {
      border-color: #f3d7b0;
      background: linear-gradient(180deg, #fffaf4 0%, #fff1e2 100%);
      box-shadow: 0 8px 18px rgba(229, 146, 42, 0.06);
    }
    .warn-card.low {
      border-color: #b7dfcc;
      background: linear-gradient(180deg, #f6fdf9 0%, #e7f6ee 100%);
      box-shadow: 0 8px 18px rgba(47, 158, 107, 0.06);
    }
    .warn-card.high.on {
      border-color: #e23d55;
      box-shadow: 0 0 0 1px #e23d55, 0 10px 22px rgba(226, 61, 85, 0.12);
    }
    .warn-card.mid.on {
      border-color: #e5922a;
      box-shadow: 0 0 0 1px #e5922a, 0 10px 22px rgba(229, 146, 42, 0.12);
    }
    .warn-card.low.on {
      border-color: #2f9e6b;
      box-shadow: 0 0 0 1px #2f9e6b, 0 10px 22px rgba(47, 158, 107, 0.12);
    }
    .warn-head { display: flex; align-items: flex-start; gap: 8px; }
    .warn-card .sev {
      display: inline-flex;
      align-items: center;
      flex: none;
      height: 20px;
      margin-top: 1px;
      padding: 0 6px;
      border-radius: 4px;
      background: #fff1f3;
      color: #e23d55;
      font-size: 12px;
      font-weight: 600;
    }
    .warn-card h3 { margin: 0; flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; font-weight: 650; color: #e23d55; }
    .warn-card.mid .sev { background: #fff4e8; color: #e5922a; }
    .warn-card.mid h3 { color: #e5922a; }
    .warn-card.low .sev { background: #eef8f3; color: #2f9e6b; }
    .warn-card.low h3 { color: #2f9e6b; }
    .warn-card .who { margin: 8px 0 4px; font-size: 12px; color: #3d5166; }
    .warn-card p { margin: 0; font-size: 12px; line-height: 1.55; color: #6d7f95; }
    .warn-foot { display: flex; justify-content: flex-end; margin-top: 10px; }
    .clue-mini, .clue-fab {
      border: 1px solid #c5d8fb;
      background: #f3f7ff;
      color: var(--blue);
      border-radius: 6px;
      font-size: 12px;
    }
    .clue-mini { height: 26px; padding: 0 10px; }
    .clue-mini:hover, .clue-fab:hover { background: #e7f0ff; }
    .warn-empty { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
    .clue-fab {
      flex: none;
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
      box-shadow: 0 6px 16px rgba(47, 120, 246, 0.12);
    }
    .warn-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 12px; }
    .panel .warn-title h2 { margin: 0; }
    .clue-fab[hidden] { display: none; }
    .report-tab { position: absolute; top: 12px; right: 12px; z-index: 9; }
    .report {
      position: absolute;
      top: 12px;
      right: 56px;
      bottom: 12px;
      width: min(440px, calc(100% - 24px));
      z-index: 8;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(22, 62, 112, 0.16);
      transform: translateX(calc(100% + 120px));
      transition: transform 0.28s ease;
      pointer-events: none;
    }
    .report.is-open { transform: none; pointer-events: auto; }
    .report-head {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #e8eef6;
    }
    .report-head h2 { margin: 0; font-size: 16px; }
    .report-x {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #6d7f95;
      font-size: 20px;
      line-height: 1;
    }
    .report-x:hover { background: #f4f7fb; }
    .report-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 8px; }
    .report-conclusion {
      flex: none;
      display: flex;
      flex-direction: column;
      height: 210px;
      min-height: 128px;
      padding: 14px 16px 0;
      border-bottom: 1px solid #e8eef6;
    }
    .report-conclusion textarea {
      flex: 1;
      min-height: 0;
      margin: 8px 0 0;
      resize: none;
    }
    .report-grip {
      flex: none;
      height: 14px;
      margin: 0 -16px;
      border: 0;
      background: transparent;
      cursor: ns-resize;
      position: relative;
    }
    .report-grip::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 5px;
      width: 36px;
      height: 3px;
      margin-left: -18px;
      border-radius: 2px;
      background: #d5deea;
    }
    .report-grip:hover::before { background: #9eb6de; }
    .report-sec h3, .process-toggle {

    .clue-item {

    .clue-top .sev {

    .report-bar {

      display: flex;

    .report-set { position: relative; flex: none; }

    }
    .report-set > button[aria-expanded="true"] { border-color: #b9d0fb; color: var(--blue); background: #f3f7ff; }

    .report-go { border: 0; background: var(--blue); color: #fff; }

    .set-pop {
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      width: 280px;
      padding: 12px;
      display: grid;
      gap: 10px;
      background: #fff;
      border: 1px solid #e6ebf2;
      border-radius: 10px;
      box-shadow: var(--shadow);
    }
    .set-pop[hidden] { display: none; }
    .set-pop label { display: grid; gap: 4px; font-size: 12px; color: #6d7f95; }
    .set-pop select {
      height: 32px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      padding: 0 8px;
      color: #24364c;
      background: #fff;
    }
    .set-pop .check { font-size: 13px; color: #3d4e64; }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      background: #fff1f1;
      color: var(--risk);
      font-size: 12px;
      font-weight: 600;
    }
    .badge.mid { background: #fff7ed; color: #d97706; }
    .facts { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
    .facts li {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      font-size: 13px;
    }
    .facts span { color: var(--muted); }
    .note {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #fff6f6;
      color: #b43343;
      font-size: 13px;
      line-height: 1.55;
    }
    .filter-list { display: grid; gap: 8px; margin-top: 8px; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #3d4e64;
    }
    .summary { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.6; }

    .time-panel {
      flex: none;
      height: auto;
      max-height: 62vh;

      padding: 10px 16px 12px;

      flex-direction: column;
      min-width: 0;
    }
    .time-head {
      flex: none;
      display: flex;

      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .time-name { font-size: 13px; color: #8b97a6; flex: none; }
    .time-head .warn-empty { margin: 0; white-space: nowrap; }
    .time-scroll { flex: 1; min-height: 0; overflow: auto; }
    .time-stage { position: relative; min-width: 860px; }
    .time-body { position: relative; height: 140px; min-width: 860px; margin: 0 12px; }
    .time-body.has-pins { height: var(--body, 180px); }
    .time-body.has-pins .axis { top: var(--axis); }
    .time-body.has-pins .dot { top: calc(var(--axis) - 4px); }

    .time-body.has-pins .pill.lane-1 { top: calc(var(--axis) + 56px); }
    .warn-pin {
      position: absolute;
      z-index: 3;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      width: 248px;
      max-width: 248px;
      margin: 0;
      padding: 0 4px 0 3px;

    .warn-pin .sev {

      padding: 0 4px;

      color: #e23d55;
      font-size: 11px;
      line-height: 18px;
      font-weight: 650;
    }
    .warn-pin b {
      flex: 1;
      min-width: 0;

      white-space: nowrap;
      font-size: 12px;
      font-weight: 650;
      text-align: left;
    }
    .warn-pin .deal {
      flex: none;

      padding: 0 4px;
      border-radius: 3px;
      font-size: 11px;
      line-height: 18px;
      font-weight: 650;
    }
    .warn-pin .deal.is-pending { background: #fff6eb; color: #e5922a; }
    .warn-pin .deal.is-ignore { background: #f4f5f7; color: #8b97a6; }
    .warn-pin .deal.is-clue { background: #eef4ff; color: #2f78f6; }
    .warn-pin .deal.is-done { background: #eef8f3; color: #2f9e6b; }
    .warn-pin .pin-add {
      flex: none;
      margin-left: auto;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #1f6feb;
      color: #fff;
      font-size: 14px;
      line-height: 14px;
      text-align: center;
      font-weight: 700;
    }
    .pin-add-tip {
      position: fixed;
      z-index: 80;
      padding: 2px 8px;
      border-radius: 4px;
      background: #24364c;
      color: #fff;
      font-size: 12px;
      line-height: 20px;
      white-space: nowrap;
      pointer-events: none;
    }
    .warn-pin.mid { border-color: #f5d7b4; color: #e5922a; }
    .warn-pin.mid .sev { background: #fff4e8; color: #e5922a; }
    .warn-pin.low { border-color: #c9e6d6; color: #2f9e6b; }
    .warn-pin.low .sev { background: #eef8f3; color: #2f9e6b; }
    .warn-pin.on { box-shadow: 0 0 0 2px currentColor; }
    .warn-pin.has-stem::after {

      top: 100%;

    .warn-pin .more {
      flex: none;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: #24364c;

      line-height: 18px;

    }
    .pin-hold { position: absolute; z-index: 4; }

    .warn-pop {

      z-index: 40;

    .band {
      position: absolute;
      top: 0;
      height: 22px;
      border-radius: 4px;

      color: #e25b6a;

      align-items: center;

      white-space: nowrap;
      padding: 0 8px;
    }

    .axis {

      right: 8px;
      top: 100px;
      height: 4px;
      border-radius: 4px;
      background: var(--blue);

<body>
  <header class="topbar">
    <div class="top-left">
      <a class="brand" href="cockpit.html" title="返回首页">
        <img class="logo" src="logo.png" alt="工程交易" />
      </a>
      <div class="subject" id="subject"></div>
    </div>
    <div class="top-right">
      <label class="search">
        <input id="search" type="search" placeholder="请输入项目名称/编号/主体名/人名" />
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </label>
      <button class="god" id="analysisView" type="button">分析视图</button>
      <div class="switch" role="group" aria-label="视图切换">
        <button id="modeGraph" type="button" class="is-on" aria-pressed="true">图</button>
        <button id="modeTable" type="button" aria-pressed="false">表</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <iframe class="viz-frame" id="vizFrame" title="关系图"></iframe>
    <div class="plane" id="plane">
      <svg id="wires" viewBox="0 0 1120 700"></svg>
    </div>
    <div class="sheet" id="sheet">
      <table>
        <thead>
          <tr><th>主体</th><th>角色</th><th>关系</th><th>关联对象</th><th>状态</th></tr>
        </thead>
        <tbody id="sheetBody"></tbody>
      </table>
    </div>

    <div class="dock left open" id="dockLeft">
      <aside class="panel" id="detailPanel" aria-label="详情"></aside>
      <div class="tab-col">
        <button class="tab is-on" id="tabDetail" type="button">详情</button>
      </div>
    </div>
    <div class="graph-tools" id="graphTools">
      <button class="clue-fab" id="clueFab" type="button" hidden>添加线索</button>
    </div>
    <button class="tab report-tab" id="reportTab" type="button">线索报告</button>
    <aside class="report" id="reportDrawer" aria-labelledby="reportTitle">
      <div class="report-head">
        <h2 id="reportTitle">线索报告</h2>
        <button class="report-x" id="reportClose" type="button" aria-label="关闭">×</button>
      </div>
      <section class="report-sec report-conclusion" id="reportConclusionBox">
        <h3>描述及AI查办指引</h3>
        <textarea id="reportConclusion" aria-label="描述及AI查办指引" placeholder="暂未能自动总结原因，请输入描述及查办指引"></textarea>
        <button class="report-grip" id="reportGrip" type="button" aria-label="调整结论区域高度"></button>
      </section>
      <div class="report-body">
        <section class="report-process" id="reportProcess">
          <div class="process-head">
            <h3>分析过程<b id="processCount">0</b></h3>
            <button class="fold-all" id="foldAll" type="button">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6.2l5 4.6 5-4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>全部展开</span>
            </button>
          </div>
          <div class="process-body" id="processBody"></div>
        </section>
        <section class="report-sec report-files">
          <h3>附件</h3>
          <label class="attach-pick">
            上传附件
            <input id="reportFiles" type="file" multiple accept=".pdf,.xls,.xlsx,.doc,.docx,.jpg,.jpeg,.png,.gif,.webp,.mp4,.mov,.avi,.mp3,.wav,.zip,.txt,.csv,.html,.htm" />
          </label>
          <p class="hint">可一次选择多个文件，也能继续追加</p>
          <ul class="file-list" id="reportFileList"></ul>
        </section>
      </div>
      <div class="report-bar">
        <div class="report-set">
          <button id="reportSettings" type="button" aria-expanded="false" aria-controls="setPop">设置</button>
          <div class="set-pop" id="setPop" hidden>
            <label>格式
              <select id="reportFormat">
                <option value="pdf">pdf</option>
                <option value="word">word</option>
              </select>
            </label>
          </div>
        </div>
        <p class="report-status" id="reportStatus"></p>
        <button class="report-go" id="reportGo" type="button">生成报告</button>
      </div>
    </aside>
  </main>

  <section class="time-panel" id="timePanel" aria-label="时序图">
    <div class="time-head">

    </div>
    <div class="time-scroll">
      <div class="time-stage" id="timeStage">
        <div class="time-body" id="timeBody"></div>
      </div>
    </div>
  </section>

  </section>

  <dialog class="pack-dialog" id="packDialog" aria-labelledby="packTitle">
    <form id="packForm">
      <div class="pack-head">
        <h2 id="packTitle">线索打包</h2>
        <button class="pack-x" id="packClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="pack-body">
        <div class="pair">
          <div class="field">
            <span class="lab">线索名称</span>
            <input id="clueName" type="text" maxlength="80" placeholder="请输入线索名称" />
            <p class="err" id="clueErr" hidden>请填写线索名称</p>
          </div>
          <div class="field">
            <span class="lab">线索编号</span>
            <input id="clueNo" type="text" readonly />
          </div>
        </div>
        <div class="field">
          <span class="lab">线索描述</span>
          <textarea id="clueDesc"></textarea>
        </div>
        <div class="field">
          <span class="lab">线索内容</span>
          <div class="checks">
            <label class="check"><input type="checkbox" name="content" value="当前视图内容" checked />当前视图内容</label>
            <label class="check"><input type="checkbox" name="content" value="属性" checked />属性</label>
            <label class="check"><input type="checkbox" name="content" value="时序" checked />时序</label>
            <label class="check"><input type="checkbox" name="content" value="预警" checked />预警</label>
          </div>
        </div>
        <div class="field">
          <span class="lab">线索形式</span>
          <div class="checks">
            <label class="check"><input type="checkbox" name="form" value="分析图" checked />分析图</label>
            <label class="check"><input type="checkbox" name="form" value="数据表" checked />数据表</label>
          </div>
        </div>
        <div class="field">
          <span class="lab">其他资料上传</span>
          <input id="clueFiles" type="file" multiple accept=".pdf,.xls,.xlsx,.jpg,.jpeg,.png,.mov,.avi,.mp4,.mp3,.html,.htm,.doc,.docx,.gif,.webp,.wav,.zip,.txt,.csv" />
          <p class="hint">支持 pdf、xls、jpg、png、mov、avi、mp4、mp3、html 等常用格式，可多次添加</p>
          <ul class="file-list" id="fileList"></ul>
        </div>
        <div class="field">
          <span class="lab">责任部门</span>
          <select id="clueDept">
            <option>贵州省公共资源交易中心</option>
            <option>贵阳市公共资源交易中心</option>
            <option>遵义市公共资源交易中心</option>
            <option>六盘水市公共资源交易中心</option>
            <option>贵州省住房和城乡建设厅</option>
            <option>贵州省交通运输厅</option>
            <option>贵州省水利厅</option>
          </select>
          <p class="hint">已推荐贵州省公共资源交易中心，可按管辖调整</p>
        </div>
      </div>
      <div class="pack-foot">
        <p class="pack-saved" id="packSaved">上次保存：—</p>
        <div class="pack-actions">
          <button class="ghost" id="packCancel" type="button">取消</button>
          <button class="ok" type="submit">打包下载</button>
          <button class="ghost" id="packDraft" type="button">暂存</button>
        </div>
      </div>
    </form>

    function swatchCenter(node) {
      const padLeft = 18;
      const padRight = 52;
      const swatchW = 16;
      const x = node.x + padLeft + (node.w - padLeft - padRight - swatchW) / 2 + swatchW / 2;
      return [x, node.y + node.h / 2];
    }

    function cellCenter(node, index) {
      const box = node.gridLayout;
      const spec = box.spec;
      const col = index % spec.cols;
      const row = Math.floor(index / spec.cols);
      const rowPitch = spec.cell + spec.rowGap;
      const shift = col * box.pitch * cardSkew;
      const x = node.x + box.gx + col * box.pitch + spec.cell / 2;
      const y = node.y + box.gy + box.lift + row * rowPitch + spec.cell / 2 + shift;
      return [x, y];
    }

    function pin(node, link, index, count) {
      if (node.cells && node.gridLayout) {
        let cellIndex = -1;
        if (link.abnormal) {
          const win = node.cells.findIndex((cell) => cell.win);
          const risk = node.cells.findIndex((cell) => cell.risk);
          cellIndex = win >= 0 ? win : risk;
        } else if (count > 1) {
          const cols = node.gridLayout.spec.cols;
          const rows = Math.ceil(node.cells.length / cols);
          const row = rows === 1 ? 0 : Math.round(index * (rows - 1) / (count - 1));
          cellIndex = Math.min(node.cells.length - 1, row * cols);
        }
        if (cellIndex >= 0) return cellCenter(node, cellIndex);
        return plateCenter(node);
      }
      if (node.kind === "owner" || node.kind === "agency") return swatchCenter(node);
      return plateCenter(node);
    }

        const count = link.fan || 1;
        const spreads = (!link.abnormal && count > 1 && ((from.cells && from.gridLayout) || (to.cells && to.gridLayout))) ? count : 1;
        for (let index = 0; index < spreads; index += 1) {
          const [x1, y1] = pin(from, link, index, count);
          const [x2, y2] = pin(to, link, index, count);
          let d = "M " + x1 + " " + y1 + " L " + x2 + " " + y2;
          if (link.curve) {
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2 + link.curve;
            d = "M " + x1 + " " + y1 + " Q " + mx + " " + my + " " + x2 + " " + y2;
          }
          const cls = "wire" + (link.abnormal ? " is-hot" : "") + (dim ? " is-dim" : "");
          paths.push('<path class="' + cls + '" d="' + d + '"></path>');
        }

    }

    function layoutGridCard(node) {
      const spec = gridSpec(node);
      const rows = Math.max(1, Math.ceil(node.cells.length / spec.cols));
      const pitch = spec.cell + spec.colGap;
      const rowPitch = spec.cell + spec.rowGap;
      const gridWidth = spec.cols * spec.cell + (spec.cols - 1) * spec.colGap;
      const lift = (spec.cols - 1) * pitch * -cardSkew;
      const labels = 1;
      const labelW = 16;
      const labelGap = 16;
      const edge = 20;
      const gx = edge;
      const labelsWidth = labels * labelW + Math.max(0, labels - 1) * labelGap;
      const width = gx + gridWidth + edge + labelsWidth + edge;
      const half = spec.cell / 2;
      const gy = edge - lift + half * cardSkew - (width / 2 - gx) * cardSkew;
      const contentBottom = lift + (rows - 1) * rowPitch + spec.cell;
      const height = edge + gy + contentBottom - half * cardSkew - (gx - width / 2) * cardSkew;
      node.w = width;
      node.h = height;
      node.gridLayout = { gx, gy, lift, pitch, spec, labelW, labelGap, edge, gridWidth };
    }

    function gridHtml(node) {
      const box = node.gridLayout;
      const cols = box.spec.cols;
      const marks = [];
      const cells = (node.cells || []).map((cell, index) => {
        const on = state.selection && state.selection.id === node.id && state.selection.cell === index;
        const col = index % cols;
        const shift = (col * box.pitch * cardSkew).toFixed(2);
        if (cell.win) {
          const row = Math.floor(index / cols);
          const half = box.spec.cell / 2;
          const cellTop = box.lift + row * (box.spec.cell + box.spec.rowGap);
          const cellLeft = col * box.pitch;
          const markW = box.spec.cell;
          const markH = markW * 23 / 45;
          const top = cellTop + Number(shift) + half * cardSkew - markH * 0.62;
          const left = cellLeft + box.spec.cell - markW;
          marks.push('<img class="win-mark" alt="中标" src="img/中标.png" style="left:' + left.toFixed(1) + 'px;top:' + top.toFixed(1) + 'px;width:' + markW + 'px">');

      }).join("");
      return '<span class="grid" style="left:' + box.gx + 'px;top:' + box.gy + 'px;padding-top:' + box.lift + 'px;column-gap:' + box.spec.colGap + 'px;row-gap:' + box.spec.rowGap + 'px;grid-template-columns:repeat(' + cols + ', ' + box.spec.cell + 'px)">' + cells + marks.join("") + "</span>";

    const ALERT_PHASES = [
      [/应招未招|规避招标|虚构项目|批小招大/, /立项|备案/],
      [/澄清|量身定制|新代理/, /公告|发标|编制|委托/],
      [/突击注册/, /下载|招标文件|购标/],
      [/CA锁|特征码|相邻时间|报价异常|资质挂靠/, /递交|投标|开标/],
      [/打分偏离|查看标书|应回避/, /评标|评审|评分|打分/],
      [/排名变更|放弃中标|非候选人/, /公示|候选人|定标|中标结果|结果/],
      [/合同签订/, /合同/],
      [/保证金/, /通知书|合同/],
      [/施工许可|转包|分包/, /施工|竣工|许可/],
      [/投诉|多次入场|交易场所/, /开标|进场|入场/]
    ];

    function anchorEvent(title, events, anchor) {
      const dated = events.filter((event) => !event.bare && /\d/.test(event.text || ""));
      if (anchor) {
        const hit = dated.find((event) => event.label === anchor);
        if (hit) return hit;
      }
      for (let i = 0; i < ALERT_PHASES.length; i += 1) {
        if (!ALERT_PHASES[i][0].test(title || "")) continue;
        const hit = dated.find((event) => ALERT_PHASES[i][1].test(event.label || ""));
        if (hit) return hit;
      }
      return dated.length ? dated[Math.floor((dated.length - 1) / 2)] : (events[0] || null);
    }

    function layoutAlertPins(alerts, events, stageWidth) {
      const collide = 248 / stageWidth * 100;
      const items = alerts.map((alert) => {
        const event = anchorEvent(alert.title, events, alert.anchor);
        return { alert: alert, x: event ? event.pos * 100 : 50, when: event ? event.text : "" };
      }).sort((a, b) => a.x - b.x || String(a.alert.title).localeCompare(String(b.alert.title), "zh"));
      return stackPins(items, collide);
    }

    function stackPins(items, collide) {
      const columns = [];
      items.forEach((item) => {
        const last = columns[columns.length - 1];
        if (last && item.x < last.anchor + collide) last.items.push(item);
        else columns.push({ anchor: item.x, items: [item] });
      });
      const visible = [];
      columns.forEach((col) => {
        const xs = col.items.map((item) => item.x).sort((a, b) => a - b);
        const x = xs[Math.floor((xs.length - 1) / 2)];
        const count = Math.min(3, col.items.length);
        for (let lane = 0; lane < count; lane += 1) {
          const item = col.items[lane];
          item.lane = lane;
          item.x = x;
          item.stem = lane === count - 1;
          item.more = 0;
          item.group = null;
          if (col.items.length > 3 && lane === 2) {
            item.more = col.items.length - 3;
            item.group = col.items.slice();
          }
          visible.push(item);
        }
      });
      return { items: visible, lanes: visible.length ? 3 : 0 };
    }

    function pinTone(level) {
      return level === "中风险" ? "mid" : level === "低风险" ? "low" : "high";
    }

    const dealStates = ["未处置", "已忽略", "已转线索", "已办结"];
    const dealByAlert = {};
    function dealOf(id) {
      if (!dealByAlert[id]) {
        const key = String(id || "");
        let n = 0;
        for (let i = 0; i < key.length; i += 1) n = (n * 33 + key.charCodeAt(i)) >>> 0;
        dealByAlert[id] = dealStates[n % dealStates.length];
      }
      return dealByAlert[id];
    }
    function dealMark(id) {
      const deal = dealOf(id);
      const kind = deal === "已转线索" ? "is-clue" : deal === "已办结" ? "is-done" : deal === "已忽略" ? "is-ignore" : "is-pending";
      return '<span class="deal ' + kind + '">' + esc(deal) + "</span>";
    }
    function pinAdd(id) {
      if (dealOf(id) !== "未处置") return "";
      return '<span class="pin-add" data-add-clue="' + esc(id) + '">+</span>';
    }
    function pinAddTip() {
      let tip = document.getElementById("pinAddTip");
      if (!tip) {
        tip = document.createElement("div");
        tip.id = "pinAddTip";
        tip.className = "pin-add-tip";
        tip.textContent = "添加线索";
        tip.hidden = true;
        document.body.appendChild(tip);
      }
      return tip;
    }
    function bindPinAdds(root) {
      root.querySelectorAll(".pin-add").forEach((el) => {
        el.addEventListener("mouseenter", () => {
          const tip = pinAddTip();
          const rect = el.getBoundingClientRect();
          tip.hidden = false;
          let top = rect.top - 6;
          tip.style.transform = "translate(-50%, -100%)";
          if (top < 28) {
            top = rect.bottom + 6;
            tip.style.transform = "translate(-50%, 0)";
          }
          tip.style.left = (rect.left + rect.width / 2) + "px";
          tip.style.top = top + "px";
        });
        el.addEventListener("mouseleave", () => { pinAddTip().hidden = true; });
      });
    }

    function pinHtml(item, axisTop) {
      const alert = item.alert;
      const tone = pinTone(alert.level);
      const grouped = item.group || [];
      const selected = state.alert === alert.id || grouped.some((row) => row.alert.id === state.alert);
      const on = selected ? " on" : "";
      const top = item.lane * 26;
      const stem = Math.max(axisTop - top - 24, 8);
      const tip = item.more ? "" : dealOf(alert.id) + "  " + alert.level + "  " + alert.title + (item.when ? "  " + item.when : "");
      const more = item.more ? '<span class="more">+' + item.more + "</span>" : "";
      const ids = grouped.map((row) => row.alert.id).join(",");
      const place = item.more ? "" : "left:" + item.x + "%;top:" + top + "px;";
      const button = '<button type="button" class="warn-pin ' + tone + on + (item.stem ? " has-stem" : "") + (item.more ? " has-more" : "") + '" data-alert="' + esc(alert.id) + '"' + (ids ? ' data-ids="' + esc(ids) + '"' : "") + ' style="' + place + "--stem:" + stem + 'px" title="' + esc(tip) + '"><span class="sev">' + esc(alert.level) + "</span>" + dealMark(alert.id) + "<b>" + esc(alert.title) + "</b>" + more + pinAdd(alert.id) + "</button>";
      if (!item.more) return button;
      const rows = grouped.map((row) => {
        const rowOn = state.alert === row.alert.id ? " on" : "";
        return '<button type="button" class="warn-pin ' + pinTone(row.alert.level) + rowOn + '" data-alert="' + esc(row.alert.id) + '"><span class="sev">' + esc(row.alert.level) + "</span>" + dealMark(row.alert.id) + "<b>" + esc(row.alert.title) + "</b>" + pinAdd(row.alert.id) + "</button>";
      }).join("");
      return '<div class="pin-hold" style="left:' + item.x + "%;top:" + top + 'px">' + button + '<div class="warn-pop">' + rows + "</div></div>";
    }

    function bindPinPops(root) {
      root.querySelectorAll(".pin-hold").forEach((hold) => {
        const pop = hold.querySelector(".warn-pop");
        let timer = 0;
        function place() {
          clearTimeout(timer);
          root.querySelectorAll(".warn-pop.is-open").forEach((el) => { if (el !== pop) el.classList.remove("is-open"); });
          pop.classList.add("is-open");
          const rect = hold.querySelector(".warn-pin").getBoundingClientRect();
          pop.style.left = (rect.left + rect.width / 2) + "px";
          pop.style.top = (rect.top - 8) + "px";
          pop.style.transform = "translate(-50%, -100%)";
          const box = pop.getBoundingClientRect();
          if (box.top < 8) {
            pop.style.top = (rect.bottom + 8) + "px";
            pop.style.transform = "translate(-50%, 0)";
          }
        }
        hold.addEventListener("mouseenter", place);
        pop.addEventListener("mouseenter", () => clearTimeout(timer));
        hold.addEventListener("mouseleave", () => { timer = setTimeout(() => pop.classList.remove("is-open"), 220); });
        pop.addEventListener("mouseleave", () => { timer = setTimeout(() => pop.classList.remove("is-open"), 220); });
      });
    }

    function renderPanel() {

    function timelineKey() {

    function parseDay(value) {

    function renderTimeline() {
      const data = timelines[timelineKey()];
      const rows = visibleAlerts();
      document.getElementById("timeName").textContent = data.title;
      document.getElementById("timeAddAll").disabled = rows.length === 0;
      document.getElementById("timeEmpty").hidden = rows.length > 0;
      const body = document.getElementById("timeBody");
      const stage = document.getElementById("timeStage");
      const stageWidth = Math.max(980, data.events.length * 168);
      stage.style.minWidth = stageWidth + "px";
      body.style.minWidth = (stageWidth - 24) + "px";
      const placed = layoutAlertPins(rows, data.events, stageWidth);
      const axisTop = placed.lanes ? 3 * 26 + 8 : 100;
      if (placed.lanes) {
        body.classList.add("has-pins");
        body.style.setProperty("--axis", axisTop + "px");
        body.style.setProperty("--body", (axisTop + 70) + "px");
      } else {
        body.classList.remove("has-pins");
        body.style.removeProperty("--axis");
        body.style.removeProperty("--body");
      }
      const bands = placed.lanes ? "" : data.bands.map((band) => {
        const left = band.pos * 100;
        const width = Math.max((band.end - band.pos) * 100, 8);
        return '<div class="band row-' + band.row + '" style="left:' + left + '%;width:' + width + '%">' + esc(band.label) + "</div>";
      }).join("");
      const marks = data.events.map((event) => {
        const left = "left:" + (event.pos * 100) + "%";
        const pill = event.bare ? "" : '<div class="pill lane-0" style="' + left + '">' + esc(event.label) + "</div>";
        return pill + '<i class="dot" style="' + left + '"></i><div class="when" style="' + left + '">' + esc(event.text) + "</div>";
      }).join("");
      const pins = placed.items.map((item) => pinHtml(item, axisTop)).join("");
      body.innerHTML = pins + bands + '<div class="axis"></div>' + marks;
      bindPinPops(body);
      bindPinAdds(body);
      revealSelectedAlert();
    }

    function fit() {
      const stage = document.querySelector(".workspace");
      const base = Math.min((stage.clientWidth - 180) / 1240, (stage.clientHeight - 40) / 760);
      plane.style.setProperty("--scale", String(Math.max(0.62, Math.min(base, 1.45))));
      plane.style.setProperty("--shift-x", "0px");
      plane.style.setProperty("--shift-y", "0px");
      const cards = [...plane.querySelectorAll(".node")];
      if (!cards.length) return;
      const box = cards.reduce((acc, el) => {
        const rect = el.getBoundingClientRect();
        acc.l = Math.min(acc.l, rect.left);
        acc.r = Math.max(acc.r, rect.right);
        acc.t = Math.min(acc.t, rect.top);
        acc.b = Math.max(acc.b, rect.bottom);
        return acc;
      }, { l: Infinity, r: -Infinity, t: Infinity, b: -Infinity });
      const stageBox = stage.getBoundingClientRect();
      plane.style.setProperty("--shift-x", ((stageBox.left + stageBox.right) / 2 - (box.l + box.r) / 2) + "px");
      plane.style.setProperty("--shift-y", ((stageBox.top + stageBox.bottom) / 2 - (box.t + box.b) / 2) + "px");
    }

      } else if (event.data && event.data.type === "select-subject") {
        state.subject = event.data.id || null;
        state.subjectName = event.data.name || "";
        state.alert = null;
        state.drawer = "detail";
        render();
      }
    });

    const report = {
      open: false,
      clues: [],
      files: [],
      generated: ""
    };
    const reportDrawer = document.getElementById("reportDrawer");
    const reportConclusion = document.getElementById("reportConclusion");
    const processBody = document.getElementById("processBody");
    const processCount = document.getElementById("processCount");
    const setPop = document.getElementById("setPop");
    const reportStatus = document.getElementById("reportStatus");
    const reportGo = document.getElementById("reportGo");
    const reportFileList = document.getElementById("reportFileList");
    const reportFiles = document.getElementById("reportFiles");
    let clueSeq = 1;
    let typeGen = 0;

    function canSummarize(item) {
      return !!(item && (item.note || item.model || (item.steps && item.steps.length)));
    }
    function autoConclusion() {
      const ready = report.clues.filter(canSummarize);
      if (!ready.length) return "";
      const names = [];
      ready.forEach((item) => item.whoNames.forEach((name) => { if (!names.includes(name)) names.push(name); }));
      const lines = ready.map((item, index) => (index + 1) + ". " + item.whoNames.join("与") + "：" + item.title + "。" + item.note);
      return "围绕" + names.join("、") + "，本次归集 " + ready.length + " 条预警线索。\n" + lines.join("\n") + "\n综合上述情形，相关交易存在需核查的异常关联，建议责任部门结合关系图与模型分析过程开展核查。";
    }

    function typewrite(text) {
      const gen = ++typeGen;
      reportConclusion.value = "";
      let index = 0;
      const timer = window.setInterval(() => {
        if (gen !== typeGen) {
          window.clearInterval(timer);
          return;
        }
        index = Math.min(text.length, index + 1);
        reportConclusion.value = text.slice(0, index);
        reportConclusion.scrollTop = reportConclusion.scrollHeight;
        if (index >= text.length) window.clearInterval(timer);
      }, 32);
    }

    function syncConclusion() {
      const text = autoConclusion();
      reportConclusion.placeholder = "暂未能自动总结原因，请输入描述及查办指引";
      if (!text) {
        typeGen += 1;
        if (!report.userEdited) reportConclusion.value = "";
        return;
      }
      report.userEdited = false;
      if (!report.open) {
        typeGen += 1;
        reportConclusion.value = text;
        return;
      }
      typewrite(text);
    }

    function renderAttach() {
      reportFileList.innerHTML = report.files.map((file, index) =>
        '<li><span title="' + esc(file.name) + '">' + esc(file.name) + '</span><button type="button" data-remove-file="' + index + '">删除</button></li>'
      ).join("");
    }

    function renderReport() {
      reportDrawer.classList.toggle("is-open", report.open);
      document.getElementById("reportTab").classList.toggle("is-on", report.open);
      reportDrawer.inert = !report.open;
      reportDrawer.setAttribute("aria-hidden", report.open ? "false" : "true");
      processCount.textContent = String(report.clues.length);
      const foldAll = document.getElementById("foldAll");
      const allOpen = report.clues.length > 0 && report.clues.every((item) => item.open);
      foldAll.disabled = report.clues.length === 0;
      foldAll.classList.toggle("is-open", allOpen);
      foldAll.querySelector("span").textContent = allOpen ? "全部收起" : "全部展开";
      reportGo.disabled = report.clues.length === 0;
      reportStatus.textContent = report.generated;
      if (!report.clues.length) {
        processBody.innerHTML = '<p class="process-empty">尚未添加线索</p>';
        return;
      }
      processBody.innerHTML = report.clues.map((item) => {
        const tone = item.level === "中风险" ? " mid" : item.level === "低风险" ? " low" : "";
        const folded = item.open ? "" : " is-folded";
        const steps = (item.steps || []).map((step) => "<li>" + esc(step) + "</li>").join("");
        const analysis = item.model ? '<div class="analysis-row"><p class="clue-line"><em>分析</em>' + esc(item.model) + '</p><button type="button" class="model-toggle" data-toggle-clue="' + esc(item.uid) + '" aria-expanded="' + (item.open ? "true" : "false") + '" aria-label="' + (item.open ? "收起分析" : "展开分析") + '"><i class="chev" aria-hidden="true"></i></button></div><div class="model-body"><ol>' + steps + "</ol></div>" : "";
        return '<article class="clue-item' + tone + folded + '"><div class="clue-top"><span class="sev">' + esc(item.level) + "</span><strong>" + esc(item.title) + '</strong><button type="button" class="clue-del" data-remove-clue="' + esc(item.uid) + '">删除</button></div><p class="clue-line"><em>涉及主体</em>' + esc((item.whoNames || []).join("、")) + '</p><p class="clue-line"><em>事项</em>' + esc(item.note || "待补充原因") + "</p>" + analysis + "</article>";
      }).join("");
    }

    function pushClue(item) {
      report.clues.push({
        uid: "c" + (clueSeq++),
        alertId: item.id,
        level: item.level,
        title: item.title,
        note: item.note,
        whoNames: item.whoNames.slice(),
        model: item.model,
        steps: item.steps.slice(),
        open: true
      });
    }

    function addClues(ids) {
      ids.forEach((id) => { dealByAlert[id] = "已转线索"; });
      const rows = ids.map((id) => graphAlerts().find((row) => row.id === id)).filter(Boolean);
      if (!rows.length) return;
      rows.forEach(pushClue);
      report.open = true;
      report.generated = "";
      syncConclusion();
      render();
      renderReport();
    }

    function addClue(alertId) {
      state.alert = alertId;
      state.drawer = "detail";
      postGraphFocus();
      addClues([alertId]);
    }

    function subjectDisplayName(id) {
      if (state.subjectName && (!id || state.subject === id)) return state.subjectName;
      if (id === "owner") return project.bidder;
      if (id === "agency") return project.agency;
      if (id === "project") return project.name;
      const graphs = (gz && gz.graphs) || {};
      const titles = Object.keys(graphs);
      for (let i = 0; i < titles.length; i += 1) {
        const item = graphs[titles[i]];
        if ("xp-" + (item.id || titles[i]) === id) return titles[i];
        const bidder = (item.bidders || []).find((row) => row.id === id);
        if (bidder) return bidder.full || bidder.name;
        const expert = (item.experts || []).find((row) => row.id === id);
        if (expert) return expert.name;
      }
      return id || project.name;
    }
    function addNodeClue() {
      const subjectId = state.subject || entrySubject().id;
      const rows = state.alert
        ? graphAlerts().filter((item) => item.id === state.alert)
        : graphAlerts().filter((item) => (item.subjects || []).indexOf(subjectId) >= 0);
      if (rows.length) {
        addClues(rows.map((item) => item.id));
        return;
      }
      const name = subjectDisplayName(subjectId);
      if (!report.clues.some((clue) => clue.manual && clue.nodeId === subjectId)) {
        report.clues.push({
          uid: "c" + (clueSeq++),
          alertId: "",
          nodeId: subjectId,
          manual: true,
          level: "线索",
          title: name,
          note: "",
          whoNames: [name],
          model: "",
          steps: [],
          open: true
        });
      }
      report.open = true;
      report.generated = "";
      syncConclusion();
      renderReport();
    }
    document.getElementById("clueFab").addEventListener("click", () => addNodeClue());
    document.getElementById("reportTab").addEventListener("click", () => {
      report.open = !report.open;
      renderReport();
    });
    document.getElementById("reportClose").addEventListener("click", () => {
      report.open = false;
      renderReport();
    });
    document.getElementById("foldAll").addEventListener("click", () => {
      const open = !(report.clues.length && report.clues.every((item) => item.open));
      report.clues.forEach((item) => { item.open = open; });
      renderReport();
    });
    processBody.addEventListener("click", (event) => {
      const toggle = event.target.closest("[data-toggle-clue]");
      if (toggle) {
        const clue = report.clues.find((item) => item.uid === toggle.dataset.toggleClue);
        if (clue) clue.open = !clue.open;
        renderReport();
        return;
      }
      const button = event.target.closest("[data-remove-clue]");
      if (!button) return;
      report.clues = report.clues.filter((item) => item.uid !== button.dataset.removeClue);
      report.generated = "";
      syncConclusion();
      renderReport();
    });
    document.getElementById("reportSettings").addEventListener("click", (event) => {
      event.stopPropagation();
      setPop.hidden = !setPop.hidden;
      event.currentTarget.setAttribute("aria-expanded", setPop.hidden ? "false" : "true");
    });
    document.addEventListener("click", (event) => {
      if (setPop.hidden) return;
      if (event.target.closest("#setPop") || event.target.closest("#reportSettings")) return;
      setPop.hidden = true;
      document.getElementById("reportSettings").setAttribute("aria-expanded", "false");
    });
    reportConclusion.addEventListener("input", () => { typeGen += 1; report.userEdited = true; });
    const reportConclusionBox = document.getElementById("reportConclusionBox");
    const reportGrip = document.getElementById("reportGrip");
    reportGrip.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      const startY = event.clientY;
      const startH = reportConclusionBox.getBoundingClientRect().height;
      const max = Math.max(160, reportDrawer.clientHeight - 180);
      function move(nextEvent) {
        const next = Math.min(max, Math.max(128, startH + nextEvent.clientY - startY));
        reportConclusionBox.style.height = next + "px";
      }
      function end() {
        reportGrip.removeEventListener("pointermove", move);
        reportGrip.removeEventListener("pointerup", end);
        reportGrip.removeEventListener("pointercancel", end);
      }
      reportGrip.setPointerCapture(event.pointerId);
      reportGrip.addEventListener("pointermove", move);
      reportGrip.addEventListener("pointerup", end);
      reportGrip.addEventListener("pointercancel", end);
    });
    reportFiles.addEventListener("change", () => {
      [...reportFiles.files].forEach((file) => {
        const same = report.files.some((item) => item.name === file.name && item.size === file.size && item.lastModified === file.lastModified);
        if (!same) report.files.push(file);
      });
      reportFiles.value = "";
      renderAttach();
    });
    reportFileList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove-file]");
      if (!button) return;
      report.files.splice(Number(button.dataset.removeFile), 1);
      renderAttach();
    });
    function stamp() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return {
        text: now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds()),
        file: now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds())
      };
    }

    function reportLines() {
      const lines = ["线索报告"];
      if (report.generatedAt) lines.push("生成时间：" + report.generatedAt);
      lines.push("");
      lines.push(reportConclusion.value || autoConclusion());
      lines.push("", "分析过程");
      if (!report.clues.length) lines.push("尚未添加线索");
      report.clues.forEach((item, index) => {
        lines.push("", (index + 1) + ". " + item.title + "（" + item.level + "）");
        lines.push("涉及主体：" + item.whoNames.join("、"));
        lines.push("事项：" + item.note);
        lines.push("模型：" + item.model);
        item.steps.forEach((step, stepIndex) => lines.push((stepIndex + 1) + "）" + step));
      });
      lines.push("", "附件");
      if (!report.files.length) lines.push("无");
      report.files.forEach((file) => lines.push(file.name));
      return lines;
    }

    function downloadBlob(bytes, name, type) {
      const blob = bytes instanceof Blob ? bytes : new Blob([bytes], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function paintReport() {
      const width = 900;
      const max = width - 96;
      const probe = document.createElement("canvas").getContext("2d");
      probe.font = "16px PingFang SC, Microsoft YaHei, sans-serif";
      const lines = [];
      reportLines().forEach((text) => {
        if (!text) { lines.push(""); return; }
        let line = "";
        for (const ch of text) {
          if (probe.measureText(line + ch).width > max) {
            lines.push(line);
            line = ch;
          } else line += ch;
        }
        lines.push(line);
      });
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = Math.max(480, 80 + lines.length * 28);
      const g = canvas.getContext("2d");
      g.fillStyle = "#ffffff";
      g.fillRect(0, 0, canvas.width, canvas.height);
      g.fillStyle = "#16324f";
      g.font = "16px PingFang SC, Microsoft YaHei, sans-serif";
      lines.forEach((line, index) => g.fillText(line, 48, 56 + index * 28));
      return canvas;
    }

    function jpegPdf(canvas) {
      const raw = atob(canvas.toDataURL("image/jpeg", 0.86).split(",")[1]);
      const img = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i += 1) img[i] = raw.charCodeAt(i);
      const pageW = 595;
      const pageH = Math.max(420, Math.round(pageW * canvas.height / canvas.width));
      const enc = new TextEncoder();
      const chunks = [];
      let length = 0;
      const offsets = [];
      function push(part) {
        const bytes = typeof part === "string" ? enc.encode(part) : part;
        const at = length;
        chunks.push(bytes);
        length += bytes.length;
        return at;
      }
      push("%PDF-1.4\n");
      offsets[1] = push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
      offsets[2] = push("2 0 obj\n<< /Type /Pages /Count 1 /Kids [3 0 R] >>\nendobj\n");
      offsets[3] = push("3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pageW + " " + pageH + "] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>\nendobj\n");
      const stream = "q\n" + pageW + " 0 0 " + pageH + " 0 0 cm\n/Im0 Do\nQ";
      offsets[4] = push("4 0 obj\n<< /Length " + enc.encode(stream).length + " >>\nstream\n" + stream + "\nendstream\nendobj\n");
      offsets[5] = push("5 0 obj\n<< /Type /XObject /Subtype /Image /Width " + canvas.width + " /Height " + canvas.height + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + img.length + " >>\nstream\n");
      push(img);
      push("\nendstream\nendobj\n");
      const xrefAt = length;
      let xref = "xref\n0 6\n0000000000 65535 f \n";
      for (let i = 1; i <= 5; i += 1) xref += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
      push(xref);
      push("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xrefAt + "\n%%EOF");
      const out = new Uint8Array(length);
      let cursor = 0;
      chunks.forEach((chunk) => { out.set(chunk, cursor); cursor += chunk.length; });
      return out;
    }

    function wordHtml() {
      const blocks = reportLines().map((line) => "<p>" + (line ? esc(line) : "&nbsp;") + "</p>").join("");
      return "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'><title>线索报告</title></head><body>" + blocks + "</body></html>";
    }

    reportGo.addEventListener("click", () => {
      if (!report.clues.length) return;
      const format = document.getElementById("reportFormat").value;
      const when = stamp();
      report.generatedAt = when.text;
      const base = "线索报告-" + when.file;
      if (format === "word") downloadBlob(new TextEncoder().encode(wordHtml()), base + ".doc", "application/msword");
      else downloadBlob(jpegPdf(paintReport()), base + ".pdf", "application/pdf");
      report.generated = "已生成 " + format + " 报告 · " + when.text;
      renderReport();
    });
    syncConclusion();
    renderReport();

    document.getElementById("analysisView").addEventListener("click", () => {
      const next = new URLSearchParams();
      next.set("name", project.name);
      next.set("bidder", project.bidder);
      next.set("agency", project.agency);
      next.set("level", project.level);
      next.set("date", project.date);
      next.set("cat", project.cat);
      const nodeId = state.subject || params.get("node") || "";
      if (nodeId) next.set("node", nodeId);
      if (state.alert) next.set("alert", state.alert);
      if (params.get("focus")) next.set("focus", params.get("focus"));
      if (from === "agency" || params.get("role") === "招标代理") {
        next.set("from", from === "company" ? "company" : "agency");
        if (params.get("role")) next.set("role", params.get("role"));
      }
      if (params.get("bare") === "1") next.set("bare", "1");
      location.href = "analysis.html?" + next.toString();
    });

    const packDialog = document.getElementById("packDialog");
    const clueName = document.getElementById("clueName");
    const clueNo = document.getElementById("clueNo");
    const clueDesc = document.getElementById("clueDesc");
    const clueErr = document.getElementById("clueErr");
    const clueFiles = document.getElementById("clueFiles");
    const fileList = document.getElementById("fileList");
    const pickedFiles = [];
    function renderFiles() {
      fileList.innerHTML = pickedFiles.map((file, index) =>
        "<li><span title=\"" + esc(file.name) + "\">" + esc(file.name) + "</span><button type=\"button\" data-remove=\"" + index + "\">删除</button></li>"
      ).join("");
    }
    function addFiles(files) {
      [...files].forEach((file) => {
        const same = pickedFiles.some((item) => item.name === file.name && item.size === file.size && item.lastModified === file.lastModified);
        if (!same) pickedFiles.push(file);
      });
      renderFiles();
    }
    function makeClueNo() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return "XS" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    }
    function makeClueDesc() {
      const focus = params.get("focus") || (from === "agency" ? project.agency : project.name);
      const subjectName = from === "agency" ? project.agency : project.name;
      return "围绕「" + subjectName + "」形成监管线索。当前概览视图以「" + focus + "」为观察对象，关联招标人" + project.bidder + "、招标代理" + project.agency + "及相关投标主体。项目类别为" + project.cat + "，风险等级" + project.level + "，关键时点" + project.date + "。本次打包纳入当前视图内容、主体属性、交易时序和预警记录，并以分析图、数据表一并归档，供责任部门核查围标串标、资质挂靠、程序异常和利益关联等情形，作为后续核查、约谈和移交的依据。";
    }
    const draftKey = "clue-draft:insight:" + (from === "agency" ? project.agency : project.name);
    const packSaved = document.getElementById("packSaved");
    function formatSaved(date) {
      const pad = (n) => String(n).padStart(2, "0");
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + " " + pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
    }
    function showSaved(text) {
      packSaved.textContent = text ? "上次保存：" + text : "上次保存：—";
    }
    function readDraft() {
      try { return JSON.parse(localStorage.getItem(draftKey) || "null"); } catch (error) { return null; }
    }
    function collectDraft() {
      const checked = (name) => [...packDialog.querySelectorAll('input[name="' + name + '"]')].filter((input) => input.checked).map((input) => input.value);
      return {
        savedAt: formatSaved(new Date()),
        name: clueName.value,
        no: clueNo.value,
        desc: clueDesc.value,
        dept: document.getElementById("clueDept").value,
        content: checked("content"),
        form: checked("form"),
        files: pickedFiles.map((file) => ({ name: file.name, size: file.size || 0, lastModified: file.lastModified || 0 }))
      };
    }
    function applyDraft(draft) {
      clueName.value = draft.name || "";
      clueNo.value = draft.no || makeClueNo();
      clueDesc.value = draft.desc || "";
      const dept = document.getElementById("clueDept");
      if ([...dept.options].some((option) => option.value === draft.dept)) dept.value = draft.dept;
      packDialog.querySelectorAll('input[type="checkbox"]').forEach((input) => {
        const group = input.name === "content" ? draft.content : draft.form;
        input.checked = Array.isArray(group) && group.includes(input.value);
      });
      pickedFiles.length = 0;
      (draft.files || []).forEach((file) => pickedFiles.push(file));
      renderFiles();
    }
    function resetPack() {
      clueName.value = (from === "agency" ? project.agency : project.name) + "监管线索";
      clueNo.value = makeClueNo();
      clueDesc.value = makeClueDesc();
      packDialog.querySelectorAll('input[type="checkbox"]').forEach((input) => { input.checked = true; });
      document.getElementById("clueDept").selectedIndex = 0;
      pickedFiles.length = 0;
      renderFiles();
    }
    function openPack() {
      const draft = readDraft();
      if (draft) {
        applyDraft(draft);
        showSaved(draft.savedAt);
      } else {
        resetPack();
        showSaved("");
      }
      clueFiles.value = "";
      clueErr.hidden = true;
      packDialog.showModal();
      clueName.focus();
    }
    document.getElementById("packDraft").addEventListener("click", () => {
      const draft = collectDraft();
      try { localStorage.setItem(draftKey, JSON.stringify(draft)); } catch (error) {}
      showSaved(draft.savedAt);
    });
    document.getElementById("packCancel").addEventListener("click", () => packDialog.close());
    document.getElementById("packClose").addEventListener("click", () => packDialog.close());
    clueName.addEventListener("input", () => { clueErr.hidden = true; });
    clueFiles.addEventListener("change", () => {
      addFiles(clueFiles.files);
      clueFiles.value = "";
    });
    fileList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove]");
      if (!button) return;
      pickedFiles.splice(Number(button.dataset.remove), 1);
      renderFiles();
    });
    document.getElementById("packForm").addEventListener("submit", (event) => {
      event.preventDefault();
      if (!clueName.value.trim()) {
        clueErr.hidden = false;
        clueName.focus();
        return;
      }
      try { localStorage.removeItem(draftKey); } catch (error) {}
      packDialog.close();
    });

    window.addEventListener("resize", () => { if (state.mode === "graph") fit(); });
    render();
  </script>
</body>
</html>
