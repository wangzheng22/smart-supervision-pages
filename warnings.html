  <style>

      font-weight: 700;
      line-height: 1;

    .stat-cards .card-tier.is-mid b { color: var(--risk-mid-ink); }
    .stat-cards .card-tier.is-lo b { color: var(--risk-low-ink); }

    }

      height: 28px;

      border: 1px solid #e4ebf5;
      border-radius: 14px;
      background: #f7f9fc;

      line-height: 26px;

    .grid {

    }
    .range i { flex: none; color: #8b97a6; font-style: normal; font-size: 13px; }
    .actions { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
    .search-btn, .reset-btn {

    }

      color: #24364c;
    }
    .table-card { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .table-scroll { overflow: auto; }
    table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #eef2f6;
      background: #fff;
      white-space: nowrap;
    }
    th {

    .pin.r { right: 0; width: 210px; min-width: 210px; box-shadow: -8px 0 8px -8px rgba(22, 62, 112, 0.28); }
    td.name { white-space: normal; }

    }
    td.high, td.mid, td.low { font-weight: 650; }
    td.high { color: var(--risk-high-ink); }
    td.mid { color: var(--risk-mid-ink); }
    td.low { color: var(--risk-low-ink); }
    /* 风险度标签：与顶部统计卡同色，不依赖 @import 是否成功 */
    .tag.high { color: var(--risk-high-ink); background: var(--risk-high-bg); border-color: color-mix(in srgb, var(--risk-high) 28%, #fff); }
    .tag.mid { color: var(--risk-mid-ink); background: var(--risk-mid-bg); border-color: color-mix(in srgb, var(--risk-mid) 28%, #fff); }
    .tag.low { color: var(--risk-low-ink); background: var(--risk-low-bg); border-color: color-mix(in srgb, var(--risk-low) 28%, #fff); }
    .tag.muted { color: #8b97a6; background: color-mix(in srgb, #8b97a6 15%, #fff); border-color: color-mix(in srgb, #8b97a6 22%, #fff); }
    td.num { font-variant-numeric: tabular-nums; }
    .ops { display: flex; gap: 8px; }

      height: 26px;
      padding: 0 8px;
      border: 0;
      border-radius: 4px;
      background: none;
      color: var(--blue);
      font-size: 13px;
      transition: background-color .15s ease, color .15s ease;
    }

    }

      height: 16px;

    }

      const col = cols().find((item) => item.key === key) || {};
      if (col.rank) return rank[cellValue(row, key)] || rank[row[key]] || 0;
      if (col.num) return Number(String(row[key]).replace(/,/g, "")) || 0;
      return row[key] || "";
    }
    function sortIcon(key) {
      const dir = state.sort.key === key ? state.sort.dir : "";
      return '<svg class="sort-ico ' + dir + '" viewBox="0 0 16 16" aria-hidden="true"><path class="up" d="M8 3.2 11.2 7H4.8Z"/><path class="down" d="M4.8 9h6.4L8 12.8Z"/></svg>';
    }
    function filterIcon() {
      return '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.8 2.8h12.4L9.4 8.1v3.4l-2.8 1.5V8.1L1.8 2.8Z"/></svg>';
    }
    function renderHead() {
      const sheet = views[state.tab];
      const table = document.querySelector("table");
      table.style.setProperty("--pin1", sheet.pin1);
      table.style.setProperty("--pin2", sheet.pin2);
      document.querySelector("thead tr").innerHTML = cols().map((col) => {
        const pin = col.pin ? ' class="pin ' + col.pin + '"' : "";
        if (col.sort) {
          const on = state.sort.key === col.key ? " is-on" : "";
          const aria = state.sort.key === col.key ? (state.sort.dir === "asc" ? "ascending" : "descending") : "none";
          return "<th" + pin + " aria-sort=\"" + aria + "\"><button type=\"button\" class=\"th-sort" + on + "\" data-sort=\"" + col.key + "\"><span>" + esc(col.label) + "</span>" + sortIcon(col.key) + "</button></th>";
        }
        if (col.filter) {
          const on = (state.colFilters[col.key] || []).length ? " is-on" : "";
          return "<th" + pin + "><div class=\"th-box\"><span>" + esc(col.label) + "</span><button type=\"button\" class=\"th-filter" + on + "\" data-filter=\"" + col.key + "\" aria-label=\"筛选" + esc(col.label) + "\">" + filterIcon() + "</button></div></th>";
        }
        return "<th" + pin + ">" + esc(col.label) + "</th>";
      }).join("");
    }
    function pickCell(row, key, className) {
      const picked = state.colFilters[key] || [];
      const shown = String(cellValue(row, key));
      const active = picked.length === 1 && picked[0] === shown;
      const on = picked.length && picked.indexOf(shown) >= 0 ? " is-on" : "";
      const title = active ? "再次点击取消筛选" : "按此筛选";
      const cls = className ? ' class="' + className + '"' : "";
      return "<td" + cls + "><button type=\"button\" class=\"cell-pick" + on + "\" data-col=\"" + key + "\" title=\"" + title + "\">" + esc(shown) + "</button></td>";
    }
    function closePop() {
      state.openFilter = "";
      document.getElementById("colPop").hidden = true;
    }
    function placePop(anchor) {
      const pop = document.getElementById("colPop");
      const rect = anchor.getBoundingClientRect();
      const margin = 8;
      const width = pop.offsetWidth;
      const height = pop.offsetHeight;
      let left = Math.min(Math.max(margin, rect.right - width), window.innerWidth - width - margin);
      let top = rect.bottom + 6;
      if (top + height > window.innerHeight - margin) top = Math.max(margin, rect.top - height - 6);
      pop.style.left = left + "px";
      pop.style.top = top + "px";
    }
    function fillPop(key) {
      const col = cols().find((item) => item.key === key);
      document.getElementById("colTitle").textContent = col.label;
      const query = document.getElementById("colQuery").value.trim();
      const picked = state.colFilters[key] || [];
      const filters = readFilters();
      const values = [];
      rows.forEach((row) => {
        if (!matched(row, filters) || !colMatch(row, key)) return;
        const value = cellValue(row, key);
        if (values.indexOf(value) < 0) values.push(value);
      });
      values.sort((a, b) => {
        const ap = picked.indexOf(a) >= 0 ? 0 : 1;
        const bp = picked.indexOf(b) >= 0 ? 0 : 1;
        if (ap !== bp) return ap - bp;
        return String(a).localeCompare(String(b), "zh");
      });
      const list = document.getElementById("colList");
      list.replaceChildren();
      const shown = values.filter((value) => !query || String(value).indexOf(query) >= 0);
      if (!shown.length) {
        const empty = document.createElement("div");
        empty.className = "col-empty";
        empty.textContent = "没有匹配项";
        list.appendChild(empty);
        return;
      }
      shown.forEach((value) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = value;
        input.checked = picked.indexOf(value) >= 0;
        const span = document.createElement("span");
        span.textContent = value;
        span.title = value;
        label.appendChild(input);
        label.appendChild(span);
        list.appendChild(label);
      });
    }
    function openFilter(key, anchor) {
      const pop = document.getElementById("colPop");
      if (state.openFilter === key && !pop.hidden) {
        closePop();
        return;
      }
      state.openFilter = key;
      document.getElementById("colQuery").value = "";
      pop.classList.toggle("wide", key === "point");
      pop.hidden = false;
      fillPop(key);
      placePop(anchor);
    }
    function syncPop() {
      if (!state.openFilter) return;
      const anchor = document.querySelector('[data-filter="' + state.openFilter + '"]');
      if (!anchor) return;
      fillPop(state.openFilter);
      placePop(anchor);
    }
    function render() {
      renderHead();
      const filters = readFilters();
      const list = rows.filter((row) => matched(row, filters) && colMatch(row));
      if (state.sort.key) {
        const key = state.sort.key;
        const dir = state.sort.dir === "asc" ? 1 : -1;
        list.sort((a, b) => {
          const av = sortValue(a, key);
          const bv = sortValue(b, key);
          const cmp = typeof av === "number" && typeof bv === "number" ? av - bv : String(av).localeCompare(String(bv), "zh");
          return cmp * dir;
        });
      }
      const pages = Math.max(1, Math.ceil(list.length / state.pageSize) || 1);
      if (state.page > pages) state.page = pages;
      if (state.page < 1) state.page = 1;
      const view = list.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
      const body = document.getElementById("body");
      if (!view.length) {
        body.innerHTML = '<tr class="is-empty"><td class="empty" colspan="' + cols().length + '">当前条件下没有数据</td></tr>';
        renderPager(0);
        syncPop();
        syncStatCardTierActive();
        return;
      }
      body.innerHTML = view.map((row) => (
        "<tr data-i=\"" + rows.indexOf(row) + "\">" +
        cols().map((col) => {
          if (col.key === "ops") {
            const pending = row.deal === "未处置";
            const converted = row.deal === "已转线索";
            let extra = "";
            if (pending) extra = "<button type=\"button\" data-act=\"clue\">转为线索</button><button type=\"button\" data-act=\"ignore\">忽略</button>";
            else if (converted) extra = "<button type=\"button\" data-act=\"view-clue\">查看线索</button>";
            return "<td class=\"pin r\"><div class=\"ops\"><button type=\"button\" data-act=\"view\">查看</button>" + extra + "</div></td>";
          }
          const bits = [];
          if (col.pin) bits.push("pin", col.pin);
          if (col.wrap) bits.push("name");
          if (col.key === "point") bits.push("point");
          if (col.num) bits.push("num");
          if (col.key === "trust") bits.push(tone(row.trust));
          const cls = bits.join(" ");
          if (col.key === "deal" && row.deal === "已忽略") {
            const reason = row.ignoreReason || "暂无忽略说明";
            return "<td class=\"" + cls + "\"><span class=\"deal-ignored\"><span class=\"deal-status\">" + esc(row.deal) +
              "</span><span class=\"ignore-info\" tabindex=\"0\" aria-label=\"忽略详情\"><span class=\"ignore-ico\">" +
              "<img class=\"ignore-ico-off\" src=\"assets/icon-ignore-detail.png\" width=\"16\" height=\"16\" alt=\"\" decoding=\"async\" />" +
              "<img class=\"ignore-ico-on\" src=\"assets/icon-ignore-detail-hover.png\" width=\"16\" height=\"16\" alt=\"\" decoding=\"async\" />" +
              "</span>" +
              "<span class=\"ignore-tip\" role=\"tooltip\">" + esc(reason) + "</span></span></span></td>";
          }
          if (col.filter) return pickCell(row, col.key, cls);
          if (col.key === "level") return "<td class=\"" + cls + "\"><span class=\"tag " + tone(row.level) + "\">" + esc(displayLevel(row.level)) + "</span></td>";
          if (col.key === "views") return viewRecordCellHtml(row, cls);
          const raw = row[col.key];
          return "<td" + (cls ? " class=\"" + cls + "\"" : "") + ">" + esc(raw === 0 || raw ? raw : "—") + "</td>";
        }).join("") +
        "</tr>"
      )).join("");
      renderPager(list.length);
      syncPop();
      syncStatCardTierActive();
    }
    document.getElementById("filters").addEventListener("submit", (event) => {
      event.preventDefault();
      state.page = 1;
      const keyword = document.getElementById("f-keyword");
      if (keyword && keyword.value.trim()) saveRecentSearch(keyword.value.trim());
      render();
    });
    document.getElementById("body").addEventListener("mouseenter", (event) => {
      const hold = event.target.closest(".view-record");
      if (!hold) return;
      cancelHideViewRecordPop();
      const idx = Number(hold.dataset.rowI);
      const row = rows[idx];
      if (!row) return;
      viewRecordAnchor = hold;
      placeViewRecordPop(hold, row);
    }, true);
    document.getElementById("body").addEventListener("mouseleave", (event) => {
      const hold = event.target.closest(".view-record");
      if (!hold) return;
      if (event.relatedTarget && (hold.contains(event.relatedTarget) || document.getElementById("viewRecordPop").contains(event.relatedTarget))) return;
      scheduleHideViewRecordPop();
    }, true);
    document.getElementById("viewRecordPop").addEventListener("mouseenter", cancelHideViewRecordPop);
    document.getElementById("viewRecordPop").addEventListener("mouseleave", (event) => {
      if (event.relatedTarget && event.relatedTarget.closest && event.relatedTarget.closest(".view-record")) return;
      scheduleHideViewRecordPop();
    });
    document.getElementById("tableScroll").addEventListener("scroll", hideViewRecordPop);
    window.addEventListener("resize", hideViewRecordPop);

    document.getElementById("searchRecentList").addEventListener("click", (event) => {
      const chip = event.target.closest(".recent-chip[data-kw]");
      if (!chip) return;
      applyRecentSearch(chip.getAttribute("data-kw") || chip.textContent || "");
    });
    document.getElementById("filterGrid").addEventListener("change", (event) => {
      if (event.target.id === "f-riskState") {
        state.page = 1;
        syncStatCardTierActive();
        render();
      }
    });
    document.getElementById("resetFilters").addEventListener("click", () => {
      document.getElementById("filters").reset();
      const industryField = views[state.tab].filters.find((item) => item.type === "industry2");
      if (state.industryCascadeFilter && industryField) {
        state.industryCascadeFilter.setValue({ l1: industryField.all, sub: "" });
      }
      const keyword = document.getElementById("f-keyword");
      if (keyword) keyword.value = "";
      state.colFilters = emptyColFilters();
      state.sort = { key: "", dir: "" };
      state.page = 1;
      closePop();
      render();
      syncStatCardTierActive();
    });
    document.querySelector("thead").addEventListener("click", (event) => {
      const filterBtn = event.target.closest("[data-filter]");
      if (filterBtn) {
        openFilter(filterBtn.dataset.filter, filterBtn);
        return;
      }
      const sortBtn = event.target.closest("[data-sort]");
      if (!sortBtn) return;
      const key = sortBtn.dataset.sort;
      closePop();
      if (state.sort.key !== key) state.sort = { key, dir: "desc" };
      else if (state.sort.dir === "desc") state.sort.dir = "asc";
      else state.sort = { key: "", dir: "" };
      state.page = 1;
      render();
    });
    document.getElementById("body").addEventListener("click", (event) => {
      const pick = event.target.closest(".cell-pick");
      if (pick) {
        const row = rows[Number(pick.closest("tr").dataset.i)];
        const col = pick.dataset.col;
        const value = String(cellValue(row, col));
        const picked = state.colFilters[col] || [];
        if (picked.length === 1 && picked[0] === value) {
          state.colFilters[col] = [];
        } else {
          state.colFilters[col] = [value];
        }
        state.page = 1;
        closePop();
        render();
        return;
      }
      const button = event.target.closest(".ops button");
      if (!button || button.disabled) return;
      const row = rows[Number(button.closest("tr").dataset.i)];
      if (button.dataset.act === "view") openInsight(row);
      else if (row.deal === "未处置" && button.dataset.act === "clue") {
        row.clue = true;
        row.deal = "已转线索";
        listClueReport.addFromWarningRow(row);
        render();
      }       else if (row.deal === "已转线索" && button.dataset.act === "view-clue") {
        listClueReport.openFromWarningRow(row);
      } else if (row.deal === "未处置" && button.dataset.act === "ignore") {
        openIgnoreDialog(row);
      }
    });

    const ignoreDialog = document.getElementById("ignoreDialog");
    const ignoreForm = document.getElementById("ignoreForm");
    const ignoreReasonInput = document.getElementById("ignoreReasonInput");
    let ignorePendingRow = null;
    function openIgnoreDialog(row) {
      ignorePendingRow = row;
      ignoreReasonInput.value = "";
      ignoreDialog.showModal();
      ignoreReasonInput.focus();
    }
    function closeIgnoreDialog() {
      ignorePendingRow = null;
      ignoreDialog.close();
    }
    document.getElementById("ignoreCancel").addEventListener("click", closeIgnoreDialog);
    document.getElementById("ignoreClose").addEventListener("click", closeIgnoreDialog);
    ignoreDialog.addEventListener("click", (event) => {
      if (event.target === ignoreDialog) {
        ignorePendingRow = null;
        ignoreDialog.close();
      }
    });
    ignoreForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!ignorePendingRow) return;
      const reason = ignoreReasonInput.value.trim();
      if (!reason) {
        ignoreReasonInput.focus();
        return;
      }
      ignorePendingRow.ignoreReason = reason;
      ignorePendingRow.deal = "已忽略";
      ignorePendingRow = null;
      ignoreDialog.close();
      render();
    });
    let skipClose = false;
    document.getElementById("colList").addEventListener("change", () => {
      const key = state.openFilter;
      if (!key) return;
      skipClose = true;
      state.colFilters[key] = [...document.querySelectorAll("#colList input:checked")].map((input) => input.value);
      state.page = 1;
      render();
    });
    document.getElementById("colQuery").addEventListener("input", () => {
      if (state.openFilter) fillPop(state.openFilter);
    });
    document.getElementById("colClear").addEventListener("click", () => {
      if (!state.openFilter) return;
      state.colFilters[state.openFilter] = [];
      state.page = 1;
      render();
    });
    document.getElementById("colOk").addEventListener("click", closePop);
    document.getElementById("tableScroll").addEventListener("scroll", () => {
      if (state.openFilter) closePop();
    });
    document.querySelector(".page").addEventListener("scroll", () => {
      if (state.openFilter) closePop();
    });
    document.addEventListener("click", (event) => {
      if (skipClose) {
        skipClose = false;
        return;
      }
      if (!state.openFilter) return;
      if (event.target.closest("#colPop") || event.target.closest("[data-filter]")) return;
      closePop();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.openFilter) closePop();
    });
    function syncFilterOptions() {
      ["project", "owner", "agency", "bidder", "expert", "staff"].forEach((tab) => {
        views[tab].filters.forEach((field) => {
          if (field.type !== "select" || field.key === "viewState" || field.key === "years" || field.key === "source" || field.key === "deal" || field.key === "riskState") return;
          const values = [];
          rows.forEach((row) => {
            if (row.tab !== tab) return;
            const value = row[field.key];
            if (value && values.indexOf(value) < 0) values.push(value);
          });
          if (values.length) field.options = [field.all].concat(values);
        });
      });
    }
    syncFilterOptions();
    renderFilters();
    syncSearchPlaceholder();
    renderRecentSearches();
    state.colFilters = emptyColFilters();
    renderTabs();
    render();
  </script>
</body>
</html>
