<!DOCTYPE html>
<html lang="zh-CN" data-page="warnings.html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预警列表</title>
  <link rel="stylesheet" href="shell.css?v=16" />
  <link rel="stylesheet" href="clue-report.css?v=7" />
  <script src="shell.js?v=19" defer></script>
  <script src="mock-data.js?v=135"></script>
  <script src="clue-handoff.js?v=2"></script>
  <script src="clue-report.js?v=4"></script>
  <style>
    :root {
      --ink: #16324f;
      --muted: #6d7f95;
      --line: #e4ebf5;
      --blue: #2f78f6;
      --risk: #ef3b3b;
      --shadow: 0 10px 30px rgba(22, 62, 112, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #edf1f6;
    }
    html.sys-app body {
      min-height: 0;
      background: transparent;
    }
    button, input, select { font-family: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid rgba(47, 120, 246, 0.35);
      outline-offset: 1px;
    }
    .topbar.is-idle { display: none; }
    .topbar {
      flex: none;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: #fff;
      border-bottom: 1px solid #e6eaf0;
    }
    .top-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .view-tabs {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      min-width: 0;
      flex: 1;
      height: 100%;
      overflow-x: auto;
    }
    .view-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 240px;
      height: 32px;
      flex: none;
      padding: 0 10px;
      border: 1px solid #e4ebf5;
      border-radius: 6px;
      background: #f4f7fb;
      color: #3d4e64;
      font-size: 13px;
    }
    .view-tab.is-on {
      background: #e8f1ff;
      border-color: #b9d0fb;
      color: #1f6feb;
      font-weight: 650;
    }
    .view-tab > span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .view-tab .x {
      flex: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      color: #8b97a6;
      font-style: normal;
      line-height: 16px;
      text-align: center;
    }
    .view-tab .x:hover { background: #dbe4f0; color: #24364c; }
    .detail-frame { flex: 1; min-height: 0; width: 100%; border: 0; background: #edf1f6; }
    .page[hidden], .detail-frame[hidden] { display: none !important; }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
      color: #24364c;
      text-decoration: none;
    }
    .logo { width: 24px; height: 24px; object-fit: contain; display: block; }
    .split { width: 1px; height: 16px; background: #d7dee8; flex: none; }
    .subject {
      font-size: 16px;
      font-weight: 650;
      color: #24364c;
      white-space: nowrap;
    }
    .page {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      width: 100%;
      flex: none;
    }
    .tabs button {
      flex: 1;
      min-width: 0;
      height: 52px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      border: 1px solid #e3eaf3;
      border-radius: 8px;
      background: #fff;
      color: #24364c;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(22, 50, 90, 0.04);
    }
    .tabs button .tab-ico {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #eef4ff;
      color: #2f78f6;
      display: grid;
      place-items: center;
      flex: none;
    }
    .tabs button .tab-ico svg {
      width: 18px;
      height: 18px;
      display: block;
    }
    .tabs button .tab-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .tabs button em {
      font-style: normal;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 550;
    }
    .tabs button b {
      color: var(--blue);
      font-weight: 700;
      font-size: 15px;
    }
    .tabs button.is-on {
      border-color: #7eb3ff;
      box-shadow: 0 0 0 1px rgba(47, 120, 246, 0.18);
    }
    .tabs button.is-on .tab-ico {
      background: #2f78f6;
      color: #fff;
    }
    .tabs button.is-on em { color: #1f6feb; }
    .filters, .table-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .filters { padding: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px 16px;
    }
    .field { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .field > span:first-child {
      flex: none;
      width: 128px;
      color: #5e7088;
      font-size: 13px;
      text-align: right;
      white-space: nowrap;
    }
    .field > input, .field > select, .field > .range {
      flex: 1 1 0;
      width: 0;
      min-width: 0;
    }
    .field input, .field select {
      height: 32px;
      padding: 0 10px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
    }
    .field .range {
      text-align: left;
      color: var(--ink);
      height: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
    }
    .range input {
      flex: 1 1 0;
      width: 0;
      min-width: 0;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
    }
    .range i { flex: none; color: #8b97a6; font-style: normal; font-size: 13px; }
    .actions { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
    .search-btn, .reset-btn {
      height: 32px;
      padding: 0 18px;
      border: 0;
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      font-size: 13px;
    }
    .reset-btn {
      border: 1px solid #d7dee8;
      background: #fff;
      color: #24364c;
    }
    .table-card { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .table-scroll { overflow: auto; }
    table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #eef2f6;
      background: #fff;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f7f9fc;
      color: #6d7f95;
      font-weight: 600;
    }
    th.pin, td.pin { position: sticky; z-index: 3; }
    th.pin { z-index: 4; background: #f7f9fc; }
    td.pin { background: #fff; }
    .pin.l1 { left: 0; width: var(--pin1, 148px); min-width: var(--pin1, 148px); max-width: var(--pin1, 148px); }
    .pin.l2 { left: var(--pin1, 148px); width: var(--pin2, 240px); min-width: var(--pin2, 240px); max-width: var(--pin2, 240px); box-shadow: 8px 0 8px -8px rgba(22, 62, 112, 0.28); }
    .pin.r { right: 0; width: 210px; min-width: 210px; box-shadow: -8px 0 8px -8px rgba(22, 62, 112, 0.28); }
    td.name { white-space: normal; }
    td.point { white-space: normal; min-width: 280px; color: #3d4e64; }
    tr.is-empty td {
      position: static;
      left: auto;
      width: auto;
      min-width: 0;
      max-width: none;
      box-shadow: none;
    }
    .high { color: var(--risk); font-weight: 650; }
    .mid { color: #e5922a; font-weight: 650; }
    .low { color: #2f9e6b; font-weight: 650; }
    .tag {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
    }
    .tag.high { color: var(--risk); background: #fff1f0; }
    .tag.mid { color: #d48806; background: #fff7e8; }
    .tag.low { color: #2f9e6b; background: #eef8f3; }
    td.num { font-variant-numeric: tabular-nums; }
    .ops { display: flex; gap: 8px; }
    .ops button {
      height: 26px;
      padding: 0 8px;
      border: 0;
      border-radius: 4px;
      background: none;
      color: var(--blue);
      font-size: 13px;
      transition: background-color .15s ease, color .15s ease;
    }
    .ops button:hover:not([disabled]) { background: #eef4ff; color: #1a5fd0; }
    .ops button[disabled],
    .ops button[disabled]:hover { color: #8b97a6; background: none; cursor: default; }
    .th-box { display: flex; align-items: center; gap: 4px; }
    .th-sort, .th-filter {
      border: 0;
      padding: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .th-sort { display: inline-flex; align-items: center; gap: 4px; }
    .th-sort:hover, .th-sort.is-on { color: var(--blue); }
    .th-filter {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: #8b97a6;
      flex: none;
    }
    .th-filter svg { width: 14px; height: 14px; fill: currentColor; }
    .th-filter:hover, .th-filter.is-on { color: var(--blue); background: #eef4ff; }
    .sort-ico { width: 12px; height: 12px; flex: none; }
    .sort-ico .up, .sort-ico .down { fill: #c5ced8; }
    .sort-ico.asc .up, .sort-ico.desc .down { fill: var(--blue); }
    .cell-pick {
      display: inline;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    td.point .cell-pick { white-space: normal; }
    .cell-pick:hover, .cell-pick.is-on { color: var(--blue); }
    .deal-ignored {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }
    .deal-ignored .deal-status { flex: none; }
    .ignore-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: none;
      cursor: help;
      outline: none;
    }
    .ignore-info .ignore-ico {
      position: relative;
      width: 16px;
      height: 16px;
      flex: none;
    }
    .ignore-info .ignore-ico img {
      position: absolute;
      inset: 0;
      display: block;
      width: 16px;
      height: 16px;
      object-fit: contain;
      transition: opacity 0.12s ease;
    }
    .ignore-info .ignore-ico .ignore-ico-on { opacity: 0; }
    .ignore-info:hover .ignore-ico .ignore-ico-off,
    .ignore-info:focus-visible .ignore-ico .ignore-ico-off { opacity: 0; }
    .ignore-info:hover .ignore-ico .ignore-ico-on,
    .ignore-info:focus-visible .ignore-ico .ignore-ico-on { opacity: 1; }
    .ignore-info .ignore-tip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      z-index: 40;
      transform: translateX(-50%);
      min-width: 160px;
      max-width: 280px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(24, 36, 52, 0.94);
      color: #fff;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.12s ease;
    }
    .ignore-info .ignore-tip::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      margin-left: -5px;
      border: 5px solid transparent;
      border-top-color: rgba(24, 36, 52, 0.94);
    }
    .ignore-info:hover .ignore-tip,
    .ignore-info:focus-visible .ignore-tip {
      opacity: 1;
      visibility: visible;
    }
    .ignore-dialog {
      width: min(480px, calc(100vw - 32px));
      padding: 0;
      border: 0;
      border-radius: 10px;
      overflow: hidden;
    }
    .ignore-dialog::backdrop { background: rgba(16, 32, 54, 0.45); }
    .ignore-dialog form { display: flex; flex-direction: column; }
    .ignore-dialog .ignore-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #e8eef6;
    }
    .ignore-dialog .ignore-head-title {
      font-size: 16px;
      font-weight: 650;
      color: var(--ink);
    }
    .ignore-dialog .ignore-x {
      flex: none;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #6d7f95;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .ignore-dialog .ignore-x:hover { background: #f4f7fb; color: #24364c; }
    .ignore-dialog .ignore-body {
      padding: 14px 16px;
    }
    .ignore-dialog .ignore-body label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #3d4e64;
    }
    .ignore-dialog textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px 12px;
      border: 1px solid #d7dee8;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink);
      resize: vertical;
      box-sizing: border-box;
    }
    .ignore-dialog textarea:focus {
      outline: none;
      border-color: #9ec0ff;
      box-shadow: 0 0 0 1px #9ec0ff;
    }
    .ignore-dialog .ignore-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px 14px;
      border-top: 1px solid #e8eef6;
    }
    .ignore-dialog .ignore-foot button {
      height: 32px;
      padding: 0 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .ignore-dialog .ignore-cancel {
      border: 1px solid #d7dee8;
      background: #fff;
      color: #3d4e64;
    }
    .ignore-dialog .ignore-ok {
      border: 0;
      background: var(--blue);
      color: #fff;
    }
    .col-pop[hidden] { display: none; }
    .col-pop {
      position: fixed;
      z-index: 30;
      width: 260px;
      max-height: 360px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border: 1px solid #e4ebf5;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(22, 62, 112, 0.14);
    }
    .col-pop.wide { width: 360px; }
    .col-pop strong { font-size: 13px; font-weight: 650; color: #24364c; }
    .col-pop input {
      height: 32px;
      padding: 0 10px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      color: var(--ink);
      font-size: 13px;
    }
    .col-list { min-height: 0; overflow: auto; display: flex; flex-direction: column; }
    .col-list label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 4px 2px;
      color: #24364c;
      font-size: 13px;
      cursor: pointer;
    }
    .col-list label:hover { color: var(--blue); }
    .col-list span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .col-list input { accent-color: var(--blue); flex: none; }
    .col-empty { padding: 12px 2px; color: var(--muted); font-size: 13px; }
    .col-foot { display: flex; justify-content: flex-end; gap: 8px; }
    .col-foot button { height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; }
    .col-foot .ghost { border: 0; background: none; color: #5e7088; }
    .col-foot .ok { border: 0; background: var(--blue); color: #fff; }
    .empty { padding: 28px; color: var(--muted); text-align: center; }
    .pager {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #eef2f6;
      color: #5e7088;
      font-size: 13px;
    }
    .pager select {
      height: 32px;
      padding: 0 8px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
    }
    .pager button {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
      color: #3d4e64;
      font-size: 13px;
    }
    .pager button.is-on { background: #eef4ff; color: var(--blue); border-color: #b9d0fb; }
    .pager button[disabled] { color: #b7c0cc; cursor: default; }
    .pager .total { margin-right: 4px; }
  </style>
</head>
<body>
  <header class="topbar is-idle">
    <div class="top-left">
      <a class="brand" href="cockpit.html" title="返回首页">
        <img class="logo" src="logo.png" alt="工程交易" />
      </a>
      <span class="split" aria-hidden="true"></span>
      <div class="view-tabs" id="viewTabs"></div>
    </div>
  </header>
  <main class="page" id="listPage">
    <div class="tabs" id="tabs" role="tablist"></div>
    <form class="filters" id="filters">
      <div class="grid" id="filterGrid"></div>
      <div class="actions"><button class="search-btn" type="submit">搜索</button><button class="reset-btn" id="resetFilters" type="button">重置</button></div>
    </form>
    <section class="table-card">
      <div class="table-scroll" id="tableScroll">
        <table>
          <thead>
            <tr>
              <th class="pin l1">项目编号</th>
              <th class="pin l2">项目名称</th>
              <th>项目资金规模(万元)</th>
              <th>项目进场时间</th>
              <th>所属交易中心</th>
              <th>项目所属行业</th>
              <th>招标人</th>
              <th>项目风险度</th>
              <th>项目风险点内容</th>
              <th>查看记录</th>
              <th>可信度</th>
              <th class="pin r">操作</th>
            </tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </section>
    <div class="col-pop" id="colPop" hidden>
      <strong id="colTitle"></strong>
      <input id="colQuery" type="search" placeholder="搜索筛选项" />
      <div class="col-list" id="colList"></div>
      <div class="col-foot">
        <button class="ghost" id="colClear" type="button">清除</button>
        <button class="ok" id="colOk" type="button">确定</button>
      </div>
    </div>
  </main>
  <dialog class="ignore-dialog" id="ignoreDialog" aria-labelledby="ignoreDialogTitle">
    <form id="ignoreForm">
      <div class="ignore-head">
        <span class="ignore-head-title" id="ignoreDialogTitle">忽略预警</span>
        <button type="button" class="ignore-x" id="ignoreClose" aria-label="关闭">×</button>
      </div>
      <div class="ignore-body">
        <label for="ignoreReasonInput">忽略原因</label>
        <textarea id="ignoreReasonInput" name="reason" placeholder="请填写忽略原因" required maxlength="500"></textarea>
      </div>
      <div class="ignore-foot">
        <button class="ignore-cancel" id="ignoreCancel" type="button">取消</button>
        <button class="ignore-ok" type="submit">确定</button>
      </div>
    </form>
  </dialog>
  <iframe class="detail-frame" id="detailFrame" hidden title="预警详情"></iframe>
  <script>
    const icon = (paths) => '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + "</svg>";
    const tabs = [
      { id: "project", label: "项目预警", icon: icon('<path d="M2 5.5 8 2.5l6 3L8 8.5 2 5.5Z"/><path d="m2 8.5 6 3 6-3"/><path d="m2 11.5 6 3 6-3"/>') },
      { id: "owner", label: "招标人预警", icon: icon('<path d="M3 14V6.5L8 3l5 3.5V14"/><path d="M6.5 14v-4h3v4"/><path d="M2 14h12"/>') },

    let ignorePendingRow = null;
    function openIgnoreDialog(row) {
      ignorePendingRow = row;
      ignoreReasonInput.value = "";
      ignoreDialog.showModal();
      ignoreReasonInput.focus();
    }
    function closeIgnoreDialog() {
      ignorePendingRow = null;
      ignoreDialog.close();
    }
    document.getElementById("ignoreCancel").addEventListener("click", closeIgnoreDialog);
    document.getElementById("ignoreClose").addEventListener("click", closeIgnoreDialog);
    ignoreDialog.addEventListener("click", (event) => {
      if (event.target === ignoreDialog) {
        ignorePendingRow = null;
        ignoreDialog.close();
      }
    });
    ignoreForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!ignorePendingRow) return;
      const reason = ignoreReasonInput.value.trim();
      if (!reason) {
        ignoreReasonInput.focus();
        return;
      }
      ignorePendingRow.ignoreReason = reason;
      ignorePendingRow.deal = "已忽略";
      ignorePendingRow = null;
      ignoreDialog.close();
      render();
    });
    let skipClose = false;
    document.getElementById("colList").addEventListener("change", () => {
      const key = state.openFilter;
      if (!key) return;
      skipClose = true;
      state.colFilters[key] = [...document.querySelectorAll("#colList input:checked")].map((input) => input.value);
      state.page = 1;
      render();
    });
    document.getElementById("colQuery").addEventListener("input", () => {
      if (state.openFilter) fillPop(state.openFilter);
    });
    document.getElementById("colClear").addEventListener("click", () => {
      if (!state.openFilter) return;
      state.colFilters[state.openFilter] = [];
      state.page = 1;
      render();
    });
    document.getElementById("colOk").addEventListener("click", closePop);
    document.getElementById("tableScroll").addEventListener("scroll", () => {
      if (state.openFilter) closePop();
    });
    document.querySelector(".page").addEventListener("scroll", () => {
      if (state.openFilter) closePop();
    });
    document.addEventListener("click", (event) => {
      if (skipClose) {
        skipClose = false;
        return;
      }
      if (!state.openFilter) return;
      if (event.target.closest("#colPop") || event.target.closest("[data-filter]")) return;
      closePop();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.openFilter) closePop();
    });
    function syncFilterOptions() {
      ["project", "owner", "agency", "bidder", "expert", "staff"].forEach((tab) => {
        views[tab].filters.forEach((field) => {
          if (field.type !== "select" || field.key === "viewState" || field.key === "years" || field.key === "level" || field.key === "source" || field.key === "deal") return;
          const values = [];
          rows.forEach((row) => {
            if (row.tab !== tab) return;
            const value = row[field.key];
            if (value && values.indexOf(value) < 0) values.push(value);
          });
          if (values.length) field.options = [field.all].concat(values);
        });
      });
    }
    syncFilterOptions();
    renderFilters();
    state.colFilters = emptyColFilters();
    renderTabs();
    render();
  </script>
</body>
</html>
