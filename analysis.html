<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>分析</title>
  <style>
    :root {
      --ink: #16324f;
      --muted: #6d7f95;
      --line: #e4ebf5;
      --blue: #2f78f6;
      --risk: #ef3b3b;
      --shadow: 0 10px 30px rgba(22, 62, 112, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #e6e8ec;
    }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid rgba(47, 120, 246, 0.35);
      outline-offset: 1px;
    }

    .topbar {
      flex: none;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: #fff;
      border-bottom: 1px solid #e6eaf0;
    }
    .top-left {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand {
      flex: none;
      display: flex;
      align-items: center;
      line-height: 0;
    }
    .logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: block;
    }
    .subject {
      min-width: 0;
      font-size: 16px;
      font-weight: 650;
      color: #24364c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-right { display: flex; align-items: center; gap: 8px; flex: none; }
    .pack, .god {
      height: 32px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 13px;
      flex: none;
    }
    .pack {
      border: 0;
      background: var(--blue);
      color: #fff;
    }
    .pack:hover { background: #1f6feb; }
    .god {
      border: 1px solid #b9d0fb;
      background: #eef4ff;
      color: #1f6feb;
    }
    .pack-dialog {
      width: min(640px, calc(100vw - 32px));
      max-height: min(86vh, 820px);
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: 10px;
      color: var(--ink);
      box-shadow: 0 18px 48px rgba(22, 62, 112, 0.18);
    }
    .pack-dialog::backdrop { background: rgba(16, 32, 54, 0.45); }
    .pack-dialog form {
      display: flex;
      flex-direction: column;
      max-height: min(86vh, 820px);
    }
    .pack-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
    }
    .pack-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .pack-x {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #6d7f95;
      font-size: 18px;
      line-height: 1;
    }
    .pack-x:hover { background: #f3f6fa; color: var(--ink); }
    .pack-body {
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px 20px 8px;
    }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field .lab { font-size: 13px; color: #3d4e64; }
    .field input[type="text"],
    .field textarea,
    .field select,
    .field input[type="file"] {
      width: 100%;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
    }
    .field input[type="text"],
    .field select { height: 34px; padding: 0 10px; }
    .field textarea {
      min-height: 112px;
      padding: 8px 10px;
      resize: vertical;
      line-height: 1.65;
    }
    .field input[readonly] { background: #f6f8fb; color: #3d4e64; }
    .field .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .field .checks .check { margin: 0; }
    .field .hint { margin: 0; font-size: 12px; color: #8b97a6; line-height: 1.5; }
    .file-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .file-list:empty { display: none; }
    .file-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid #e4ebf5;
      border-radius: 6px;
      background: #f6f8fb;
      font-size: 13px;
      color: #24364c;
    }
    .file-list li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-list button {
      flex: none;
      height: 24px;
      padding: 0 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #c43745;
      font-size: 12px;
    }
    .file-list button:hover { background: rgba(239, 59, 59, 0.08); }
    .field .err { margin: 0; font-size: 12px; color: var(--risk); }
    .pack-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--line);
    }
    .pack-saved { margin: 0; color: #6b7c90; font-size: 12px; white-space: nowrap; }
    .pack-actions { display: flex; gap: 8px; }
    .pack-foot button {
      height: 32px;
      padding: 0 16px;
      border-radius: 6px;
      font-size: 13px;
    }
    .pack-foot .ghost {
      border: 1px solid #d7dee8;
      background: #fff;
      color: #3d4e64;
    }
    .pack-foot .ok { border: 0; background: var(--blue); color: #fff; }
    .pack-foot .ok:hover { background: #1f6feb; }
    .search {
      width: 280px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
    }
    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      font-size: 13px;
      color: var(--ink);
      background: transparent;
    }
    .search svg { flex: none; color: #8b97a6; }
    .switch { display: flex; }
    .switch button {
      width: 36px;
      height: 32px;
      border: 1px solid #d7dee8;
      background: #fff;
      color: #5e7088;
      font-size: 13px;
    }
    .switch button:first-child { border-radius: 6px 0 0 6px; }
    .switch button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
    .switch button.is-on {
      background: #eef4ff;
      color: var(--blue);
      border-color: #b9d0fb;
      position: relative;
      z-index: 1;
    }

    .workspace {
      --time-h: 178px;
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #e8eaee;
    }

    .detail, .relate, .time-panel {
      position: absolute;
      z-index: 5;
      display: flex;
      background: #fff;
      border: 1px solid #e6eaf0;
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(22, 62, 112, 0.12);
    }
    .detail, .relate {
      top: 12px;
      bottom: calc(var(--time-h) + 24px);
      min-height: 0;
      overflow: hidden;
      transition: width 0.24s ease, bottom 0.24s ease;
    }
    .workspace:has(.time-panel.is-collapsed) .detail.open,
    .workspace:has(.time-panel.is-collapsed) .relate.open { bottom: 64px; }
    .detail { left: 12px; width: 320px; }
    .relate { right: 12px; width: 360px; }
    .detail:not(.open),
    .relate:not(.open) {
      bottom: auto;
      width: auto;
      height: auto;
      overflow: visible;
      background: transparent;
      border: 0;
      box-shadow: none;
    }
    .detail:not(.open) .body,
    .relate:not(.open) .body { display: none; }
    .body {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 16px 18px 20px;
    }
    .detail.open,
    .relate.open { overflow: visible; }
    .detail.open .body,
    .relate.open .body {
      position: absolute;
      inset: 0;
      overflow: auto;
    }
    .vtab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 36px;
      height: auto;
      padding: 10px 0 12px;
      border: 1px solid #e6eaf0;
      border-radius: 8px;
      background: #fff;
      color: #5e7088;
      writing-mode: horizontal-tb;
      letter-spacing: 0;
      font-size: 13px;
      box-shadow: 0 6px 16px rgba(22, 62, 112, 0.12);
    }
    .vtab:hover { background: #f6f9fd; color: var(--ink); }
    .vtab-icon { display: block; width: 16px; height: 16px; }
    .vtab span {
      writing-mode: vertical-rl;
      letter-spacing: 0.22em;
      line-height: 1;
    }
    .detail.open { border-top-right-radius: 0; }
    .relate.open { border-top-left-radius: 0; }
    .detail.open .vtab {
      position: absolute;
      top: -1px;
      right: -35px;
      border-left: 0;
      border-radius: 0 8px 8px 0;
      box-shadow: none;
    }
    .detail.open .vtab::before {
      content: "";
      position: absolute;
      left: -2px;
      top: 1px;
      bottom: 1px;
      width: 3px;
      background: #fff;
    }
    .relate.open .vtab {
      position: absolute;
      top: -1px;
      left: -35px;
      border-right: 0;
      border-radius: 8px 0 0 8px;
      box-shadow: none;
    }
    .relate.open .vtab::before {
      content: "";
      position: absolute;
      right: -2px;
      top: 1px;
      bottom: 1px;
      width: 3px;
      background: #fff;
    }
    .entity-name {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 14px;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.45;
      color: #24364c;
    }
    .entity-name .glyph { flex: none; margin-top: 2px; width: 18px; height: 16px; color: var(--blue); }
    .tabs {
      display: flex;
      gap: 0;
      margin: 0 0 16px;
      padding: 0 4px;
      background: #f3f5f8;
      border-radius: 6px;
    }
    .tabs button {
      flex: 1;
      height: 34px;
      padding: 0;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #6d7f95;
      font-size: 14px;
    }
    .tabs button.is-on {
      color: var(--blue);
      border-bottom-color: var(--blue);
      font-weight: 650;
    }
    .warn-dot { display: none; }
    .tabs button.has-warn .warn-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-left: 4px;
      border-radius: 50%;
      background: var(--risk);
      vertical-align: 1px;
    }
    .entity-name.is-risk .glyph,
    .entity-name.lv-high .glyph { color: #ef4d4f; }
    .entity-name.lv-mid .glyph { color: #e5922a; }
    .entity-name.lv-low .glyph { color: #2f9e6b; }
    .attr {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 14px 12px;
      margin: 0;
      font-size: 13px;
    }
    .attr dt { color: #8b97a6; }
    .attr dd { margin: 0; color: #24364c; text-align: right; word-break: break-all; }
    .more { margin: 18px 0 0; color: #b0bac6; letter-spacing: 2px; }
    .event, .alert {
      padding: 10px 0;
      border-bottom: 1px solid #f0f3f7;
    }
    .event b, .alert b { display: block; font-size: 13px; font-weight: 650; color: #24364c; }
    .event span, .alert span { display: block; margin-top: 4px; font-size: 12px; color: #8b97a6; line-height: 1.5; }
    .alert b { color: #c43745; }

    .kicker { margin: 0; font-size: 12px; color: var(--muted); }
    .relate h2 { margin: 6px 0 14px; font-size: 16px; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 13px;
      color: #3d4e64;
    }
    .summary { margin: 16px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .rel-k { margin: 0; font-size: 13px; color: #8b97a6; }
    .rel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .rel-clear { border: 0; background: transparent; color: #8b97a6; font-size: 12px; }
    .rel-clear:hover { color: var(--blue); }
    .rel-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #e8f3ff;
      color: #1f2a37;
      font-size: 13px;
    }
    .rel-chip .glyph { flex: none; width: 16px; height: 16px; color: #2f78f6; }
    .rel-chip b { flex: 1; min-width: 0; overflow: hidden; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
    .rel-chip button { border: 0; background: transparent; color: #8aa0b8; font-size: 16px; line-height: 1; }
    .rel-empty { margin: 0 0 12px; font-size: 12px; color: #8b97a6; line-height: 1.6; }
    .rel-add {
      display: inline-flex;
      align-items: center;
      height: 32px;
      margin-top: 4px;
      padding: 0 14px;
      border: 1px solid #d5dbe3;
      border-radius: 16px;
      background: #fff;
      color: #3d4e64;
      font-size: 13px;
    }
    .rel-add:hover { border-color: #b9c6d6; color: var(--ink); }
    .rel-add:disabled { color: #b0bac6; cursor: default; }
    .rel-card { margin-top: 14px; padding: 14px 12px 12px; border-radius: 8px; background: #f4f6f8; }
    .rel-line { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; color: #5c6b7e; }
    .rel-line select, .rel-cond select {
      width: 100%;
      height: 32px;
      border: 1px solid #e1e6ee;
      border-radius: 4px;
      background: #fff;
      color: #24364c;
      padding: 0 8px;
      font-size: 13px;
    }
    .rel-sec { margin: 2px 0 8px; font-size: 13px; color: #5c6b7e; }
    .rel-cond { display: grid; grid-template-columns: minmax(0, 1fr) 88px 28px; gap: 8px; align-items: center; margin-bottom: 8px; }
    .rel-trash { display: grid; place-items: center; height: 32px; border: 0; background: transparent; color: #98a2b3; }
    .rel-trash:hover { color: #ef4d4f; }
    .rel-more {
      display: inline-flex;
      align-items: center;
      height: 30px;
      margin-top: 2px;
      padding: 0 12px;
      border: 1px dashed #c5ced8;
      border-radius: 15px;
      background: #fff;
      color: #3d4e64;
      font-size: 13px;
    }
    .rel-result-k { margin: 14px 0 8px; font-size: 13px; color: #5c6b7e; }
    .rel-result { display: grid; grid-template-columns: minmax(0, 1fr) 46px auto; gap: 8px; align-items: center; }
    .rel-kind { display: flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 4px; background: #e7f1ff; color: #3d4e64; font-size: 13px; }
    .rel-count { display: flex; align-items: center; justify-content: center; height: 34px; border-radius: 4px; background: #4e5969; color: #fff; font-size: 14px; font-weight: 650; }
    .rel-go { height: 34px; padding: 0 12px; border: 0; border-radius: 4px; background: #2f78f6; color: #fff; font-size: 13px; }
    .rel-go:disabled { background: #b7c3d4; }
    .rel-menu { position: absolute; z-index: 8; min-width: 156px; padding: 6px 0; border-radius: 8px; background: #fff; box-shadow: 0 8px 24px rgba(22, 62, 112, 0.16); }
    .rel-menu button { display: flex; justify-content: space-between; gap: 18px; width: 100%; height: 34px; padding: 0 14px; border: 0; background: transparent; color: #24364c; font-size: 13px; text-align: left; }
    .rel-menu button:hover { background: #f4f8fd; }
    .rel-menu em { font-style: normal; color: #8b97a6; }

    .canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }
    .canvas.is-panning { cursor: grabbing; }
    .canvas.is-panning .stage { transition: none; }
    .canvas.is-table { cursor: default; }
    .stage {
      position: relative;
      width: 1120px;
      height: 500px;
      transform-origin: center center;
      transition: transform 0.24s ease;
    }
    #wires {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .wire-hit { pointer-events: stroke; cursor: pointer; }
    .wire:hover .wire-line { stroke-width: 3.5; }
    .wire-tip {
      position: absolute;
      z-index: 6;
      max-width: 280px;
      padding: 8px 10px 10px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #f3d0d2;
      box-shadow: 0 8px 24px rgba(22, 62, 112, 0.16);
      pointer-events: none;
    }
    .wire-tip[hidden] { display: none; }
    .wire-tip-k { margin-bottom: 4px; font-size: 11px; color: #c43745; }
    .wire-tip-name { font-size: 13px; font-weight: 700; color: #24364c; line-height: 1.45; }
    .wire-tip-name + .wire-tip-name { margin-top: 4px; }
    .node {
      position: absolute;
      width: 148px;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: center;
      color: #3d4e64;
    }
    .hub {
      position: relative;
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;
    }
    .win-badge {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: -12px;
      transform: translateX(-50%);
      height: 16px;
      padding: 0 7px;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 16px;
      letter-spacing: 0.4px;
      pointer-events: none;
      white-space: nowrap;
    }
    .ring-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 180px;
      height: 180px;
      transform: translate(-50%, -50%);
      opacity: 1;
      overflow: visible;
      z-index: 2;
      pointer-events: none;
    }
    .node:hover { z-index: 8; }
    .ring {
      display: block;
      width: 180px;
      height: 180px;
      overflow: visible;
      transform: scale(0.5);
      transform-origin: 50% 50%;
      transition: transform 0.22s ease;
    }
    .node:hover .ring { transform: scale(1); }
    .seg {
      fill: none;
      stroke-width: 8;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
      transition: stroke-width 0.12s ease, filter 0.12s ease;
    }
    .seg-hit { fill: none; stroke: transparent; stroke-width: 22; vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
    .seg-group { pointer-events: none; }
    .node:hover .seg-group { pointer-events: auto; }
    .seg-group:hover .seg { stroke-width: 12; }
    .seg-group.is-open .seg {
      stroke-width: 12;
      filter: drop-shadow(0 0 5px var(--glow));
    }
    .seg-group.is-down .seg {
      stroke-width: 18;
      filter: drop-shadow(0 0 8px var(--glow));
    }
    .arm {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-origin: 0 0;
    }
    .seg-label {
      position: absolute;
      left: 0;
      top: -90px;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 0 4px #e8eaee, 0 0 4px #e8eaee, 0 1px 1px #fff;
      transition: opacity 0.16s ease;
    }
    .seg-label.is-flip { transform: translateX(-50%) rotate(180); }
    .node:hover .seg-label { opacity: 1; }
    .mark {
      position: relative;
      z-index: 3;
      width: 46px;
      height: 46px;
      margin: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(180deg, #c0deff 0%, #4089f3 42%);
      color: #fff;
      box-shadow: 0 4px 10px rgba(64, 137, 243, 0.28);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    .node.kind-project .mark { background: linear-gradient(180deg, #c9c0ff 0%, #8574f7 42%); box-shadow: 0 4px 10px rgba(133, 116, 247, 0.3); }
    .node.kind-bidder .mark { background: linear-gradient(180deg, #c0deff 0%, #4089f3 42%); box-shadow: 0 4px 10px rgba(64, 137, 243, 0.28); }
    .node.kind-owner .mark { background: linear-gradient(180deg, #ffe7be 0%, #f3b240 42%); box-shadow: 0 4px 10px rgba(243, 178, 64, 0.32); }
    .node.kind-agency .mark { background: linear-gradient(180deg, #afe1ff 0%, #2a9ade 42%); box-shadow: 0 4px 10px rgba(42, 154, 222, 0.28); }
    .node.kind-expert .mark { background: linear-gradient(180deg, #c28dfb 0%, #7430bd 42%); box-shadow: 0 4px 10px rgba(116, 48, 189, 0.3); }
    .node.kind-staff .mark { background: linear-gradient(180deg, #8dfbdb 0%, #1fc292 42%); box-shadow: 0 4px 10px rgba(31, 194, 146, 0.3); }

            const rank = row && row.level === "高风险" ? 2 : row && row.level === "中风险" ? 1 : 0;
            return cited * 100 + alerts.length * 10 + rank;
          };

          if (item.owner) project.bidder = item.owner;

    const glyphs = {

    };
    const LEVEL_COLOR = { normal: "#2f78f6", risk: "#f0b429", warn: "#ef4d4f" };
    const TONE_HEX = { high: "#ef4d4f", mid: "#e5922a", low: "#2f9e6b" };
    const graph = (gz && gz.graphs && gz.graphs[project.name]) || null;
    function toneName(level) {
      const text = String(level || "");
      if (text.indexOf("低") === 0) return "low";
      if (text.indexOf("中") === 0) return "mid";
      if (text.indexOf("高") === 0) return "high";
      return "";
    }
    function toneRank(tone) { return tone === "high" ? 3 : tone === "mid" ? 2 : tone === "low" ? 1 : 0; }
    function strongerTone(a, b) { return toneRank(a) >= toneRank(b) ? a : b; }
    const rowLevel = {};
    function rememberLevel(key, level) {
      const tone = toneName(level);
      if (!key || !tone) return;
      rowLevel[key] = strongerTone(rowLevel[key] || "", tone);
    }
    ((gz && gz.rows) || []).forEach((row) => {
      rememberLevel(row.code, row.level);
      rememberLevel(row.name, row.level);
    });
    ((gz && gz.companies) || []).forEach((row) => rememberLevel(row.name, row.level));
    const alertTone = {};
    ((graph && graph.alerts) || []).forEach((item) => { alertTone[item.id] = toneName(item.level) || "high"; });
    function toneOfAlerts(ids) {
      let tone = "";
      (ids || []).forEach((id) => { tone = strongerTone(tone, alertTone[id] || ""); });
      return tone;

    const quietPark = agencyEntry && askedAgency === "贵州中鼎招标有限公司" && project.name === "遵义汇川区某物流园场平工程";
    function toneOfNode(id, name, full) {
      if (quietPark && (id === "project" || name === project.name)) return "";

      ((graph && graph.alerts) || []).forEach((item) => {
        if ((item.subjects || []).indexOf(id) >= 0) cited = strongerTone(cited, toneName(item.level));
      });
      if (cited) return cited;
      return rowLevel[id] || rowLevel[full] || rowLevel[name] || (id === "project" && graph ? (rowLevel[graph.id] || rowLevel[project.name] || "") : "");
    }
    function paintTone(spec) {
      if (!spec) return spec;
      spec.tone = toneOfNode(spec.id, spec.name, spec.fullName) || (spec.risk ? "high" : "");
      if (spec.tone) spec.risk = true;
      return spec;
    }
    if (graph) {
      project.bidder = graph.owner || project.bidder;
      project.agency = graph.agency || "";

    function linkKey(a, b) {
      return a < b ? a + "|" + b : b + "|" + a;
    }
    function warningsOf(a, b) {
      const links = (graph && graph.links) || [];
      const link = links.find((item) => linkKey(item.a, item.b) === linkKey(a.id, b.id));
      if (!link || !link.warn) return [];
      const ids = link.alertIds || (link.alertId ? [link.alertId] : []);
      const alerts = (graph && graph.alerts) || [];
      return ids.map((id) => {
        const hit = alerts.find((item) => item.id === id);
        return hit ? hit.title : "";
      }).filter(Boolean);
    }
    const ROLE = { owner: "招标主体", agency: "招标代理", bidder: "投标企业", expert: "专家", project: "项目", person: "自然人" };
    const OPSET = {
      owner: [["projects", "招标项目"], ["agencies", "招标代理"], ["staff", "员工"], ["legal", "法人"]],
      agency: [["clients", "代理招标主体"], ["projects", "代理项目"], ["staff", "员工"], ["legal", "法人"]],
      bidder: [["projects", "投标项目"], ["staff", "员工"], ["legal", "法人"]],
      expert: [["projects", "评审项目"]],
      project: [["owner", "招标主体"], ["agency", "招标代理"], ["bidders", "投标企业"], ["experts", "专家"]],
      person: [["companies", "作为法人企业"]]

    function opsFor(type, levels) {
      return OPSET[type].map(function (pair, index) {

    function placed(node, cx, cy, w) {

      node.y = cy - markSize / 2;
      node.w = w;
      return node;
    }
    const catalog = {};
    function defaultAttrs(spec) {
      if (spec.type === "person") {
        return [["证件号码", "—"], ["职务", spec.job || "职员"], ["关联企业", spec.orgName || "—"]];

    function arcPath(r, a0, a1) {

      return "M " + x0.toFixed(2) + " " + y0.toFixed(2) + " A " + r + " " + r + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2);

    function ringMarkup(node) {
      const ops = node.ops;

      const segs = ops.map((op, index) => {

        let shape;

          shape = '<circle class="seg-hit" cx="0" cy="0" r="' + radius + '"></circle><circle class="seg" cx="0" cy="0" r="' + radius + '" stroke="' + color + '"></circle>';
        } else {
          const sweep = 360 / count;

          const start = -90 + index * sweep + gap / 2;
          const end = -90 + (index + 1) * sweep - gap / 2;

        const sweep = 360 / count;

      if (target.closest("[data-add-rel]")) {
        event.stopPropagation();
        openRelMenu(target.closest("[data-add-rel]"));
        return;
      }
      const dirBtn = target.closest("[data-dir]");
      if (dirBtn) {
        addRelBlock(dirBtn.dataset.dir);
        renderRelate();
        return;
      }
      const removeChip = target.closest("[data-rm-chip]");
      if (removeChip) {
        const index = relatePick.indexOf(removeChip.dataset.rmChip);
        if (index >= 0) relatePick.splice(index, 1);
        renderRelate();
        return;
      }
      if (target.closest("[data-clear-pick]")) {
        relatePick.length = 0;
        renderRelate();
        return;
      }
      const addCond = target.closest("[data-add-cond]");
      if (addCond) {
        const block = relBlocks.find((item) => String(item.id) === addCond.dataset.block);
        const fields = block ? (REL_FIELDS[block.direction] || []) : [];
        if (!block || !fields.length) return;
        const used = block.conditions.map((cond) => cond.field);
        const spec = fields.find((field) => used.indexOf(field.key) < 0) || fields[0];
        block.conditions.push({ field: spec.key, value: spec.options[0] });
        renderRelate();
        return;
      }
      const removeCond = target.closest("[data-rm-cond]");
      if (removeCond) {
        const block = relBlocks.find((item) => String(item.id) === removeCond.dataset.block);
        if (!block) return;

        renderRelate();
        return;

      const applyBtn = target.closest("[data-apply]");

      const cond = block.conditions[Number(select.dataset.cond)];

      if (select.dataset.part === "field") {

      const right = pad + (relate.classList.contains("open") ? 360 + pad : 0) + reportWide;

      const box = insets();
      const cw = canvas.clientWidth;
      const ch = canvas.clientHeight;
      const availW = Math.max(cw - box.left - box.right, 280);
      const availH = Math.max(ch - box.top - box.bottom, 200);
      const scale = Math.max(Math.min(availW / (stage.offsetWidth + 48), availH / (stage.offsetHeight + 36), 1), 0.34);
      const dx = box.left + (cw - box.left - box.right) / 2 - cw / 2;
      const dy = box.top + (ch - box.top - box.bottom) / 2 - ch / 2;
      stage.style.transform = "translate(" + (dx + panX) + "px," + (dy + panY) + "px) scale(" + scale + ")";
      const crumb = document.getElementById("crumb");
      crumb.style.left = (box.left + (cw - box.left - box.right) / 2) + "px";
      const sheet = canvas.querySelector(".sheet");
      sheet.style.left = box.left + "px";
      sheet.style.top = box.top + "px";
      sheet.style.right = box.right + "px";
      sheet.style.bottom = box.bottom + "px";
    }

      const startX = event.clientX;
      const startY = event.clientY;
      const originX = panX;

      panMoved = false;
      canvas.classList.add("is-panning");
      function move(nextEvent) {
        const dx = nextEvent.clientX - startX;

      function end() {
        canvas.classList.remove("is-panning");
        canvas.removeEventListener("pointermove", move);
        canvas.removeEventListener("pointerup", end);
        canvas.removeEventListener("pointercancel", end);
      }
      canvas.setPointerCapture(event.pointerId);

    document.getElementById("reportGrip").addEventListener("pointerdown", (event) => {
      event.preventDefault();
      const startY = event.clientY;
      const startH = reportConclusionBox.getBoundingClientRect().height;
      const max = Math.max(160, reportDrawer.clientHeight - 180);
      function move(nextEvent) {
        reportConclusionBox.style.height = Math.min(max, Math.max(128, startH + nextEvent.clientY - startY)) + "px";
      }
      function end() {
        reportGrip.removeEventListener("pointermove", move);
        reportGrip.removeEventListener("pointerup", end);
        reportGrip.removeEventListener("pointercancel", end);
      }
      const reportGrip = document.getElementById("reportGrip");
      reportGrip.setPointerCapture(event.pointerId);
      reportGrip.addEventListener("pointermove", move);
      reportGrip.addEventListener("pointerup", end);
      reportGrip.addEventListener("pointercancel", end);
    });
    reportFiles.addEventListener("change", () => {
      [...reportFiles.files].forEach((file) => {
        if (!report.files.some((item) => item.name === file.name && item.size === file.size)) report.files.push(file);
      });
      reportFiles.value = "";
      renderAttach();
    });
    reportFileList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove-file]");
      if (!button) return;
      report.files.splice(Number(button.dataset.removeFile), 1);
      renderAttach();
    });
    function reportStamp() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return {
        text: now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds()),
        file: now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds())
      };
    }
    function reportLines() {
      const lines = ["线索报告"];
      lines.push("");
      lines.push(reportConclusion.value || autoConclusion());
      lines.push("", "分析过程");
      if (!report.clues.length) lines.push("尚未添加线索");
      report.clues.forEach((item, index) => {
        lines.push("", (index + 1) + ". " + item.title + "（" + item.level + "）");
        lines.push("涉及主体：" + item.whoNames.join("、"));
        lines.push("事项：" + item.note);
        lines.push("模型：" + item.model);
        item.steps.forEach((step, stepIndex) => lines.push((stepIndex + 1) + "）" + step));
      });
      lines.push("", "附件");
      if (!report.files.length) lines.push("无");
      report.files.forEach((file) => lines.push(file.name));
      return lines;
    }
    function downloadBlob(bytes, name, type) {
      const blob = bytes instanceof Blob ? bytes : new Blob([bytes], { type: type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }
    function paintReport() {
      const width = 900;
      const max = width - 96;
      const probe = document.createElement("canvas").getContext("2d");
      probe.font = "16px PingFang SC, Microsoft YaHei, sans-serif";
      const lines = [];
      reportLines().forEach((text) => {
        if (!text) { lines.push(""); return; }
        let line = "";
        for (const ch of text) {
          if (probe.measureText(line + ch).width > max) { lines.push(line); line = ch; }
          else line += ch;
        }
        lines.push(line);
      });
      const board = document.createElement("canvas");
      board.width = width;
      board.height = Math.max(480, 80 + lines.length * 28);
      const g = board.getContext("2d");
      g.fillStyle = "#ffffff";
      g.fillRect(0, 0, board.width, board.height);
      g.fillStyle = "#16324f";
      g.font = "16px PingFang SC, Microsoft YaHei, sans-serif";
      lines.forEach((line, index) => g.fillText(line, 48, 56 + index * 28));
      return board;
    }
    function jpegPdf(board) {
      const raw = atob(board.toDataURL("image/jpeg", 0.86).split(",")[1]);
      const img = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i += 1) img[i] = raw.charCodeAt(i);
      const pageW = 595;
      const pageH = Math.max(420, Math.round(pageW * board.height / board.width));
      const enc = new TextEncoder();
      const chunks = [];
      let length = 0;
      const offsets = [];
      function push(part) {
        const bytes = typeof part === "string" ? enc.encode(part) : part;
        offsets.push(length);
        chunks.push(bytes);
        length += bytes.length;
      }
      push("%PDF-1.4\n");
      const at = () => offsets[offsets.length - 1];
      const o1 = length; push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
      const o2 = length; push("2 0 obj\n<< /Type /Pages /Count 1 /Kids [3 0 R] >>\nendobj\n");
      const o3 = length; push("3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pageW + " " + pageH + "] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>\nendobj\n");
      const stream = "q\n" + pageW + " 0 0 " + pageH + " 0 0 cm\n/Im0 Do\nQ";
      const o4 = length; push("4 0 obj\n<< /Length " + enc.encode(stream).length + " >>\nstream\n" + stream + "\nendstream\nendobj\n");
      const o5 = length; push("5 0 obj\n<< /Type /XObject /Subtype /Image /Width " + board.width + " /Height " + board.height + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + img.length + " >>\nstream\n");
      push(img);
      push("\nendstream\nendobj\n");
      const xrefAt = length;
      let xref = "xref\n0 6\n0000000000 65535 f \n";
      [o1, o2, o3, o4, o5].forEach((offset) => { xref += String(offset).padStart(10, "0") + " 00000 n \n"; });
      push(xref);
      push("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xrefAt + "\n%%EOF");
      const out = new Uint8Array(length);
      let cursor = 0;
      chunks.forEach((chunk) => { out.set(chunk, cursor); cursor += chunk.length; });
      return out;
    }
    reportGo.addEventListener("click", () => {
      if (!report.clues.length) return;
      const format = document.getElementById("reportFormat").value;
      const when = reportStamp();
      const base = "线索报告-" + when.file;
      if (format === "word") {
        const blocks = reportLines().map((line) => "<p>" + (line ? esc(line) : "&nbsp;") + "</p>").join("");
        const html = "<html><head><meta charset='utf-8'><title>线索报告</title></head><body>" + blocks + "</body></html>";
        downloadBlob(new TextEncoder().encode(html), base + ".doc", "application/msword");
      } else {
        downloadBlob(jpegPdf(paintReport()), base + ".pdf", "application/pdf");
      }
      report.generated = "已生成 " + format + " 报告 · " + when.text;
      renderReport();
    });
    syncConclusion();
    renderReport();

    const packDialog = document.getElementById("packDialog");
    const clueName = document.getElementById("clueName");
    const clueNo = document.getElementById("clueNo");
    const clueDesc = document.getElementById("clueDesc");
    const clueErr = document.getElementById("clueErr");
    const clueFiles = document.getElementById("clueFiles");
    const fileList = document.getElementById("fileList");
    const pickedFiles = [];
    function renderFiles() {
      fileList.innerHTML = pickedFiles.map((file, index) =>
        "<li><span title=\"" + esc(file.name) + "\">" + esc(file.name) + "</span><button type=\"button\" data-remove=\"" + index + "\">删除</button></li>"
      ).join("");
    }
    function addFiles(files) {
      [...files].forEach((file) => {
        const same = pickedFiles.some((item) => item.name === file.name && item.size === file.size && item.lastModified === file.lastModified);
        if (!same) pickedFiles.push(file);
      });
      renderFiles();
    }
    function makeClueNo() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const day = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate());
      const seq = pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
      return "XS" + day + seq;
    }
    function makeClueDesc() {
      const nameEl = document.getElementById("entityName");
      const focus = (nameEl && nameEl.textContent.trim()) || (current() && current().name) || project.name;
      return "围绕「" + project.name + "」形成监管线索。当前分析视图以「" + focus + "」为中心，关联招标人" + project.bidder + "、招标代理" + project.agency + "及相关投标主体。项目类别为" + project.cat + "，风险等级" + project.level + "，关键时点" + project.date + "。本次打包纳入当前视图内容、主体属性、交易时序和预警记录，并以分析图、数据表一并归档，供责任部门核查围标串标、资质挂靠、程序异常和利益关联等情形，作为后续核查、约谈和移交的依据。";
    }
    const draftKey = "clue-draft:analysis:" + project.name;
    const packSaved = document.getElementById("packSaved");
    function formatSaved(date) {
      const pad = (n) => String(n).padStart(2, "0");
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + " " + pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
    }
    function showSaved(text) {
      packSaved.textContent = text ? "上次保存：" + text : "上次保存：—";
    }
    function readDraft() {
      try { return JSON.parse(localStorage.getItem(draftKey) || "null"); } catch (error) { return null; }
    }
    function collectDraft() {
      const checked = (name) => [...packDialog.querySelectorAll('input[name="' + name + '"]')].filter((input) => input.checked).map((input) => input.value);
      return {
        savedAt: formatSaved(new Date()),
        name: clueName.value,
        no: clueNo.value,
        desc: clueDesc.value,
        dept: document.getElementById("clueDept").value,
        content: checked("content"),
        form: checked("form"),
        files: pickedFiles.map((file) => ({ name: file.name, size: file.size || 0, lastModified: file.lastModified || 0 }))
      };
    }
    function applyDraft(draft) {
      clueName.value = draft.name || "";
      clueNo.value = draft.no || makeClueNo();
      clueDesc.value = draft.desc || "";
      const dept = document.getElementById("clueDept");
      if ([...dept.options].some((option) => option.value === draft.dept)) dept.value = draft.dept;
      packDialog.querySelectorAll('input[type="checkbox"]').forEach((input) => {
        const group = input.name === "content" ? draft.content : draft.form;
        input.checked = Array.isArray(group) && group.includes(input.value);
      });
      pickedFiles.length = 0;
      (draft.files || []).forEach((file) => pickedFiles.push(file));
      renderFiles();
    }
    function resetPack() {
      clueName.value = project.name + "监管线索";
      clueNo.value = makeClueNo();
      clueDesc.value = makeClueDesc();
      packDialog.querySelectorAll('input[type="checkbox"]').forEach((input) => { input.checked = true; });
      document.getElementById("clueDept").selectedIndex = 0;
      pickedFiles.length = 0;
      renderFiles();
    }
    function openPack() {
      const draft = readDraft();
      if (draft) {
        applyDraft(draft);
        showSaved(draft.savedAt);
      } else {
        resetPack();
        showSaved("");
      }
      clueFiles.value = "";
      clueErr.hidden = true;
      packDialog.showModal();
      clueName.focus();
    }
    document.getElementById("packDraft").addEventListener("click", () => {
      const draft = collectDraft();
      try { localStorage.setItem(draftKey, JSON.stringify(draft)); } catch (error) {}
      showSaved(draft.savedAt);
    });
    document.getElementById("packCancel").addEventListener("click", () => packDialog.close());
    document.getElementById("packClose").addEventListener("click", () => packDialog.close());
    clueName.addEventListener("input", () => { clueErr.hidden = true; });
    clueFiles.addEventListener("change", () => {
      addFiles(clueFiles.files);
      clueFiles.value = "";
    });
    fileList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove]");
      if (!button) return;
      pickedFiles.splice(Number(button.dataset.remove), 1);
      renderFiles();
    });
    document.getElementById("packForm").addEventListener("submit", (event) => {
      event.preventDefault();
      if (!clueName.value.trim()) {
        clueErr.hidden = false;
        clueName.focus();
        return;
      }
      try { localStorage.removeItem(draftKey); } catch (error) {}
      packDialog.close();
    });

    renderTimeline();
    render();
  </script>
</body>
</html>
