name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure .nojekyll
        run: test -f .nojekyll || touch .nojekyll
      - name: Enable GitHub Pages (gh-pages branch)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getPages({ owner, repo });
              core.info("Pages site already exists");
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: "legacy",
                source: { branch: "gh-pages", path: "/" },
              });
              core.info("Created GitHub Pages site from gh-pages branch");
            }
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
          exclude_assets: ".github"
