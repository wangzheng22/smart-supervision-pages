<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>分层探索</title>
  <style>
    :root { --ink: #16324f; --muted: #6d7f95; --risk: #ef4d4f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 760px at 10% -8%, #ffffff 0%, rgba(255, 255, 255, 0) 58%),
        radial-gradient(1000px 700px at 92% 4%, #e9e1ff 0%, rgba(233, 225, 255, 0) 60%),
        radial-gradient(1100px 900px at 74% 108%, #d9e6ff 0%, rgba(217, 230, 255, 0) 62%),
        linear-gradient(158deg, #f7f9fd 0%, #eaeffb 46%, #e5ecfa 100%);
    }
    a { font-family: inherit; color: inherit; }
    .topbar {
      flex: none;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: #fff;
      border-bottom: 1px solid #e6eaf0;
      position: relative;
      z-index: 2;
    }
    .brand { display: flex; align-items: center; line-height: 0; }
    .logo { width: 24px; height: 24px; object-fit: contain; display: block; }
    .subject { font-size: 16px; font-weight: 650; color: #24364c; }
    .hint { font-size: 12px; color: var(--muted); }
    .back {
      margin-left: auto;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
      color: #3d4e64;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    html.is-embed .topbar { display: none; }
    html.is-embed body { height: 100%; }
    .bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
    .blob.b1 { width: 620px; height: 620px; left: -8%; top: -14%; background: radial-gradient(circle, #ffffff 0%, rgba(214, 228, 255, 0.7) 55%, rgba(214, 228, 255, 0) 72%); animation: drift1 26s ease-in-out infinite alternate; }
    .blob.b2 { width: 560px; height: 560px; right: -6%; top: 6%; background: radial-gradient(circle, rgba(226, 214, 255, 0.9) 0%, rgba(226, 214, 255, 0) 70%); animation: drift2 31s ease-in-out infinite alternate; }
    .blob.b3 { width: 760px; height: 520px; right: 12%; bottom: -16%; background: radial-gradient(circle, rgba(198, 220, 255, 0.85) 0%, rgba(198, 220, 255, 0) 70%); animation: drift3 35s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate3d(60px, 40px, 0) scale(1.08); } }
    @keyframes drift2 { to { transform: translate3d(-50px, 60px, 0) scale(1.12); } }
    @keyframes drift3 { to { transform: translate3d(-70px, -40px, 0) scale(1.06); } }
    .dots {
      position: absolute;
      inset: 0;
      opacity: 0.5;
      background-image: radial-gradient(circle, rgba(112, 133, 190, 0.22) 1px, transparent 1px);
      background-size: 28px 28px;
      -webkit-mask-image: radial-gradient(1100px 700px at 52% 74%, #000 0%, rgba(0, 0, 0, 0.35) 55%, transparent 78%);
      mask-image: radial-gradient(1100px 700px at 52% 74%, #000 0%, rgba(0, 0, 0, 0.35) 55%, transparent 78%);
    }
    .vignette { position: absolute; inset: 0; background: radial-gradient(130% 100% at 50% 40%, rgba(255, 255, 255, 0) 52%, rgba(180, 196, 232, 0.22) 100%); }
    .stage { position: relative; flex: 1; min-height: 0; z-index: 1; }
    .stage canvas { display: block; }
    .legend {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 6px 16px rgba(22, 62, 112, 0.08);
      color: #5e7088;
      font-size: 12px;
      line-height: 1;
    }
    .legend i { display: inline-block; width: 22px; height: 3px; margin-right: 6px; border-radius: 3px; vertical-align: middle; }
    .legend .dot { width: 8px; height: 8px; border-radius: 50%; }
    .legend .owner { background: #6d8cff; }
    .legend .agency { background: #a07cff; }
    .legend .project { background: #46b9ec; }
    .legend .bidders { background: #8f9ede; }
    .legend .experts { background: #5eb8c9; }
    .legend .n { background: rgba(120, 155, 215, 0.7); }
    .legend .w.high { background: #ef4d4f; }
    .legend .w.mid { background: #e5922a; }
    .legend .w.low { background: #2f9e6b; }
  </style>
  <script>if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("is-embed");</script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="cockpit.html" title="返回首页"><img class="logo" src="logo.png" alt="工程交易" /></a>
    <div class="subject">分层探索</div>
    <div class="hint">拖动可转动视角</div>
    <a class="back" id="backInsight" href="insight.html">返回概览视图</a>
  </header>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="dots"></span>
    <span class="vignette"></span>
  </div>
  <div class="stage" id="stage">
    <div class="legend" aria-label="图例">
      <span><i class="dot owner"></i>招标人</span>
      <span><i class="dot agency"></i>招标代理</span>
      <span><i class="dot project"></i>项目</span>
      <span><i class="dot bidders"></i>投标人</span>
      <span><i class="dot experts"></i>专家</span>
      <span><i class="n"></i>对应关系</span>
      <span><i class="w high"></i>高风险</span>
      <span><i class="w mid"></i>中风险</span>
      <span><i class="w low"></i>低风险</span>
    </div>
  </div>
  <script src="mock-data.js?v=132"></script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const params = new URLSearchParams(location.search);
    const gz = window.GUIZHOU;
    const story = (gz && gz.story) || {};
    function pickProject(test, subjectId) {
      const graphs = (gz && gz.graphs) || {};
      const names = Object.keys(graphs).filter((name) => test(graphs[name]));
      names.sort((a, b) => {
        const score = (name) => {
          const item = graphs[name];
          const alerts = item.alerts || [];
          const cited = subjectId ? alerts.filter((alert) => (alert.subjects || []).indexOf(subjectId) >= 0).length : 0;
          const row = ((gz && gz.indexProjects) || []).find((entry) => entry.name === name);
          const rank = row && row.level === "高风险" ? 2 : row && row.level === "中风险" ? 1 : 0;
          return cited * 100 + alerts.length * 10 + rank;
        };
        return score(b) - score(a);
      });
      return names[0] || "";
    }
    let projectName = params.get("name") || "";
    let graph = (gz && gz.graphs && projectName && gz.graphs[projectName]) || null;
    const askedAgency = params.get("agency") || "";
    const askedOwner = params.get("bidder") || "";
    const askedNode = params.get("node") || "";
    if (askedAgency && (!graph || graph.agency !== askedAgency)) {
      const found = pickProject((item) => item.agency === askedAgency, "agency");
      if (found) {
        projectName = found;
        graph = gz.graphs[found];
      }
    }
    if ((askedNode === "owner" || params.get("role") === "招标人") && askedOwner && (!graph || graph.owner !== askedOwner)) {
      const found = pickProject((item) => item.owner === askedOwner, "owner");
      if (found) {
        projectName = found;
        graph = gz.graphs[found];
      }
    }
    if (!projectName) projectName = story.project || "观山湖区第八小学扩建工程";
    if (!graph) graph = (gz && gz.graphs && gz.graphs[projectName]) || null;
    const ownerName = (graph && graph.owner) || askedOwner || story.owner || "贵阳市观山湖区教育局";
    const agencyName = (graph && graph.agency) || askedAgency || story.agency || "贵州恒信招标代理有限公司";
    document.getElementById("backInsight").href = "insight.html" + location.search;

    function toneName(level) {
      const text = String(level || "");
      if (text.indexOf("低") === 0) return "low";
      if (text.indexOf("中") === 0) return "mid";
      if (text.indexOf("高") === 0) return "high";
      return "";
    }
    function toneRank(tone) { return tone === "high" ? 3 : tone === "mid" ? 2 : tone === "low" ? 1 : 0; }
    function strongerTone(a, b) { return toneRank(a) >= toneRank(b) ? a : b; }
    const TONE_NUM = { high: 0xef4d4f, mid: 0xe5922a, low: 0x2f9e6b };
    const TONE_INK = { high: "#c43745", mid: "#e5922a", low: "#2f9e6b" };
    const TONE_SOFT = { high: "#fff1f2", mid: "#fff6eb", low: "#eef8f3" };
    const TONE_EDGE = { high: "#f3b4b8", mid: "#f3d3a4", low: "#b7e0cc" };
    const rowLevel = {};
    function rememberLevel(key, level) {
      const tone = toneName(level);
      if (!key || !tone) return;
      rowLevel[key] = strongerTone(rowLevel[key] || "", tone);
    }
    ((gz && gz.rows) || []).forEach((row) => {
      rememberLevel(row.code, row.level);
      rememberLevel(row.name, row.level);
    });
    ((gz && gz.companies) || []).forEach((row) => rememberLevel(row.name, row.level));
    const alertTone = {};
    ((graph && graph.alerts) || []).forEach((item) => { alertTone[item.id] = toneName(item.level) || "high"; });
    function toneOfAlerts(ids) {
      let tone = "";
      (ids || []).forEach((id) => { tone = strongerTone(tone, alertTone[id] || ""); });
      return tone;
    }
    const quietPark = projectName === "遵义汇川区某物流园场平工程" && (params.get("from") === "agency" || params.get("role") === "招标代理");
    function toneOfNode(id, name, full) {
      if (quietPark && (id === "project" || name === projectName)) return "";
      let cited = "";
      ((graph && graph.alerts) || []).forEach((item) => {
        if ((item.subjects || []).indexOf(id) >= 0) cited = strongerTone(cited, toneName(item.level));
      });
      if (cited) return cited;
      return rowLevel[id] || rowLevel[full] || rowLevel[name] || (id === "project" && graph ? (rowLevel[graph.id] || rowLevel[projectName] || "") : "");
    }
    function withTone(item) {
      const tone = toneOfNode(item.id, item.name, item.full) || (item.warn ? "high" : "");
      return Object.assign({}, item, { warn: !!tone, tone: tone });
    }
    const quietEntry = projectName === "遵义汇川区某物流园场平工程" && (params.get("from") === "agency" || params.get("role") === "招标代理");
    const bidderItems = quietEntry || !graph ? [] : graph.bidders.slice();
    const expertItems = quietEntry || !graph ? [] : graph.experts.slice();
    const upper = { w: 260, h: 84 };
    const crowd = Math.max(bidderItems.length, expertItems.length, 1);
    const unit = { w: crowd >= 6 ? 96 : crowd >= 5 ? 104 : 136, h: 64 };
    const bidderGap = crowd >= 5 ? 12 : 14;
    function rowStart(count) {
      const span = count * unit.w + Math.max(0, count - 1) * bidderGap;
      return -span / 2 + unit.w / 2;
    }
    const bidderY = expertItems.length ? -300 : -190;
    const expertY = -190;
    const agencyView = params.get("from") === "agency" || params.get("role") === "招标代理";
    const portfolio = [];
    if (agencyView && agencyName && gz && gz.graphs) {
      Object.keys(gz.graphs).forEach((title) => {
        const item = gz.graphs[title];
        if ((item.agency || "") !== agencyName) return;
        portfolio.push({ title: title, sheet: item.id || title, item: item });
      });
    }
    const keepIds = new Set();
    let viewScale = 1;
    let floorRadius = 460;
    const layers = [];
    let owners = [{ name: ownerName, id: "owner" }];
    if (portfolio.length > 1) {
      owners = [];
      portfolio.forEach((entry) => {
        const name = entry.item.owner || "";
        if (!name || name === "贵州宏图城市建设投资有限公司" || owners.some((row) => row.name === name)) return;
        owners.push({ name: name, id: name === ownerName ? "owner" : "xo-" + owners.length });
      });
      if (!owners.length) owners = [{ name: ownerName, id: "owner" }];
      const ownerGap = 28;
      const ownerW = owners.length > 1 ? 220 : upper.w;
      const ownerSpan = owners.length * ownerW + Math.max(0, owners.length - 1) * ownerGap;
      const ownerStart = -ownerSpan / 2 + ownerW / 2;
      owners.forEach((entry, index) => {
        keepIds.add(entry.id);
        layers.push({
          id: "own-" + entry.id,
          title: "招标人",
          color: "#6d8cff",
          y: 168,
          x: owners.length > 1 ? ownerStart + index * (ownerW + ownerGap) : 0,
          w: ownerW,
          h: upper.h,
          items: [withTone({ id: entry.id, name: entry.name })]
        });
      });
    } else {
      layers.push({ id: "owner", title: "招标人", color: "#6d8cff", y: 150, x: 0, w: upper.w, h: upper.h, items: [withTone({ id: "owner", name: ownerName })] });
    }
    if (agencyName) {
      if (portfolio.length > 1) keepIds.add("agency");
      layers.push({ id: "agency", title: "招标代理", color: "#a07cff", y: 40, x: 0, w: upper.w, h: upper.h, items: [withTone({ id: "agency", name: agencyName })] });
    }
    if (portfolio.length > 1) {
      const count = portfolio.length;
      const gap = 12;
      const cardW = Math.max(124, Math.min(168, Math.floor((1020 - (count - 1) * gap) / count)));
      const cardH = 96;
      const span = count * cardW + (count - 1) * gap;
      const start = -span / 2 + cardW / 2;
      const current = portfolio.find((entry) => entry.title === projectName) || portfolio[0];
      const rest = portfolio.filter((entry) => entry !== current);
      const slots = new Array(count);
      let left = Math.floor((count - 1) / 2);
      let right = left + 1;
      slots[left] = current;
      left -= 1;
      rest.forEach((entry, index) => {
        if (index % 2 === 0 && right < count) slots[right++] = entry;
        else if (left >= 0) slots[left--] = entry;
        else slots[right++] = entry;
      });
      slots.forEach((entry, index) => {
        const nodeId = entry.title === projectName ? "project" : "xp-" + entry.sheet;
        keepIds.add(nodeId);
        layers.push({
          id: "prj-" + nodeId,
          title: "项目",
          color: "#46b9ec",
          y: -78,
          x: start + index * (cardW + gap),
          w: cardW,
          h: cardH,
          items: [withTone({ id: nodeId, name: entry.title, full: entry.sheet })]
        });
      });
      viewScale = Math.max(1, span / 760);
      floorRadius = Math.max(460, span / 2 + 80);
    } else {
      layers.push({ id: "project", title: "项目", color: "#46b9ec", y: -70, x: 0, w: upper.w, h: upper.h, items: [withTone({ id: "project", name: projectName })] });
    }
    bidderItems.forEach((item, index) => {
      layers.push({
        id: "bid-" + item.id,
        title: "投标人",
        color: "#8f9ede",
        y: bidderY,
        x: rowStart(bidderItems.length) + index * (unit.w + bidderGap),
        w: unit.w,
        h: unit.h,
        items: [withTone(item)]
      });
    });
    expertItems.forEach((item, index) => {
      layers.push({
        id: "exp-" + item.id,
        title: "专家",
        color: "#5eb8c9",
        y: expertY,
        x: rowStart(expertItems.length) + index * (unit.w + bidderGap),
        w: unit.w,
        h: unit.h,
        items: [withTone(item)]
      });
    });
    const links = ((graph && graph.links) ? graph.links.slice() : [
      { a: "owner", b: agencyName ? "agency" : "project" }
    ].concat(agencyName ? [{ a: "agency", b: "project" }] : []));
    if (portfolio.length > 1) {
      portfolio.forEach((entry) => {
        const nodeId = entry.title === projectName ? "project" : "xp-" + entry.sheet;
        if (nodeId !== "project") links.push({ a: "agency", b: nodeId, keep: true });
      });
      owners.forEach((entry) => {
        if (entry.id !== "owner") links.push({ a: entry.id, b: agencyName ? "agency" : "project", keep: true });
      });
    }

    const stage = document.getElementById("stage");
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(38, 1, 1, 5000);
    camera.position.set(60, 920 * viewScale, 1040 * viewScale);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(40, -40, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 900;
    controls.maxDistance = 2800;
    camera.lookAt(controls.target);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.25);
    sun.position.set(120, 520, 280);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xd6e4ff, 0.45);
    fill.position.set(-200, 180, -80);
    scene.add(fill);

    const anchors = new Map();

    function round(g, x, y, w, h, r) {
      g.beginPath();
      g.roundRect(x, y, w, h, r);
    }

    function roundedShape(w, h, r) {
      const shape = new THREE.Shape();
      const x = -w / 2;
      const y = -h / 2;
      const radius = Math.min(r, w / 2 - 0.5, h / 2 - 0.5);
      shape.moveTo(x + radius, y);
      shape.lineTo(x + w - radius, y);
      shape.absarc(x + w - radius, y + radius, radius, -Math.PI / 2, 0, false);
      shape.lineTo(x + w, y + h - radius);
      shape.absarc(x + w - radius, y + h - radius, radius, 0, Math.PI / 2, false);
      shape.lineTo(x + radius, y + h);
      shape.absarc(x + radius, y + h - radius, radius, Math.PI / 2, Math.PI, false);
      shape.lineTo(x, y + radius);
      shape.absarc(x + radius, y + radius, radius, Math.PI, Math.PI * 1.5, false);
      return shape;
    }

    function canvas2d(layer) {
      const scale = 2;
      const canvas = document.createElement("canvas");
      canvas.width = layer.w * scale;
      canvas.height = layer.h * scale;
      const g = canvas.getContext("2d");
      g.scale(scale, scale);
      g.textAlign = "center";
      g.textBaseline = "middle";
      return { canvas, g };
    }

    function textureOf(canvas) {
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function paintGlass(layer) {
      const { canvas, g } = canvas2d(layer);
      const grad = g.createLinearGradient(0, 0, layer.w, layer.h);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.5, mix(layer.color, "#ffffff", 0.28));
      grad.addColorStop(1, mix(layer.color, "#ffffff", 0.55));
      round(g, 1, 1, layer.w - 2, layer.h - 2, Math.min(14, layer.h * 0.2));
      g.fillStyle = grad;
      g.fill();
      g.lineWidth = 4;
      g.strokeStyle = layer.color;
      g.globalAlpha = 0.7;
      g.stroke();
      g.globalAlpha = 1;
      return textureOf(canvas);
    }

    function paintWinBadge(g, x, y) {
      const w = 36;
      const h = 16;
      g.save();
      g.beginPath();
      g.roundRect(x, y, w, h, h / 2);
      g.fillStyle = "#111111";
      g.fill();
      g.fillStyle = "#ffffff";
      g.font = "700 11px PingFang SC, Microsoft YaHei, sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText("中标", x + w / 2, y + h / 2 + 0.5);
      g.restore();
    }
    function paintLabels(layer, placed, involved) {
      const { canvas, g } = canvas2d(layer);
      g.clearRect(0, 0, layer.w, layer.h);
      const partial = involved && placed.some((item) => item.box);
      g.globalAlpha = 1;
      g.fillStyle = "#16324f";
      g.font = "650 12px PingFang SC, Microsoft YaHei, sans-serif";
      const winner = placed.length === 1 && placed[0].win;
      if (winner) {
        g.textAlign = "left";
        g.fillText(layer.title, 10, layer.h < 100 ? 16 : 22);
        g.textAlign = "center";
        paintWinBadge(g, layer.w - 42, 5);
      } else {
        g.fillText(layer.title, layer.w / 2, layer.h < 100 ? 16 : 22);
      }
      if (placed.length === 1 && !placed[0].box) {
        const size = layer.w < 180 ? 13 : layer.h < 100 ? 15 : 18;
        g.font = "650 " + size + "px PingFang SC, Microsoft YaHei, sans-serif";
        g.fillStyle = placed[0].tone ? TONE_INK[placed[0].tone] : "#16324f";
        const maxW = layer.w - 16;
        if (g.measureText(placed[0].name).width > maxW) {
          const lines = [];
          let line = "";
          [...placed[0].name].forEach((ch) => {
            if (g.measureText(line + ch).width > maxW && line) {
              lines.push(line);
              line = ch;
            } else line += ch;
          });
          if (line) lines.push(line);
          const shown = lines.slice(0, 3);
          if (lines.length > 3) {
            let cut = shown[2];
            while (cut && g.measureText(cut + "…").width > maxW) cut = cut.slice(0, -1);
            shown[2] = cut + "…";
          }
          const lineH = size + 3;
          const start = layer.h * 0.46;
          shown.forEach((row, index) => g.fillText(row, layer.w / 2, start + index * lineH));
        } else {
          g.fillText(placed[0].name, layer.w / 2, layer.h * 0.62);
        }
      } else {
        placed.forEach((item) => {
          const on = !involved || involved.has(item.id);
          const faded = partial && !on;
          g.globalAlpha = faded ? 0.2 : 1;
          round(g, item.left, item.top, item.w, item.h, 6);
          g.fillStyle = faded ? "#e4e7ed" : item.tone ? TONE_SOFT[item.tone] : "#ffffff";
          g.fill();
          g.lineWidth = partial && on ? 2 : 1;
          g.strokeStyle = faded ? "#c5cad3" : item.tone ? (partial && on ? TONE_INK[item.tone] : TONE_EDGE[item.tone]) : "#d5deea";
          g.stroke();
          g.fillStyle = faded ? "#8b93a0" : item.tone ? TONE_INK[item.tone] : "#16324f";
          g.font = "11px PingFang SC, Microsoft YaHei, sans-serif";
          g.fillText(item.name, item.left + item.w / 2, item.top + item.h / 2);
          g.globalAlpha = 1;
        });
      }
      return textureOf(canvas);
    }

    function mix(hex, other, t) {
      const a = new THREE.Color(hex);
      const b = new THREE.Color(other);
      return "#" + a.lerp(b, t).getHexString();
    }

    function placeItems(layer) {
      if (layer.items.length === 1) {
        return [{ ...layer.items[0], left: layer.w / 2 - 6, top: layer.h * 0.7, w: 12, h: 12, box: false }];
      }
      const cols = layer.cols || layer.items.length;
      const chipH = layer.chipH || 26;
      const gapX = 5;
      const gapY = 5;
      const chipW = layer.chipW || 64;
      const total = cols * chipW + (cols - 1) * gapX;
      const start = (layer.w - total) / 2;
      return layer.items.map((item, index) => ({
        ...item,
        left: start + (index % cols) * (chipW + gapX),
        top: 40 + Math.floor(index / cols) * (chipH + gapY),
        w: chipW,
        h: chipH,
        box: true
      }));
    }

    const layerViews = [];
    layers.forEach((layer) => {
      const placed = placeItems(layer);
      const group = new THREE.Group();
      group.position.set(layer.x, layer.y, 0);
      group.rotation.x = -Math.PI / 2;
      group.userData.layerId = layer.id;
      group.userData.w = layer.w;
      group.userData.h = layer.h;
      group.userData.solo = layer.items.length === 1;
      group.userData.picks = placed.map((item) => ({
        id: item.id,
        name: item.name,
        box: !!item.box,
        x0: item.left - layer.w / 2,
        x1: item.left + item.w - layer.w / 2,
        y0: layer.h / 2 - (item.top + item.h),
        y1: layer.h / 2 - item.top
      }));
      scene.add(group);

      const glass = new THREE.Mesh(
        new THREE.PlaneGeometry(layer.w, layer.h),
        new THREE.MeshBasicMaterial({ map: paintGlass(layer), transparent: true, opacity: 0.5, depthWrite: false })
      );
      glass.position.z = 0.6;
      group.add(glass);

      const labels = new THREE.Mesh(
        new THREE.PlaneGeometry(layer.w, layer.h),
        new THREE.MeshBasicMaterial({ map: paintLabels(layer, placed), transparent: true, opacity: 1, depthWrite: false })
      );
      labels.position.z = 2.2;
      labels.renderOrder = 1;
      group.add(labels);

      const depth = layer.h > 110 ? 8 : 4;
      const radius = Math.min(14, layer.h * 0.2);
      const slab = new THREE.Mesh(
        new THREE.ExtrudeGeometry(roundedShape(layer.w, layer.h, radius), { depth, bevelEnabled: false, curveSegments: 10 }),
        new THREE.MeshStandardMaterial({ color: layer.color, roughness: 0.35, metalness: 0.04, transparent: true, opacity: 0.55, depthWrite: false, emissive: layer.color, emissiveIntensity: 0.18, side: THREE.DoubleSide })
      );
      slab.position.z = -depth - 1;
      group.add(slab);

      placed.forEach((item) => {
        const marker = new THREE.Object3D();
        const localX = item.left + item.w / 2 - layer.w / 2;
        const anchorTop = item.box ? item.top - 6 : item.top + item.h / 2;
        const localY = layer.h / 2 - anchorTop;
        marker.position.set(localX, localY, 0);
        group.add(marker);
        anchors.set(item.id, marker);
      });
      layerViews.push({ layer, placed, itemIds: placed.map((item) => item.id), glass, labels, slab });
    });

    function shadowTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const g = canvas.getContext("2d");
      const shade = g.createRadialGradient(256, 256, 20, 256, 256, 256);
      shade.addColorStop(0, "rgba(126, 148, 184, 0.42)");
      shade.addColorStop(0.38, "rgba(148, 166, 196, 0.22)");
      shade.addColorStop(0.68, "rgba(168, 182, 206, 0.08)");
      shade.addColorStop(1, "rgba(168, 182, 206, 0)");
      g.fillStyle = shade;
      g.fillRect(0, 0, 512, 512);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(floorRadius, 64),
      new THREE.MeshBasicMaterial({ map: shadowTexture(), transparent: true, opacity: 1, depthWrite: false })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -250;
    scene.add(floor);

    function locateScore(item) {
      const focus = params.get("focus") || "";
      const id = params.get("node") || "";
      const shared = { owner: 1, agency: 1, project: 1, r1: 1, r2: 1, n1: 1, n2: 1 };
      if (id && item.id === id) return 1000;
      if (focus && (item.name === focus || focus.indexOf(item.name) >= 0 || item.name.indexOf(focus) >= 0)) return item.name.length;
      return 0;
    }
    let located = null;
    let locatedScore = 0;
    scene.traverse((obj) => {
      const picks = obj.userData && obj.userData.picks;
      if (!picks) return;
      picks.forEach((item) => {
        const score = locateScore(item);
        if (score > locatedScore) {
          locatedScore = score;
          located = { group: obj, item: item };
        }
      });
    });
    if (located) {
      const item = located.item;
      const span = Math.max(item.x1 - item.x0, item.y1 - item.y0);
      const radius = item.box ? span * 0.72 : Math.min(located.group.userData.w, located.group.userData.h) * 0.36;
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(Math.max(radius * 0.86, 8), radius, 40),
        new THREE.MeshBasicMaterial({ color: 0x1f6feb, side: THREE.DoubleSide, depthTest: false })
      );
      ring.position.set(item.box ? (item.x0 + item.x1) / 2 : 0, item.box ? (item.y0 + item.y1) / 2 : 0, 5);
      ring.renderOrder = 4;
      located.group.add(ring);
    }

    function worldOf(id) {
      const point = new THREE.Vector3();
      anchors.get(id).getWorldPosition(point);
      point.y += 3;
      return point;
    }

    function dashTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 8;
      canvas.height = 64;
      const g = canvas.getContext("2d");
      g.clearRect(0, 0, 8, 64);
      g.fillStyle = "#ffffff";
      g.fillRect(0, 0, 8, 28);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1, 10);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const dashMap = dashTexture();
    const flows = [];
    const plains = [];
    const marks = [];
    let selectedAlert = null;
    let selectedSubject = null;
    function alertIdsOf(link) {
      if (link.alertIds && link.alertIds.length) return link.alertIds;
      return link.alertId ? [link.alertId] : [];
    }
    links.forEach((link) => {
      if (!anchors.has(link.a) || !anchors.has(link.b)) return;
      const a = worldOf(link.a);
      const b = worldOf(link.b);
      const alertIds = alertIdsOf(link);
      const c1 = a.clone().lerp(b, 0.33);
      const c2 = a.clone().lerp(b, 0.67);
      const dx = b.x - a.x;
      const sign = dx === 0 ? 1 : Math.sign(dx);
      const bow = link.skip ? 120 : Math.min(64, Math.abs(dx) * 0.42 + 18);
      c1.x += sign * bow * 0.45;
      c2.x += sign * bow * 0.7;
      c1.z += 26;
      c2.z += 26;
      const curve = new THREE.CubicBezierCurve3(a, c1, c2, b);
      const tone = link.warn ? (toneOfAlerts(alertIds) || "high") : "";
      const color = tone ? TONE_NUM[tone] : 0x789bd7;
      if (link.warn && alertIds.length) {
        const glowTube = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 32, 3.75, 8, false),
          new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.22, depthWrite: false })
        );
        glowTube.renderOrder = 2;
        scene.add(glowTube);
        const tube = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 64, 1.2, 8, false),
          new THREE.MeshBasicMaterial({ map: dashMap, color: color, transparent: true, opacity: 1, depthWrite: false })
        );
        tube.renderOrder = 3;
        scene.add(tube);
        const pick = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 24, 8, 6, false),
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
        );
        pick.userData.alertId = alertIds[0];
        scene.add(pick);
        const traveler = new THREE.Mesh(
          new THREE.SphereGeometry(6, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0xfff6f7, depthTest: false })
        );
        const halo = new THREE.Mesh(
          new THREE.SphereGeometry(8, 12, 12),
          new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.55, depthWrite: false, depthTest: false })
        );
        traveler.renderOrder = 6;
        halo.renderOrder = 5;
        scene.add(halo);
        scene.add(traveler);
        flows.push({ alertId: alertIds[0], alertIds, curve, tube, glowTube, traveler, halo, offset: Math.random(), tone: tone });
      } else {
        const tube = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 48, 0.7, 6, false),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45 })
        );
        const kept = !!(link.keep || (keepIds.has(link.a) && keepIds.has(link.b)));
        tube.userData.keep = kept;
        tube.renderOrder = 2;
        scene.add(tube);
        plains.push(tube);
      }
      [a, b].forEach((point) => {
        const dot = new THREE.Mesh(
          new THREE.CircleGeometry(link.warn ? 2.1 : 3, 16),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: link.warn ? 1 : 0.7 })
        );
        dot.rotation.x = -Math.PI / 2;
        dot.position.copy(point);
        dot.renderOrder = 4;
        scene.add(dot);
        marks.push({ mesh: dot, alertId: alertIds[0] || "", alertIds, base: link.warn ? 1 : 0.7, color: color, tone: tone, keep: !!(link.keep || (keepIds.has(link.a) && keepIds.has(link.b))) });
      });
    });

    function alertsForSubject(id) {
      const ids = new Set();
      if (!id) return ids;
      links.forEach((link) => {
        alertIdsOf(link).forEach((alertId) => {
          if (link.a === id || link.b === id) ids.add(alertId);
        });
      });
      return ids;
    }

    function activeAlerts() {
      if (selectedAlert) return new Set([selectedAlert]);
      if (selectedSubject) return alertsForSubject(selectedSubject);
      return null;
    }

    function involvedIds() {
      const ids = new Set();
      const alerts = activeAlerts();
      if (!alerts) return ids;
      links.forEach((link) => {
        if (!alertIdsOf(link).some((alertId) => alerts.has(alertId))) return;
        ids.add(link.a);
        ids.add(link.b);
      });
      if (selectedSubject) ids.add(selectedSubject);
      return ids;
    }

    function applyLineEmphasis() {
      const alerts = activeAlerts();
      const focused = !!alerts;
      stage.dataset.alert = selectedAlert || "";
      stage.dataset.subject = selectedSubject || "";
      const involved = involvedIds();
      const gray = new THREE.Color("#9aa3af");
      const keepOn = focused && keepIds.has(selectedSubject);
      layerViews.forEach((view) => {
        const hit = !focused || view.itemIds.some((id) => involved.has(id) || (keepOn && keepIds.has(id)));
        if (!focused) {
          view.glass.material.color.set("#ffffff");
          view.glass.material.opacity = 0.5;
          view.labels.material.color.set("#ffffff");
          view.labels.material.opacity = 1;
          view.slab.material.color.set(view.layer.color);
          view.slab.material.emissive.set(view.layer.color);
          view.slab.material.emissiveIntensity = 0.18;
          view.slab.material.opacity = 0.55;
        } else if (hit) {
          view.glass.material.color.set("#ffffff");
          view.glass.material.opacity = 1;
          view.labels.material.color.set("#ffffff");
          view.labels.material.opacity = 1;
          view.slab.material.color.set(view.layer.color);
          view.slab.material.emissive.set(view.layer.color);
          view.slab.material.emissiveIntensity = 0.38;
          view.slab.material.opacity = 0.9;
        } else {
          view.glass.material.color.copy(gray);
          view.glass.material.opacity = 0.2;
          view.labels.material.color.copy(gray);
          view.labels.material.opacity = 0.2;
          view.slab.material.color.copy(gray);
          view.slab.material.emissive.set("#8e96a3");
          view.slab.material.emissiveIntensity = 0.02;
          view.slab.material.opacity = 0.2;
        }
        if (view.placed.some((item) => item.box)) {
          const next = paintLabels(view.layer, view.placed, focused ? involved : null);
          view.labels.material.map.dispose();
          view.labels.material.map = next;
          view.labels.material.needsUpdate = true;
        }
      });
      function shownTone(alertIds, fallback) {
        if (!focused) return fallback;
        let tone = "";
        (alertIds || []).forEach((id) => {
          if (alerts.has(id)) tone = strongerTone(tone, alertTone[id] || "");
        });
        return tone || fallback;
      }
      flows.forEach((flow) => {
        const on = !focused || (flow.alertIds || [flow.alertId]).some((alertId) => alerts.has(alertId));
        const hex = TONE_NUM[shownTone(flow.alertIds, flow.tone)] || 0xef4d4f;
        flow.tube.material.color.set(on ? hex : gray);
        flow.tube.material.opacity = on ? 1 : 0.2;
        flow.glowTube.material.color.set(on ? hex : gray);
        flow.glowTube.material.opacity = on ? 0.28 : 0.05;
        flow.halo.material.color.set(on ? hex : gray);
        flow.traveler.visible = on;
        flow.halo.visible = on;
      });
      plains.forEach((tube) => {
        const stay = !focused || (keepOn && tube.userData.keep);
        tube.material.color.set(stay ? 0x789bd7 : gray);
        tube.material.opacity = stay ? 0.45 : 0.2;
      });
      marks.forEach((mark) => {
        const on = !focused || (mark.alertIds || [mark.alertId]).some((alertId) => alerts.has(alertId)) || (keepOn && mark.keep);
        const hex = mark.tone ? (TONE_NUM[shownTone(mark.alertIds, mark.tone)] || mark.color) : mark.color;
        mark.mesh.material.color.set(on ? hex : gray);
        mark.mesh.material.opacity = on ? mark.base : 0.2;
      });
      floor.material.color.set(focused ? gray : 0xffffff);
      floor.material.opacity = focused ? 0.35 : 1;
    }

    function subjectLabel(id) {
      if (!id) return "";
      for (let i = 0; i < layers.length; i += 1) {
        const hit = (layers[i].items || []).find((item) => item.id === id);
        if (hit) return hit.name || "";
      }
      return "";
    }
    function postFocus() {
      if (window.parent === window) return;
      window.parent.postMessage({ type: "select-alert", id: selectedAlert, subject: selectedSubject, name: subjectLabel(selectedSubject) }, location.origin);
    }

    function chooseSubject(id) {
      carriedAlert = selectedAlert;
      selectedSubject = selectedSubject === id ? null : id;
      selectedAlert = null;
      applyLineEmphasis();
      postFocus();
    }

    function chooseAlert(id) {
      selectedAlert = selectedAlert === id ? null : id;
      if (selectedSubject) {
        const mine = alertsForSubject(selectedSubject);
        if (!selectedAlert || !mine.has(selectedAlert)) selectedSubject = null;
      }
      applyLineEmphasis();
      postFocus();
    }

    function clearFocus() {
      if (!selectedAlert && !selectedSubject) return;
      selectedAlert = null;
      selectedSubject = null;
      applyLineEmphasis();
      postFocus();
    }

    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin) return;
      if (!event.data) return;
      if (event.data.type === "select-alert") {
        selectedAlert = event.data.id || null;
        if ("subject" in event.data) selectedSubject = event.data.subject || null;
        applyLineEmphasis();
      } else if (event.data.type === "select-subject") {
        selectedSubject = event.data.id || null;
        selectedAlert = null;
        applyLineEmphasis();
      }
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let press = null;
    function pickAt(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(scene.children, true);
      for (const hit of hits) {
        let node = hit.object;
        while (node) {
          if (node.userData && node.userData.alertId) return { alertId: node.userData.alertId, line: true };
          if (node.userData && node.userData.layerId) {
            const picks = node.userData.picks || [];
            if (node.userData.solo) return picks[0] || null;
            if (hit.object.geometry && hit.object.geometry.type === "PlaneGeometry" && hit.uv && picks.length) {
              const x = (hit.uv.x - 0.5) * node.userData.w;
              const y = (hit.uv.y - 0.5) * node.userData.h;
              const inside = picks.find((item) => x >= item.x0 && x <= item.x1 && y >= item.y0 && y <= item.y1);
              if (inside) return inside;
              return picks.slice().sort((a, b) => {
                const da = Math.hypot(x - (a.x0 + a.x1) / 2, y - (a.y0 + a.y1) / 2);
                const db = Math.hypot(x - (b.x0 + b.x1) / 2, y - (b.y0 + b.y1) / 2);
                return da - db;
              })[0];
            }
            return picks[0] || null;
          }
          node = node.parent;
        }
      }
      return null;
    }
    let carriedAlert = null;
    function openDetail(pick) {
      const next = new URLSearchParams(params);
      next.delete("embed");
      next.delete("view");
      const nodeId = (pick && pick.id) || selectedSubject || "";
      if (projectName) next.set("name", projectName);
      if (nodeId) next.set("node", nodeId);
      if (pick && pick.name) next.set("focus", pick.name);
      const alertId = selectedAlert || carriedAlert || "";
      if (alertId) next.set("alert", alertId);
      const href = "analysis.html?" + next.toString();
      if (window.parent !== window) window.parent.location.href = href;
      else location.href = href;
    }
    let arm = null;
    renderer.domElement.addEventListener("pointerdown", (event) => {
      press = { x: event.clientX, y: event.clientY };
    });
    renderer.domElement.addEventListener("pointerup", (event) => {
      if (!press || Math.hypot(event.clientX - press.x, event.clientY - press.y) > 6) {
        if (arm) clearTimeout(arm.timer);
        arm = null;
        return;
      }
      const pick = pickAt(event);
      if (!pick) {
        clearFocus();
        return;
      }
      if (pick.line) {
        chooseAlert(pick.alertId);
        return;
      }
      if (arm && arm.id === pick.id && Date.now() - arm.at < 320) {
        clearTimeout(arm.timer);
        arm = null;
        openDetail(pick);
        return;
      }
      if (arm) clearTimeout(arm.timer);
      chooseSubject(pick.id);
      arm = {
        id: pick.id,
        at: Date.now(),
        timer: setTimeout(() => { arm = null; }, 320)
      };
    });
    renderer.domElement.addEventListener("pointermove", (event) => {
      renderer.domElement.style.cursor = pickAt(event) ? "pointer" : "";
    });

    function resize() {
      const width = stage.clientWidth;
      const height = stage.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    resize();
    window.addEventListener("resize", resize);

    function frame() {
      dashMap.offset.y = -((performance.now() / 850) % 1);
      const travel = performance.now() / 2600;
      flows.forEach((flow) => {
        if (!flow.traveler.visible) return;
        const point = flow.curve.getPoint((travel + flow.offset) % 1);
        flow.traveler.position.copy(point);
        flow.halo.position.copy(point);
      });
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
