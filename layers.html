<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>分层探索</title>
  <style>
    :root { --ink: #16324f; --muted: #6d7f95; --risk: #ef4d4f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 760px at 10% -8%, #ffffff 0%, rgba(255, 255, 255, 0) 58%),
        radial-gradient(1000px 700px at 92% 4%, #e9e1ff 0%, rgba(233, 225, 255, 0) 60%),
        radial-gradient(1100px 900px at 74% 108%, #d9e6ff 0%, rgba(217, 230, 255, 0) 62%),
        linear-gradient(158deg, #f7f9fd 0%, #eaeffb 46%, #e5ecfa 100%);
    }
    a { font-family: inherit; color: inherit; }
    .topbar {
      flex: none;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: #fff;
      border-bottom: 1px solid #e6eaf0;
      position: relative;
      z-index: 2;
    }
    .brand { display: flex; align-items: center; line-height: 0; }
    .logo { width: 24px; height: 24px; object-fit: contain; display: block; }
    .subject { font-size: 16px; font-weight: 650; color: #24364c; }
    .hint { font-size: 12px; color: var(--muted); }
    .back {
      margin-left: auto;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
      color: #3d4e64;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    html.is-embed .topbar { display: none; }
    html.is-embed body { height: 100%; }
    .bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
    .blob.b1 { width: 620px; height: 620px; left: -8%; top: -14%; background: radial-gradient(circle, #ffffff 0%, rgba(214, 228, 255, 0.7) 55%, rgba(214, 228, 255, 0) 72%); animation: drift1 26s ease-in-out infinite alternate; }
    .blob.b2 { width: 560px; height: 560px; right: -6%; top: 6%; background: radial-gradient(circle, rgba(226, 214, 255, 0.9) 0%, rgba(226, 214, 255, 0) 70%); animation: drift2 31s ease-in-out infinite alternate; }
    .blob.b3 { width: 760px; height: 520px; right: 12%; bottom: -16%; background: radial-gradient(circle, rgba(198, 220, 255, 0.85) 0%, rgba(198, 220, 255, 0) 70%); animation: drift3 35s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate3d(60px, 40px, 0) scale(1.08); } }
    @keyframes drift2 { to { transform: translate3d(-50px, 60px, 0) scale(1.12); } }
    @keyframes drift3 { to { transform: translate3d(-70px, -40px, 0) scale(1.06); } }
    .dots {
      position: absolute;
      inset: 0;
      opacity: 0.5;
      background-image: radial-gradient(circle, rgba(112, 133, 190, 0.22) 1px, transparent 1px);
      background-size: 28px 28px;
      -webkit-mask-image: radial-gradient(1100px 700px at 52% 74%, #000 0%, rgba(0, 0, 0, 0.35) 55%, transparent 78%);
      mask-image: radial-gradient(1100px 700px at 52% 74%, #000 0%, rgba(0, 0, 0, 0.35) 55%, transparent 78%);
    }
    .vignette { position: absolute; inset: 0; background: radial-gradient(130% 100% at 50% 40%, rgba(255, 255, 255, 0) 52%, rgba(180, 196, 232, 0.22) 100%); }
    .stage { position: relative; flex: 1; min-height: 0; z-index: 1; }
    .stage canvas { display: block; }
    .ops-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .node-ops {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      overflow: visible;
      pointer-events: none;
    }
    .node-ops.is-hot { z-index: 3; }
    .ops-svg {
      position: absolute;
      left: -420px;
      top: -420px;
      width: 840px;
      height: 840px;
      overflow: visible;
      pointer-events: none;
    }
    .ops-lab {
      position: absolute;
      left: 0;
      top: 0;
      font-size: 11px;
      font-weight: 650;
      line-height: 1;
      white-space: nowrap;
      color: #2f78f6;
      text-shadow: 0 0 4px #e8eaee, 0 0 4px #e8eaee, 0 1px 1px #fff;
      transform: translate(-50%, -50%);
    }
    .node-ops.is-hot .ops-lab { font-size: 12px; }
    .legend {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 6px 16px rgba(22, 62, 112, 0.08);
      color: #5e7088;
      font-size: 12px;
      line-height: 1;
    }
    .legend i { display: inline-block; width: 22px; height: 3px; margin-right: 6px; border-radius: 3px; vertical-align: middle; }
    .legend .dot { width: 8px; height: 8px; border-radius: 50%; }
    .legend .owner { background: #6d8cff; }
    .legend .agency { background: #a07cff; }
    .legend .project { background: #46b9ec; }
    .legend .bidders { background: #8f9ede; }
    .legend .experts { background: #5eb8c9; }
    .legend .n { background: rgba(120, 155, 215, 0.7); }
    .legend .w.high { background: #ef4d4f; }
    .legend .w.mid { background: #e5922a; }
    .legend .w.low { background: #2f9e6b; }
  </style>
  <script>if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("is-embed");</script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="cockpit.html" title="返回首页"><img class="logo" src="logo.png" alt="工程交易" /></a>
    <div class="subject">分层探索</div>
    <div class="hint">拖动可转动视角</div>
    <a class="back" id="backInsight" href="insight.html">返回概览视图</a>
  </header>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="dots"></span>
    <span class="vignette"></span>
  </div>
  <div class="stage" id="stage">
    <div class="legend" aria-label="图例">
      <span><i class="dot owner"></i>招标人</span>
      <span><i class="dot agency"></i>招标代理</span>
      <span><i class="dot project"></i>项目</span>
      <span><i class="dot bidders"></i>投标人</span>
      <span><i class="dot experts"></i>专家</span>
      <span><i class="n"></i>对应关系</span>
      <span><i class="w high"></i>高风险</span>
      <span><i class="w mid"></i>中风险</span>
      <span><i class="w low"></i>低风险</span>
    </div>
  </div>
  <script src="mock-data.js?v=129"></script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const params = new URLSearchParams(location.search);
    const gz = window.GUIZHOU;
    const story = (gz && gz.story) || {};
    function pickProject(test, subjectId) {
      const graphs = (gz && gz.graphs) || {};
      const names = Object.keys(graphs).filter((name) => test(graphs[name]));
      names.sort((a, b) => {
        const score = (name) => {
          const item = graphs[name];
          const alerts = item.alerts || [];
          const cited = subjectId ? alerts.filter((alert) => (alert.subjects || []).indexOf(subjectId) >= 0).length : 0;
          const row = ((gz && gz.indexProjects) || []).find((entry) => entry.name === name);
          const rank = row && row.level === "高风险" ? 2 : row && row.level === "中风险" ? 1 : 0;
          return cited * 100 + alerts.length * 10 + rank;
        };
        return score(b) - score(a);
      });
      return names[0] || "";
    }
    let projectName = params.get("name") || "";
    let graph = (gz && gz.graphs && projectName && gz.graphs[projectName]) || null;
    const askedAgency = params.get("agency") || "";
    const askedOwner = params.get("bidder") || "";
    const askedNode = params.get("node") || "";
    if (askedAgency && (!graph || graph.agency !== askedAgency)) {
      const found = pickProject((item) => item.agency === askedAgency, "agency");
      if (found) {
        projectName = found;
        graph = gz.graphs[found];
      }
    }
    if ((askedNode === "owner" || params.get("role") === "招标人") && askedOwner && (!graph || graph.owner !== askedOwner)) {
      const found = pickProject((item) => item.owner === askedOwner, "owner");
      if (found) {
        projectName = found;
        graph = gz.graphs[found];
      }
    }
    if (!projectName) projectName = story.project || "观山湖区第八小学扩建工程";
    if (!graph) graph = (gz && gz.graphs && gz.graphs[projectName]) || null;
    const ownerName = (graph && graph.owner) || askedOwner || story.owner || "贵阳市观山湖区教育局";
    const agencyName = (graph && graph.agency) || askedAgency || story.agency || "贵州恒信招标代理有限公司";
    document.getElementById("backInsight").href = "insight.html" + location.search;

    function toneName(level) {
      const text = String(level || "");
      if (text.indexOf("低") === 0) return "low";
      if (text.indexOf("中") === 0) return "mid";
      if (text.indexOf("高") === 0) return "high";
      return "";
    }
    function toneRank(tone) { return tone === "high" ? 3 : tone === "mid" ? 2 : tone === "low" ? 1 : 0; }
    function strongerTone(a, b) { return toneRank(a) >= toneRank(b) ? a : b; }
    const TONE_NUM = { high: 0xef4d4f, mid: 0xe5922a, low: 0x2f9e6b };
    const TONE_INK = { high: "#c43745", mid: "#e5922a", low: "#2f9e6b" };
    const TONE_SOFT = { high: "#fff1f2", mid: "#fff6eb", low: "#eef8f3" };
    const TONE_EDGE = { high: "#f3b4b8", mid: "#f3d3a4", low: "#b7e0cc" };
    const rowLevel = {};
    function rememberLevel(key, level) {
      const tone = toneName(level);
      if (!key || !tone) return;
      rowLevel[key] = strongerTone(rowLevel[key] || "", tone);
    }
    ((gz && gz.rows) || []).forEach((row) => {
      rememberLevel(row.code, row.level);
      rememberLevel(row.name, row.level);
    });
    ((gz && gz.companies) || []).forEach((row) => rememberLevel(row.name, row.level));
    const alertTone = {};
    ((graph && graph.alerts) || []).forEach((item) => { alertTone[item.id] = toneName(item.level) || "high"; });
    function toneOfAlerts(ids) {
      let tone = "";
      (ids || []).forEach((id) => { tone = strongerTone(tone, alertTone[id] || ""); });
      return tone;
    }
    const quietPark = projectName === "遵义汇川区某物流园场平工程" && (params.get("from") === "agency" || params.get("role") === "招标代理");
    function toneOfNode(id, name, full) {
      if (quietPark && (id === "project" || name === projectName)) return "";
      let cited = "";
      ((graph && graph.alerts) || []).forEach((item) => {
        if ((item.subjects || []).indexOf(id) >= 0) cited = strongerTone(cited, toneName(item.level));
      });
      if (cited) return cited;
      return rowLevel[id] || rowLevel[full] || rowLevel[name] || (id === "project" && graph ? (rowLevel[graph.id] || rowLevel[projectName] || "") : "");
    }
    function withTone(item) {
      const tone = toneOfNode(item.id, item.name, item.full) || (item.warn ? "high" : "");
      return Object.assign({}, item, { warn: !!tone, tone: tone });
    }
    const quietEntry = projectName === "遵义汇川区某物流园场平工程" && (params.get("from") === "agency" || params.get("role") === "招标代理");
    const bidderItems = quietEntry || !graph ? [] : graph.bidders.slice();
    const expertItems = quietEntry || !graph ? [] : graph.experts.slice();
    const upper = { w: 260, h: 84 };
    const crowd = Math.max(bidderItems.length, expertItems.length, 1);
    const unit = { w: crowd >= 6 ? 96 : crowd >= 5 ? 104 : 136, h: 64 };
    const bidderGap = crowd >= 5 ? 12 : 14;
    function rowStart(count) {
      const span = count * unit.w + Math.max(0, count - 1) * bidderGap;
      return -span / 2 + unit.w / 2;
    }
    const bidderY = expertItems.length ? -300 : -190;
    const expertY = -190;
    const agencyView = params.get("from") === "agency" || params.get("role") === "招标代理";
    const portfolio = [];
    if (agencyView && agencyName && gz && gz.graphs) {
      Object.keys(gz.graphs).forEach((title) => {
        const item = gz.graphs[title];
        if ((item.agency || "") !== agencyName) return;
        portfolio.push({ title: title, sheet: item.id || title, item: item });
      });
    }
    const keepIds = new Set();
    let viewScale = 1;
    let floorRadius = 460;
    const layers = [];
    let owners = [{ name: ownerName, id: "owner" }];
    if (portfolio.length > 1) {
      owners = [];
      portfolio.forEach((entry) => {
        const name = entry.item.owner || "";
        if (!name || name === "贵州宏图城市建设投资有限公司" || owners.some((row) => row.name === name)) return;
        owners.push({ name: name, id: name === ownerName ? "owner" : "xo-" + owners.length });
      });
      if (!owners.length) owners = [{ name: ownerName, id: "owner" }];
      const ownerGap = 28;
      const ownerW = owners.length > 1 ? 220 : upper.w;
      const ownerSpan = owners.length * ownerW + Math.max(0, owners.length - 1) * ownerGap;
      const ownerStart = -ownerSpan / 2 + ownerW / 2;
      owners.forEach((entry, index) => {
        keepIds.add(entry.id);
        layers.push({
          id: "own-" + entry.id,
          title: "招标人",
          color: "#6d8cff",
          y: 168,
          x: owners.length > 1 ? ownerStart + index * (ownerW + ownerGap) : 0,
          w: ownerW,
          h: upper.h,
          items: [withTone({ id: entry.id, name: entry.name })]
        });
      });
    } else {
      layers.push({ id: "owner", title: "招标人", color: "#6d8cff", y: 150, x: 0, w: upper.w, h: upper.h, items: [withTone({ id: "owner", name: ownerName })] });
    }
    if (agencyName) {
      if (portfolio.length > 1) keepIds.add("agency");
      layers.push({ id: "agency", title: "招标代理", color: "#a07cff", y: 40, x: 0, w: upper.w, h: upper.h, items: [withTone({ id: "agency", name: agencyName })] });
    }
    if (portfolio.length > 1) {
      const count = portfolio.length;
      const gap = 12;
      const cardW = Math.max(124, Math.min(168, Math.floor((1020 - (count - 1) * gap) / count)));
      const cardH = 96;
      const span = count * cardW + (count - 1) * gap;
      const start = -span / 2 + cardW / 2;
      const current = portfolio.find((entry) => entry.title === projectName) || portfolio[0];
      const rest = portfolio.filter((entry) => entry !== current);
      const slots = new Array(count);
      let left = Math.floor((count - 1) / 2);
      let right = left + 1;
      slots[left] = current;
      left -= 1;
      rest.forEach((entry, index) => {
        if (index % 2 === 0 && right < count) slots[right++] = entry;
        else if (left >= 0) slots[left--] = entry;
        else slots[right++] = entry;
      });
      slots.forEach((entry, index) => {
        const nodeId = entry.title === projectName ? "project" : "xp-" + entry.sheet;
        keepIds.add(nodeId);
        layers.push({
          id: "prj-" + nodeId,
          title: "项目",
          color: "#46b9ec",
          y: -78,
          x: start + index * (cardW + gap),
          w: cardW,
          h: cardH,
          items: [withTone({ id: nodeId, name: entry.title, full: entry.sheet })]
        });
      });
      viewScale = Math.max(1, span / 760);
      floorRadius = Math.max(460, span / 2 + 80);
    } else {
      layers.push({ id: "project", title: "项目", color: "#46b9ec", y: -70, x: 0, w: upper.w, h: upper.h, items: [withTone({ id: "project", name: projectName })] });
    }
    bidderItems.forEach((item, index) => {
      layers.push({
        id: "bid-" + item.id,
        title: "投标人",
        color: "#8f9ede",
        y: bidderY,
        x: rowStart(bidderItems.length) + index * (unit.w + bidderGap),
        w: unit.w,
        h: unit.h,
        items: [withTone(item)]
      });
    });
    expertItems.forEach((item, index) => {
      layers.push({
        id: "exp-" + item.id,
        title: "专家",
        color: "#5eb8c9",
        y: expertY,
        x: rowStart(expertItems.length) + index * (unit.w + bidderGap),
        w: unit.w,
        h: unit.h,
        items: [withTone(item)]
      });
    });
    const links = ((graph && graph.links) ? graph.links.slice() : [
      { a: "owner", b: agencyName ? "agency" : "project" }
    ].concat(agencyName ? [{ a: "agency", b: "project" }] : []));
    if (portfolio.length > 1) {
      portfolio.forEach((entry) => {
        const nodeId = entry.title === projectName ? "project" : "xp-" + entry.sheet;
        if (nodeId !== "project") links.push({ a: "agency", b: nodeId, keep: true });
      });
      owners.forEach((entry) => {
        if (entry.id !== "owner") links.push({ a: entry.id, b: agencyName ? "agency" : "project", keep: true });
      });
    }

    const stage = document.getElementById("stage");
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(38, 1, 1, 5000);
    camera.position.set(60, 920 * viewScale, 1040 * viewScale);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(40, -40, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 900;
    controls.maxDistance = 2800;
    camera.lookAt(controls.target);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.25);
    sun.position.set(120, 520, 280);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xd6e4ff, 0.45);
    fill.position.set(-200, 180, -80);
    scene.add(fill);

    const anchors = new Map();

    function round(g, x, y, w, h, r) {
      g.beginPath();
      g.roundRect(x, y, w, h, r);
    }

    function roundedShape(w, h, r) {
      const shape = new THREE.Shape();
      const x = -w / 2;
      const y = -h / 2;
      const radius = Math.min(r, w / 2 - 0.5, h / 2 - 0.5);
      shape.moveTo(x + radius, y);
      shape.lineTo(x + w - radius, y);
      shape.absarc(x + w - radius, y + radius, radius, -Math.PI / 2, 0, false);
      shape.lineTo(x + w, y + h - radius);
      shape.absarc(x + w - radius, y + h - radius, radius, 0, Math.PI / 2, false);
      shape.lineTo(x + radius, y + h);
      shape.absarc(x + radius, y + h - radius, radius, Math.PI / 2, Math.PI, false);
      shape.lineTo(x, y + radius);
      shape.absarc(x + radius, y + radius, radius, Math.PI, Math.PI * 1.5, false);
      return shape;
    }

    function canvas2d(layer) {
      const scale = 2;
      const canvas = document.createElement("canvas");
      canvas.width = layer.w * scale;
      canvas.height = layer.h * scale;
      const g = canvas.getContext("2d");
      g.scale(scale, scale);
      g.textAlign = "center";
      g.textBaseline = "middle";
      return { canvas, g };
    }

    function textureOf(canvas) {
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function paintGlass(layer) {
      const { canvas, g } = canvas2d(layer);
      const grad = g.createLinearGradient(0, 0, layer.w, layer.h);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.5, mix(layer.color, "#ffffff", 0.28));
      grad.addColorStop(1, mix(layer.color, "#ffffff", 0.55));
      round(g, 1, 1, layer.w - 2, layer.h - 2, Math.min(14, layer.h * 0.2));
      g.fillStyle = grad;
      g.fill();
      g.lineWidth = 4;
      g.strokeStyle = layer.color;
      g.globalAlpha = 0.7;
      g.stroke();
      g.globalAlpha = 1;
      return textureOf(canvas);
    }

    function paintWinBadge(g, x, y) {
      const w = 36;
      const h = 16;
      g.save();
      g.beginPath();
      g.roundRect(x, y, w, h, h / 2);
      g.fillStyle = "#111111";
      g.fill();
      g.fillStyle = "#ffffff";
      g.font = "700 11px PingFang SC, Microsoft YaHei, sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText("中标", x + w / 2, y + h / 2 + 0.5);
      g.restore();
    }
    function paintLabels(layer, placed, involved) {
      const { canvas, g } = canvas2d(layer);
      g.clearRect(0, 0, layer.w, layer.h);
      const partial = involved && placed.some((item) => item.box);
      g.globalAlpha = 1;
      g.fillStyle = "#16324f";
      g.font = "650 12px PingFang SC, Microsoft YaHei, sans-serif";
      const winner = placed.length === 1 && placed[0].win;
      if (winner) {
        g.textAlign = "left";
        g.fillText(layer.title, 10, layer.h < 100 ? 16 : 22);
        g.textAlign = "center";
        paintWinBadge(g, layer.w - 42, 5);
      } else {
        g.fillText(layer.title, layer.w / 2, layer.h < 100 ? 16 : 22);
      }
      if (placed.length === 1 && !placed[0].box) {
        const size = layer.w < 180 ? 13 : layer.h < 100 ? 15 : 18;
        g.font = "650 " + size + "px PingFang SC, Microsoft YaHei, sans-serif";

    function quadEdges(rel) {
      const edges = [];
      for (let i = 0; i < rel.length; i += 1) {
        const a = rel[i];
        const b = rel[(i + 1) % rel.length];
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        let tx = b.x - a.x;
        let ty = b.y - a.y;
        const len = Math.hypot(tx, ty) || 1;
        tx /= len;
        ty /= len;
        let nx = ty;
        let ny = -tx;
        if (nx * mx + ny * my < 0) { nx = -nx; ny = -ny; }
        edges.push({ a, b, mx, my, nx, ny, tx, ty, len, gap: 220 });
      }
      return edges;
    }
    function rayGap(ox, oy, dx, dy, quads, skip) {
      let best = 220;
      for (let i = 0; i < quads.length; i += 1) {
        if (i === skip || !quads[i]) continue;
        const quad = quads[i];
        for (let k = 0; k < 4; k += 1) {
          const a = quad[k];
          const b = quad[(k + 1) % 4];
          const ex = b.x - a.x;
          const ey = b.y - a.y;
          const det = dx * ey - dy * ex;
          if (Math.abs(det) < 1e-5) continue;
          const t = ((a.x - ox) * ey - (a.y - oy) * ex) / det;
          const u = ((a.x - ox) * dy - (a.y - oy) * dx) / det;
          if (t > 2 && u >= 0 && u <= 1 && t < best) best = t;
        }
      }
      return best;
    }
    function labelSpan(text, edge) {
      const w = text.length * 11;
      const h = 12;
      return {
        along: Math.abs(edge.tx) * w + Math.abs(edge.ty) * h,
        out: Math.abs(edge.nx) * w + Math.abs(edge.ny) * h
      };
    }
    const opsLayer = document.createElement("div");
    opsLayer.className = "ops-layer";
    stage.appendChild(opsLayer);
    const scratch = new THREE.Vector3();
    function projectLocal(group, x, y) {
      scratch.set(x, y, 2.2);
      group.localToWorld(scratch);
      scratch.project(camera);
      const width = renderer.domElement.clientWidth;
      const height = renderer.domElement.clientHeight;
      return {
        x: (scratch.x * 0.5 + 0.5) * width,
        y: (-scratch.y * 0.5 + 0.5) * height,
        z: scratch.z
      };
    }
    layerViews.forEach((view) => {
      const names = OPS[opsKind(view.layer)] || [];
      const root = document.createElement("div");
      root.className = "node-ops";
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "ops-svg");
      svg.setAttribute("viewBox", "-420 -420 840 840");
      svg.setAttribute("overflow", "visible");
      const paths = names.map(() => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", OP_INK);
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        svg.appendChild(path);
        return path;
      });
      root.appendChild(svg);
      const labels = names.map((name) => {
        const span = document.createElement("span");
        span.className = "ops-lab";
        span.textContent = name;
        root.appendChild(span);
        return span;
      });
      opsLayer.appendChild(root);
      view.opsEl = root;
      view.opPaths = paths;
      view.opLabels = labels;
      view.reach = REACH_REST;
      view.reachTarget = REACH_REST;
      view.hoverBox = null;
    });
    let hotLayerId = "";
    function aimHot(next) {
      if (next === hotLayerId) return;
      hotLayerId = next;
      layerViews.forEach((view) => {
        const on = view.layer.id === hotLayerId;
        view.reachTarget = on ? REACH_HOT : REACH_REST;
        view.opsEl.classList.toggle("is-hot", on);
      });
    }
    function layoutOps() {
      const anyHot = !!hotLayerId;
      const geos = layerViews.map((view) => {
        view.reach += (view.reachTarget - view.reach) * 0.28;
        if (Math.abs(view.reachTarget - view.reach) < 0.25) view.reach = view.reachTarget;
        const group = view.group;
        group.updateWorldMatrix(true, false);
        const w = view.layer.w;
        const h = view.layer.h;
        const corners = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]].map((pair) => projectLocal(group, pair[0], pair[1]));
        const center = projectLocal(group, 0, 0);
        const hidden = corners.some((point) => point.z < -1 || point.z > 1);
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        corners.forEach((point) => {
          minX = Math.min(minX, point.x);
          minY = Math.min(minY, point.y);
          maxX = Math.max(maxX, point.x);
          maxY = Math.max(maxY, point.y);
        });
        const tooSmall = maxX - minX < 12 || maxY - minY < 8;
        if (hidden || tooSmall) {
          view.opsEl.hidden = true;
          view.hoverBox = null;
          return null;
        }
        view.opsEl.hidden = false;
        const rel = corners.map((point) => ({ x: point.x - center.x, y: point.y - center.y }));
        let halfDiag = 0;
        rel.forEach((point) => { halfDiag = Math.max(halfDiag, Math.hypot(point.x, point.y)); });
        return { view, corners, center, rel, minX, minY, maxX, maxY, halfDiag };
      });
      const quads = geos.map((geo) => geo && geo.corners);
      geos.forEach((geo, index) => {
        if (!geo) return;
        const view = geo.view;
        view.opsEl.style.transform = "translate(" + geo.center.x.toFixed(1) + "px," + geo.center.y.toFixed(1) + "px)";
        const edges = quadEdges(geo.rel);
        edges.forEach((edge) => {
          edge.gap = rayGap(geo.center.x + edge.mx, geo.center.y + edge.my, edge.nx, edge.ny, quads, index);
        });
        const count = view.opLabels.length;
        const buckets = edges.map(() => []);
        for (let n = 0; n < count; n += 1) {
          let best = 0;
          let score = -Infinity;
          edges.forEach((edge, edgeIndex) => {
            const used = buckets[edgeIndex].length;
            const room = Math.min(edge.gap, 200) - used * 22;
            const fit = edge.len / (used + 1);
            const value = room * 2 + Math.min(fit, 46) - (edge.gap < 16 ? 120 : 0);
            if (value > score) { score = value; best = edgeIndex; }
          });
          buckets[best].push(n);
        }
        const rest = {};
        buckets.forEach((ids, edgeIndex) => {
          if (!ids.length) return;
          const edge = edges[edgeIndex];
          const sideEdge = Math.abs(edge.nx) >= Math.abs(edge.ny);
          const spans = ids.map((id) => labelSpan(view.opLabels[id].textContent, edge));
          const rows = [];
          if (sideEdge) {
            rows.push(ids.map((id, ordinal) => ({ id, span: spans[ordinal] })));
          } else {
            let row = [];
            let used = 0;
            ids.forEach((id, ordinal) => {
              const along = spans[ordinal].along;
              const next = used + (row.length ? 4 : 0) + along;
              if (row.length && next > edge.len * 0.96) {
                rows.push(row);
                row = [];
                used = 0;
              }
              row.push({ id, span: spans[ordinal] });
              used += (row.length > 1 ? 4 : 0) + along;
            });
            if (row.length) rows.push(row);
          }
          rows.forEach((items, rowIndex) => {
            const total = items.reduce((sum, item) => sum + item.span.along, 0) + Math.max(0, items.length - 1) * 4;
            let cursor = -total / 2;
            items.forEach((item) => {
              const along = cursor + item.span.along / 2;
              cursor += item.span.along + 4;
              const out = 3 + item.span.out / 2 + rowIndex * 16;
              rest[item.id] = {
                x: edge.mx + edge.tx * along + edge.nx * out,
                y: edge.my + edge.ty * along + edge.ny * out,
                ax: edge.mx + edge.tx * along,
                ay: edge.my + edge.ty * along,
                tx: edge.tx,
                ty: edge.ty,
                nx: edge.nx,
                ny: edge.ny
              };
            });
          });
        });
        const sweep = (Math.PI * 2) / count;
        const grow = Math.max(0, Math.min(1, (view.reach - REACH_REST) / (REACH_HOT - REACH_REST)));
        const hotR = geo.halfDiag + 30;
        const hotHalf = count === 1 ? Math.PI * 0.9 : sweep * 0.38;
        const plate = view.labels.material.opacity;
        const hot = view.layer.id === hotLayerId;
        const dim = anyHot && !hot ? 0.16 : 1;
        view.opsEl.style.opacity = String((hot ? 1 : plate) * dim);
        view.hoverBox = { minX: geo.minX - 110, maxX: geo.maxX + 110, minY: geo.minY - 110, maxY: geo.maxY + 110 };
        view.opLabels.forEach((label, labelIndex) => {
          const spot = rest[labelIndex];
          const mid = count === 1 ? -Math.PI / 2 : -Math.PI / 2 + (labelIndex + 0.5) * sweep;
          if (!spot) {
            label.hidden = true;
            view.opPaths[labelIndex].setAttribute("d", "");
            return;
          }
          label.hidden = false;
          const textW = label.textContent.length * 11;
          const side = Math.abs(Math.cos(mid)) > Math.abs(Math.sin(mid));
          const extra = side ? textW / 2 + 8 : 14;
          const hx = Math.cos(mid) * (hotR + extra);
          const hy = Math.sin(mid) * (hotR + extra);
          const lx = spot.x + (hx - spot.x) * grow;
          const ly = spot.y + (hy - spot.y) * grow;
          label.style.transform = "translate(" + lx.toFixed(1) + "px," + ly.toFixed(1) + "px) translate(-50%,-50%)";
          const steps = 8;
          let d = "";
          for (let step = 0; step <= steps; step += 1) {
            const u = step / steps;
            const along = (u - 0.5) * 18;
            const rx = spot.ax + spot.tx * along + spot.nx * 2.5;
            const ry = spot.ay + spot.ty * along + spot.ny * 2.5;
            const ang = mid + (u - 0.5) * 2 * hotHalf;
            const px = rx + (Math.cos(ang) * hotR - rx) * grow;
            const py = ry + (Math.sin(ang) * hotR - ry) * grow;
            d += (step === 0 ? "M" : "L") + px.toFixed(1) + " " + py.toFixed(1);
          }
          const path = view.opPaths[labelIndex];
          path.setAttribute("d", d);
          path.setAttribute("stroke-width", (4.5 + grow * 3.5).toFixed(2));
        });
      });
    }
    renderer.domElement.addEventListener("pointermove", (event) => {
      const pick = pickAt(event);
      renderer.domElement.style.cursor = pick ? "pointer" : "";
      const rect = renderer.domElement.getBoundingClientRect();
      const px = event.clientX - rect.left;
      const py = event.clientY - rect.top;
      let next = "";
      if (pick && !pick.line) {
        const view = layerViews.find((item) => item.itemIds.indexOf(pick.id) >= 0);
        if (view) next = view.layer.id;
      }
      if (!next && hotLayerId) {
        const view = layerViews.find((item) => item.layer.id === hotLayerId);
        const box = view && view.hoverBox;
        if (box && px >= box.minX && px <= box.maxX && py >= box.minY && py <= box.maxY) next = hotLayerId;
      }
      aimHot(next);
    });
    renderer.domElement.addEventListener("pointerleave", () => aimHot(""));

    function resize() {
      const width = stage.clientWidth;
      const height = stage.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    resize();
    window.addEventListener("resize", resize);

    function frame() {
      dashMap.offset.y = -((performance.now() / 850) % 1);
      const travel = performance.now() / 2600;
      flows.forEach((flow) => {
        if (!flow.traveler.visible) return;
        const point = flow.curve.getPoint((travel + flow.offset) % 1);
        flow.traveler.position.copy(point);
        flow.halo.position.copy(point);
      });
      controls.update();
      camera.updateMatrixWorld();
      layoutOps();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
